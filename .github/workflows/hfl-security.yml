name: hfl-security

on:
  schedule:
    - cron: "40 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: hfl-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  krm:
    uses: highfivelabs/krm-ci/.github/workflows/krm-security.yml@4c56e10ceb2596971fa5b270633c5ed64b2edd1a # v1.2.6
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      ci-ref: 4c56e10ceb2596971fa5b270633c5ed64b2edd1a
      setup-command: "task upstream"
      govulncheck-packages: "./cmd/manager ./cmd/operator"
