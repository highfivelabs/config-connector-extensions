#
# On a v* tag: build the operator and manager images with ko (production
# builds, no -tags fakecloud), push them to the High Five Labs registry,
#
#   us-central1-docker.pkg.dev/<GCP_PROJECT>/hfl-oci/config-connector-extensions/operator:<tag>
#   us-central1-docker.pkg.dev/<GCP_PROJECT>/hfl-oci/config-connector-extensions/manager:<tag>
#
# and keep config/default resolved to those digests as the run's
# `install` artifact.
#
# It authenticates by Workload Identity Federation as
# the release account, repository variable RELEASE_SERVICE_ACCOUNT (only artifactregistry.writer on hfl-oci; it cannot create VMs), which may write to the registry. It runs
# only when the repository variable RELEASE_ENABLED is 'true', which is set
# once the WIF provider admits this repository's tags. Repository
# variables GCP_PROJECT, GCP_WORKLOAD_IDENTITY_PROVIDER and
# RELEASE_SERVICE_ACCOUNT name the registry's project and the identity.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: us-central1-docker.pkg.dev
  KO_DOCKER_REPO: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/hfl-oci/config-connector-extensions

jobs:
  images:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/factory-access
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      # Go from go.mod, and task, ko and kustomize at hack/ci/tools.sh's
      # pins (as task ci:tools installs them).
      - uses: ./.github/actions/tools

      # go.mod points into the Config Connector checkout.
      - name: task upstream
        run: task upstream

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Build and push the images
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: task release TAG="${TAG}" REGISTRY="${REGISTRY}" KO_DOCKER_REPO="${KO_DOCKER_REPO}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install
          path: dist/install.yaml
