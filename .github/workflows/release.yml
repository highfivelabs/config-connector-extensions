#
# On a v* tag: build the operator and manager images with ko (production
# builds, no -tags fakecloud), push them to the High Five Labs registry,
#
#   us-central1-docker.pkg.dev/hfl-dev-514205/hfl-oci/config-connector-extensions/operator:<tag>
#   us-central1-docker.pkg.dev/hfl-dev-514205/hfl-oci/config-connector-extensions/manager:<tag>
#
# and keep config/default resolved to those digests as the run's
# `install` artifact.
#
# It authenticates by Workload Identity Federation as
# factory-offload@hfl-dev-514205, which may write to the registry. It runs
# only when the repository variable RELEASE_ENABLED is 'true', which is set
# once the WIF provider admits this repository's tags.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KO_VERSION: v0.19.1
  KUSTOMIZE_VERSION: v5.7.1
  TASK_VERSION: v3.54.0
  REGISTRY: us-central1-docker.pkg.dev
  KO_DOCKER_REPO: us-central1-docker.pkg.dev/hfl-dev-514205/hfl-oci/config-connector-extensions

jobs:
  images:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install task, ko and kustomize
        run: |
          set -euo pipefail
          export GOBIN="${HOME}/.local/ci-tools"
          go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
          go install "github.com/google/ko@${KO_VERSION}"
          go install "sigs.k8s.io/kustomize/kustomize/v5@${KUSTOMIZE_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      # go.mod points into the Config Connector checkout.
      - name: task upstream
        run: task upstream

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/361760340954/locations/global/workloadIdentityPools/github/providers/factory
          service_account: factory-offload@hfl-dev-514205.iam.gserviceaccount.com
          token_format: access_token

      - name: Log ko in to the registry
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "${TOKEN}" | ko login "${REGISTRY}" --username oauth2accesstoken --password-stdin

      - name: Build and push the operator and manager images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          kustomize build config/default \
            | ko resolve --base-import-paths --tags "${TAG}" --platform linux/amd64,linux/arm64 -f - \
            > dist/install.yaml
          grep -E '^\s+(image|value): ' dist/install.yaml | grep "${KO_DOCKER_REPO}" | sort -u

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install
          path: dist/install.yaml
