# Branch protection requires the `ci` status.
name: hfl-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: hfl-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  krm:
    uses: highfivelabs/krm-ci/.github/workflows/krm-ci.yml@b49d5584e21700219849629730f89917c2039481 # v1.2.3
    permissions:
      contents: read
    with:
      ci-ref: b49d5584e21700219849629730f89917c2039481
      setup-command: ""
      lint-setup-command: "task upstream"
      check-command: "hack/ci/pr.sh check"
      e2e-command: "hack/ci/pr.sh e2e"
      free-disk: true
      timeout-minutes: 90
      sibling-repo: ""
      sibling-ref: ""
      licenses-packages: "./cmd/manager ./cmd/operator"
      govulncheck-packages: "./cmd/manager ./cmd/operator"
