          metadata:
            type: object
          spec:
            description: 'ComputeSecurityPolicyFieldsSpec is the fields of a security
              policy this object owns. A field left out is not owned: it is never
              read or written.'
            properties:
              adaptiveProtectionConfig:
                description: The part of the policy's Adaptive Protection configuration
                  this object owns.
                properties:
                  layer7DdosDefenseConfig:
                    description: The part of the Layer 7 DDoS defense configuration
                      this object owns.
                    properties:
                      thresholdConfigs:
                        description: 'Adaptive Protection''s detection and auto-deploy
                          thresholds, each named, owned whole: the list replaces the
                          policy''s (an empty list removes them). Layer 7 DDoS defense
                          (Config Connector''s adaptiveProtectionConfig.layer7DdosDefenseConfig.enable)
                          must be on.'
                        items:
                          properties:
                            autoDeployConfidenceThreshold:
                              type: number
                            autoDeployExpirationSec:
                              format: int32
                              type: integer
                            autoDeployImpactedBaselineThreshold:
                              type: number
                            autoDeployLoadThreshold:
                              type: number
                            detectionAbsoluteQps:
                              type: number
                            detectionLoadThreshold:
                              type: number
                            detectionRelativeToBaselineQps:
                              type: number
                            name:
                              description: The name must be 1-63 characters long,
                                and comply with RFC1035. The name must be unique within
                                the security policy.
                              maxLength: 63
                              minLength: 1
                              type: string
                            trafficGranularityConfigs:
                              description: Configuration options for enabling Adaptive
                                Protection to operate on specified granular traffic
                                units.
                              items:
                                properties:
                                  enableEachUniqueValue:
                                    description: If enabled, traffic matching each
                                      unique value for the specified type constitutes
                                      a separate traffic unit. It can only be set
                                      to true if `value` is empty.
                                    type: boolean
                                  type:
                                    description: 'Type of this configuration: HTTP_HEADER_HOST
                                      or HTTP_PATH.'
                                    enum:
                                    - HTTP_HEADER_HOST
                                    - HTTP_PATH
                                    type: string
                                  value:
                                    description: Requests that match this value constitute
                                      a granular traffic unit.
                                    type: string
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
