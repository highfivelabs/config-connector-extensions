                  ComputeSecurityPolicy by name (compute.cnrm.cloud.google.com), or
                  any global security policy by external, as "projects/{{projectID}}/global/securityPolicies/{{name}}".
                  The policy must exist; this object never creates or deletes it.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: A reference to an externally managed ComputeSecurityPolicy
                      resource. Should be in the format "projects/{{projectID}}/global/securityPolicies/{{name}}".
                    type: string
                  name:
                    description: The name of a ComputeSecurityPolicy resource.
                    type: string
                  namespace:
                    description: The namespace of a ComputeSecurityPolicy resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: resourceRef is immutable
                  rule: self == oldSelf
            required:
            - resourceRef
            type: object
            x-kubernetes-validations:
            - message: set adaptiveProtectionConfig or advancedOptionsConfig
              rule: has(self.adaptiveProtectionConfig) || has(self.advancedOptionsConfig)
