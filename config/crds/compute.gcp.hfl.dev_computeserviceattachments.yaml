    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'ComputeServiceAttachment is a compute.v1 resource (https://compute.googleapis.com/compute/v1/{parent}/regions/{region}/serviceAttachments/{id}),
          from its Discovery document compute.v1 (hack/discokind). Terraform''s google_compute_service_attachment.
          A Private Service Connect producer''s service attachment: the internal load
          balancer it publishes, its NAT subnets, and the consumer projects and networks
          it accepts.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              connectionPreference:
                description: |-
                  The connection preference of service attachment. The value can be set
                  to ACCEPT_AUTOMATIC. An ACCEPT_AUTOMATIC
                  service attachment is one that always accepts the connection from consumer
                  forwarding rules.

                  One of ACCEPT_AUTOMATIC, ACCEPT_MANUAL, CONNECTION_PREFERENCE_UNSPECIFIED.
                type: string
              consumerAcceptLists:
                description: Specifies which consumer projects or networks are allowed
                  to connect to the service attachment. Each project or network has
                  a connection limit. A given service attachment can manage connections
                  at either the project or network level. Therefore, both the accept
                  and reject lists for a given service attachment must contain either
                  only projects or only networks or only endpoints.
                items:
                  properties:
                    connectionLimit:
                      description: The value of the limit to set. For endpoint_url,
                        the limit should be no more than 1.
                      format: int64
                      type: integer
                    endpointUrl:
                      description: The URL for the PSC endpoint to accept
                      type: string
                    networkUrl:
                      description: The network URL for the network to set the limit
                        for.
                      type: string
                    projectIdOrNum:
                      description: The project id or number for the project to set
                        the limit for.
                      type: string
                  type: object
                type: array
              consumerRejectLists:
                description: Specifies a list of projects or networks that are not
                  allowed to connect to this service attachment. The project can be
                  specified using its project ID or project number and the network
                  can be specified using its URL. A given service attachment can manage
                  connections at either the project or network level. Therefore, both
                  the reject and accept lists for a given service attachment must
                  contain either only projects or only networks.
                items:
                  type: string
                type: array
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource.
                type: string
              domainNames:
                description: 'If specified, the domain name will be used during the
                  integration between the PSC connected endpoints and the Cloud DNS.
                  For example, this is a valid domain name: "p.mycompany.com.". Current
                  max number of domain names supported is 1.'
                items:
                  type: string
                type: array
                x-kubernetes-validations:
                - message: domainNames is immutable
                  rule: self == oldSelf
              enableProxyProtocol:
                description: If true, enable the proxy protocol which is for supplying
                  client TCP/IP address data in TCP connections that traverse proxies
                  on their way to destination servers.
                type: boolean
                x-kubernetes-validations:
                - message: enableProxyProtocol is immutable
                  rule: self == oldSelf
              metadata:
                additionalProperties:
                  type: string
                description: Metadata of the service attachment.
                type: object
              natIpsPerEndpoint:
                description: The number of NAT IP addresses to be allocated per connected
                  endpoint. If not specified, the default value is 1.
                format: int64
                type: integer
              natSubnets:
                description: An array of URLs where each entry is the URL of a subnet
                  provided by the service producer to use for NAT in this service
                  attachment.
                items:
                  type: string
                type: array
              projectRef:
                description: Immutable. The project the resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
                  rule: self == oldSelf
              propagatedConnectionLimit:
                description: The number of consumer spokes that connected Private
                  Service Connect endpoints can be propagated to through Network Connectivity
                  Center. This limit lets the service producer limit how many propagated
                  Private Service Connect connections can be established to this service
                  attachment from a single consumer. If the connection preference
                  of the service attachment is ACCEPT_MANUAL, the limit applies to
                  each project or network that is listed in the consumer accept list.
                  If the connection preference of the service attachment is ACCEPT_AUTOMATIC,
                  the limit applies to each project that contains a connected endpoint.
                  If unspecified, the default propagated connection limit is 250.
                format: int64
                type: integer
              reconcileConnections:
                description: This flag determines whether a consumer accept/reject
                  list change can reconcile the statuses of existing ACCEPTED or REJECTED
                  PSC endpoints. - If false, connection policy update will only affect
                  existing PENDING PSC endpoints. Existing ACCEPTED/REJECTED endpoints
                  will remain untouched regardless how the connection policy is modified
                  . - If true, update will affect both PENDING and ACCEPTED/REJECTED
                  PSC endpoints. For example, an ACCEPTED PSC endpoint will be moved
                  to REJECTED if its project is added to the reject list. For newly
                  created service attachment, this boolean defaults to false.
                type: boolean
              region:
                description: Immutable. The region, part of the resource's name ({parent}/regions/{region}/serviceAttachments/{id}).
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              resourceID:
                description: Immutable. The resource's ID, the last part of its name.
                  When unset, metadata.name is used.
                type: string
                x-kubernetes-validations:
                - message: resourceID is immutable
                  rule: self == oldSelf
              targetService:
                description: The URL of a service serving the endpoint identified
                  by this service attachment.
                type: string
                x-kubernetes-validations:
                - message: targetService is immutable
                  rule: self == oldSelf
            required:
            - projectRef
            - region
            type: object
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: The resource's name, {parent}/regions/{region}/serviceAttachments/{id}.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the controller.
                format: int64
                type: integer
              observedState:
                description: The API's read-only fields.
                properties:
                  connectedEndpoints:
                    description: Output only. [Output Only] An array of connections
                      for all the consumers connected to this service attachment.
                    items:
                      properties:
                        consumerNetwork:
                          description: The url of the consumer network.
                          type: string
                        endpoint:
                          description: The url of a connected endpoint.
                          type: string
                        endpointWithId:
                          description: The url of a connected endpoint with resource
                            id.
                          type: string
                        natIps:
                          description: NAT IPs of the connected PSC endpoint and those
                            of other endpoints propagated from it.
                          items:
                            type: string
                          type: array
                        propagatedConnectionCount:
                          description: The number of consumer Network Connectivity
                            Center spokes that the connected Private Service Connect
                            endpoint has propagated to.
                          format: int64
                          type: integer
                        pscConnectionId:
                          description: The PSC connection id of the connected endpoint.
                          type: string
                        status:
                          description: The status of a connected endpoint to this
                            service attachment.
                          type: string
                      type: object
                    type: array
                  creationTimestamp:
                    description: Output only. [Output Only] Creation timestamp inRFC3339
                      text format.
                    type: string
                  fingerprint:
                    description: Fingerprint of this resource. A hash of the contents
                      stored in this object. This field is used in optimistic locking.
                      This field will be ignored when inserting a ServiceAttachment.
                      An up-to-date fingerprint must be provided in order to patch/update
                      the ServiceAttachment; otherwise, the request will fail with
                      error 412 conditionNotMet. To see the latest fingerprint, make
                      a get() request to retrieve the ServiceAttachment.
                    type: string
                  id:
                    description: Output only. [Output Only] The unique identifier
                      for the resource type. The server generates this identifier.
                    type: string
                  kind:
                    description: Output only. [Output Only] Type of the resource.
                      Alwayscompute#serviceAttachment for service attachments.
                    type: string
                  pscServiceAttachmentId:
                    description: Output only. [Output Only] An 128-bit global unique
                      ID of the PSC service attachment.
                    properties:
                      high:
                        type: string
                      low:
                        type: string
                    type: object
                  region:
                    description: Output only. [Output Only] URL of the region where
                      the service attachment resides. This field applies only to the
                      region resource. You must specify this field as part of the
                      HTTP request URL. It is not settable as a field in the request
                      body.
                    type: string
                  selfLink:
                    description: Output only. [Output Only] Server-defined URL for
                      the resource.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
