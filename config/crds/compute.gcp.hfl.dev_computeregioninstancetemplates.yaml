apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations: {}
  creationTimestamp: null
  labels:
    gcp.hfl.dev/gap: "true"
  name: computeregioninstancetemplates.compute.gcp.hfl.dev
spec:
  group: compute.gcp.hfl.dev
  names:
    categories:
    - gcp
    - hfl
    kind: ComputeRegionInstanceTemplate
    listKind: ComputeRegionInstanceTemplateList
    plural: computeregioninstancetemplates
    shortNames:
    - hflcomputeregioninstancetemplate
    - hflcomputeregioninstancetemplates
    singular: computeregioninstancetemplate
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ComputeRegionInstanceTemplate is a compute.v1 resource (https://compute.googleapis.com/compute/v1/{parent}/regions/{region}/instanceTemplates/{id}),
          from its Discovery document compute.v1 (hack/discokind). Terraform's google_compute_region_instance_template.
          A regional instance template; Config Connector's ComputeInstanceTemplate
          is global only.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource.
                type: string
                x-kubernetes-validations:
                - message: description is immutable
                  rule: self == oldSelf
              projectRef:
                description: Immutable. The project the resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
                  rule: self == oldSelf
              properties:
                description: The instance properties for this instance template.
                properties:
                  advancedMachineFeatures:
                    description: Controls for advanced machine-related behavior features.
                      Note that for MachineImage, this is not supported yet.
                    properties:
                      enableNestedVirtualization:
                        description: Whether to enable nested virtualization or not
                          (default is false).
                        type: boolean
                      enableUefiNetworking:
                        description: Whether to enable UEFI networking for instance
                          creation.
                        type: boolean
                      performanceMonitoringUnit:
                        description: |-
                          Type of Performance Monitoring Unit requested on instance.

                          One of ARCHITECTURAL, ENHANCED, PERFORMANCE_MONITORING_UNIT_UNSPECIFIED, STANDARD.
                        type: string
                      threadsPerCore:
                        description: The number of threads per physical core. To disable
                          simultaneous multithreading (SMT) set this to 1. If unset,
                          the maximum number of threads supported per core by the
                          underlying processor is assumed.
                        format: int32
                        type: integer
                      turboMode:
                        description: 'Turbo frequency mode to use for the instance.
                          Supported modes include: * ALL_CORE_MAX Using empty string
                          or not setting this field will use the platform-specific
                          default turbo mode.'
                        type: string
                      visibleCoreCount:
                        description: The number of physical cores to expose to an
                          instance. Multiply by the number of threads per core to
                          compute the total number of virtual CPUs to expose to the
                          instance. If unset, the number of cores is inferred from
                          the instance's nominal CPU count and the underlying platform's
                          SMT width.
                        format: int32
                        type: integer
                    type: object
                  canIpForward:
                    description: Enables instances created based on these properties
                      to send packets with source IP addresses other than their own
                      and receive packets with destination IP addresses other than
                      their own. If these instances will be used as an IP gateway
                      or it will be set as the next-hop in a Route resource, specify
                      true. If unsure, leave this set tofalse. See theEnable IP forwarding
                      documentation for more information.
                    type: boolean
                  confidentialInstanceConfig:
                    description: Specifies the Confidential Instance options. Note
                      that for MachineImage, this is not supported yet.
                    properties:
                      confidentialInstanceType:
                        description: |-
                          Defines the type of technology used by the confidential instance.

                          One of BMSAI, CCA, CONFIDENTIAL_INSTANCE_TYPE_UNSPECIFIED, SEV, SEV_SNP, TDX.
                        type: string
                      confidentialParavisorConfig:
                        description: Defines a set of Confidential Paravisor (SVSM)
                          options.
                        properties:
                          confidentialTpmType:
                            description: |-
                              Defines the type of TPM to use for the confidential instance.

                              One of CONFIDENTIAL_TPM_TYPE_UNSPECIFIED, EPHEMERAL, NO_CC_TPM.
                            type: string
                          sevSnpIrqMode:
                            description: |-
                              Defines the IRQ mode to use for the confidential instance.

                              One of RESTRICTED, SEV_SNP_IRQ_MODE_UNSPECIFIED, UNRESTRICTED.
                            type: string
                        type: object
                      enableConfidentialCompute:
                        description: Defines whether the instance should have confidential
                          compute enabled. When enabled, the technology used defaults
                          to AMD SEV unless confidentialInstanceType is specified.
                        type: boolean
                    type: object
                  description:
                    description: An optional text description for the instances that
                      are created from these properties.
                    type: string
                  disks:
                    description: An array of disks that are associated with the instances
                      that are created from these properties.
                    items:
                      properties:
                        autoDelete:
                          description: Specifies whether the disk will be auto-deleted
                            when the instance is deleted (but not when the disk is
                            detached from the instance).
                          type: boolean
                        boot:
                          description: Indicates that this is a boot disk. The virtual
                            machine will use the first partition of the disk for its
                            root filesystem.
                          type: boolean
                        deviceName:
                          description: Specifies a unique device name of your choice
                            that is reflected into the/dev/disk/by-id/google-* tree
                            of a Linux operating system running within the instance.
                            This name can be used to reference the device for mounting,
                            resizing, and so on, from within the instance. If not
                            specified, the server chooses a default device name to
                            apply to this disk, in the form persistent-disk-x, where
                            x is a number assigned by Google Compute Engine. This
                            field is only applicable for persistent disks.
                          type: string
                        diskEncryptionKey:
                          description: 'Encrypts or decrypts a disk using acustomer-supplied
                            encryption key. If you are creating a new disk, this field
                            encrypts the new disk using an encryption key that you
                            provide. If you are attaching an existing disk that is
                            already encrypted, this field decrypts the disk using
                            the customer-supplied encryption key. If you encrypt a
                            disk using a customer-supplied key, you must provide the
                            same key again when you attempt to use this resource at
                            a later time. For example, you must provide the key when
                            you create a snapshot or an image from the disk or when
                            you attach the disk to a virtual machine instance. If
                            you do not provide an encryption key, then the disk will
                            be encrypted using an automatically generated key and
                            you do not need to provide a key to use the disk later.
                            Note: Instance templates do not storecustomer-supplied
                            encryption keys, so you cannot use your own keys to encrypt
                            disks in amanaged instance group. You cannot create VMs
                            that have disks with customer-supplied keys using the
                            bulk insert method.'
                          properties:
                            kmsKeyName:
                              description: 'The name of the encryption key that is
                                stored in Google Cloud KMS. For example: "kmsKeyName":
                                "projects/kms_project_id/locations/region/keyRings/
                                key_region/cryptoKeys/key The fully-qualifed key name
                                may be returned for resource GET requests. For example:
                                "kmsKeyName": "projects/kms_project_id/locations/region/keyRings/
                                key_region/cryptoKeys/key /cryptoKeyVersions/1'
                              type: string
                            kmsKeyServiceAccount:
                              description: 'The service account being used for the
                                encryption request for the given KMS key. If absent,
                                the Compute Engine default service account is used.
                                For example: "kmsKeyServiceAccount": "name@project_id.iam.gserviceaccount.com/'
                              type: string
                            rawKey:
                              description: '[DEPRECATED] CSEK is no longer supported.
                                Use CMEK instead. Specifies a 256-bit customer-supplied
                                encryption key, encoded in RFC 4648 base64 to either
                                encrypt or decrypt this resource. You can provide
                                either the rawKey or thersaEncryptedKey. For example:
                                "rawKey": "SGVsbG8gZnJvbSBHb29nbGUgQ2xvdWQgUGxhdGZvcm0="'
                              type: string
                            rsaEncryptedKey:
                              description: '[DEPRECATED] CSEK is no longer supported.
                                Use CMEK instead. Specifies an RFC 4648 base64 encoded,
                                RSA-wrapped 2048-bit customer-supplied encryption
                                key to either encrypt or decrypt this resource. You
                                can provide either the rawKey or thersaEncryptedKey.
                                For example: "rsaEncryptedKey": "ieCx/NcW06PcT7Ep1X6LUTc/hLvUDYyzSZPPVCVPTVEohpeHASqC8uw5TzyO9U+Fka9JFH
                                z0mBibXUInrC/jEk014kCK/NPjYgEMOyssZ4ZINPKxlUh2zn1bV+MCaTICrdmuSBTWlUUiFoD
                                D6PYznLwh8ZNdaheCeZ8ewEXgFQ8V+sDroLaN3Xs3MDTXQEMMoNUXMCZEIpg9Vtp9x2oe=="
                                The key must meet the following requirements before
                                you can provide it to Compute Engine: 1. The key is
                                wrapped using a RSA public key certificate provided
                                by Google. 2. After being wrapped, the key must be
                                encoded in RFC 4648 base64 encoding. Gets the RSA
                                public key certificate provided by Google at: https://cloud-certs.storage.googleapis.com/google-cloud-csek-ingress.pem'
                              type: string
                            sha256:
                              description: '[DEPRECATED] CSEK is no longer supported.
                                Use CMEK instead. [Output only] TheRFC 4648 base64
                                encoded SHA-256 hash of the customer-supplied encryption
                                key that protects this resource.'
                              type: string
                          type: object
                        diskSizeGb:
                          description: The size of the disk in GB.
                          format: int64
                          type: integer
                        forceAttach:
                          description: '[Input Only] Whether to force attach the regional
                            disk even if it''s currently attached to another instance.
                            If you try to force attach a zonal disk to an instance,
                            you will receive an error.'
                          type: boolean
                        guestOsFeatures:
                          description: A list of features to enable on the guest operating
                            system. Applicable only for bootable images. Read Enabling
                            guest operating system features to see a list of available
                            options.
                          items:
                            properties:
                              type:
                                description: |-
                                  The ID of a supported feature. To add multiple values, use commas to
                                  separate values. Set to one or more of the following values:
                                  - VIRTIO_SCSI_MULTIQUEUE
                                  - WINDOWS
                                  - MULTI_IP_SUBNET
                                  - UEFI_COMPATIBLE
                                  - GVNIC
                                  - SEV_CAPABLE
                                  - SUSPEND_RESUME_COMPATIBLE
                                  - SEV_LIVE_MIGRATABLE_V2
                                  - SEV_SNP_CAPABLE
                                  - TDX_CAPABLE
                                  - IDPF
                                  - SNP_SVSM_CAPABLE
                                  - CCA_CAPABLE
                                  - SUSPEND_SAFE_FPR
                                  For more information, see
                                  Enabling guest operating system features.

                                  One of BARE_METAL_LINUX_COMPATIBLE, BMSAI_CAPABLE, CCA_CAPABLE, FEATURE_TYPE_UNSPECIFIED, GVNIC, IDPF, MULTI_IP_SUBNET, SECURE_BOOT, SEV_CAPABLE, SEV_LIVE_MIGRATABLE, SEV_LIVE_MIGRATABLE_V2, SEV_SNP_CAPABLE, SNP_SVSM_CAPABLE, SUSPEND_SAFE_FPR, TDX_CAPABLE, UEFI_COMPATIBLE, VIRTIO_SCSI_MULTIQUEUE, WINDOWS.
                                type: string
                            type: object
                          type: array
                        initializeParams:
                          description: '[Input Only] Specifies the parameters for
                            a new disk that will be created alongside the new instance.
                            Use initialization parameters to create boot disks or
                            local SSDs attached to the new instance. This property
                            is mutually exclusive with the source property; you can
                            only define one or the other, but not both.'
                          properties:
                            architecture:
                              description: |-
                                The architecture of the attached disk. Valid values are
                                arm64 or x86_64.

                                One of ARCHITECTURE_UNSPECIFIED, ARM64, X86_64.
                              type: string
                            description:
                              description: An optional description. Provide this property
                                when creating the disk.
                              type: string
                            diskName:
                              description: Specifies the disk name. If not specified,
                                the default is to use the name of the instance. If
                                a disk with the same name already exists in the given
                                region, the existing disk is attached to the new instance
                                and the new disk is not created.
                              type: string
                            diskSizeGb:
                              description: Specifies the size of the disk in base-2
                                GB. The size must be at least 10 GB. If you specify
                                a sourceImage, which is required for boot disks, the
                                default size is the size of the sourceImage. If you
                                do not specify a sourceImage, the default disk size
                                is 500 GB.
                              format: int64
                              type: integer
                            diskType:
                              description: 'Specifies the disk type used for the boot
                                disk or an additional data disk. For valid disk type
                                values, see Supported types for Hyperdisk volumes
                                and Persistent Disk type variables. When creating
                                a single instance, you must provide either the full
                                or partial URL of the disk type. For example, the
                                following values are valid: - https://www.googleapis.com/compute/v1/projects/project/zones/zone/diskTypes/diskType
                                - projects/project/zones/zone/diskTypes/diskType -
                                zones/zone/diskTypes/diskType When creating an instance
                                template, instance flexibility policy, or when creating
                                or updating an all-instances configuration, you specify
                                the disk type without a URL, for example, hyperdisk-balanced.
                                If you omit this field for a disk, the default disk
                                type depends on the instance''s machine series, as
                                follows. - For first- and second-generation machine
                                series like N1, N2, T2, and M1, the default disk type
                                is Standard Persistent Disk (pd-standard). - For C3,
                                C3D, and M3 the default is Balanced Persistent Disk
                                (pd-balanced). - For other third-generation machine
                                series like A3, H3, Z3, all fourth-generation types
                                like C4, N4, M4, and newer machine series, the default
                                is Hyperdisk Balanced (hyperdisk-balanced). The disk
                                type you specify must be compatible with the instance''s
                                machine series. For a list of machine series that
                                support Persistent Disk, see Machine series support
                                for Persistent Disk. For a list of machine series
                                that support Hyperdisk, seeMachine series support
                                for Hyperdisk.'
                              type: string
                            enableConfidentialCompute:
                              description: Whether this disk is using confidential
                                compute mode.
                              type: boolean
                            labels:
                              additionalProperties:
                                type: string
                              description: Labels to apply to this disk. These can
                                be later modified by thedisks.setLabels method. This
                                field is only applicable for persistent disks.
                              type: object
                            licenses:
                              description: A list of publicly visible licenses. Reserved
                                for Google's use.
                              items:
                                type: string
                              type: array
                            onUpdateAction:
                              description: |-
                                Specifies which action to take on instance update with this disk. Default
                                is to use the existing disk.

                                One of RECREATE_DISK, RECREATE_DISK_IF_SOURCE_CHANGED, USE_EXISTING_DISK.
                              type: string
                            provisionedIops:
                              description: Indicates how many IOPS to provision for
                                the disk. This sets the number of I/O operations per
                                second that the disk can handle. Values must be between
                                10,000 and 120,000. For more details, see theExtreme
                                persistent disk documentation.
                              format: int64
                              type: integer
                            provisionedThroughput:
                              description: Indicates how much throughput to provision
                                for the disk. This sets the number of throughput mb
                                per second that the disk can handle. Values must greater
                                than or equal to 1.
                              format: int64
                              type: integer
                            replicaZones:
                              description: Required for each regional disk associated
                                with the instance. Specify the URLs of the zones where
                                the disk should be replicated to. You must provide
                                exactly two replica zones, and one zone must be the
                                same as the instance zone.
                              items:
                                type: string
                              type: array
                            resourceManagerTags:
                              additionalProperties:
                                type: string
                              description: Input only. Resource manager tags to be
                                bound to the disk. Tag keys and values have the same
                                definition as resource manager tags. Keys and values
                                can be either in numeric format, such as `tagKeys/{tag_key_id}`
                                and `tagValues/{tag_value_id}` or in namespaced format
                                such as `{org_id|project_id}/{tag_key_short_name}`
                                and `{tag_value_short_name}`. The field is ignored
                                (both PUT & PATCH) when empty.
                              type: object
                            resourcePolicies:
                              description: Resource policies applied to this disk
                                for automatic snapshot creations. Specified using
                                the full or partial URL. For instance template, specify
                                only the resource policy name.
                              items:
                                type: string
                              type: array
                            sourceImage:
                              description: 'The source image to create this disk.
                                When creating a new instance boot disk, one of initializeParams.sourceImage
                                orinitializeParams.sourceSnapshot or disks.source
                                is required. To create a disk with one of the public
                                operating system images, specify the image by its
                                family name. For example, specifyfamily/debian-9 to
                                use the latest Debian 9 image: projects/debian-cloud/global/images/family/debian-9
                                Alternatively, use a specific version of a public
                                operating system image: projects/debian-cloud/global/images/debian-9-stretch-vYYYYMMDD
                                To create a disk with a custom image that you created,
                                specify the image name in the following format: global/images/my-custom-image
                                You can also specify a custom image by its image family,
                                which returns the latest version of the image in that
                                family. Replace the image name with family/family-name:
                                global/images/family/my-image-family If the source
                                image is deleted later, this field will not be set.'
                              type: string
                            sourceImageEncryptionKey:
                              description: Thecustomer-supplied encryption key of
                                the source image. Required if the source image is
                                protected by a customer-supplied encryption key. InstanceTemplate
                                and InstancePropertiesPatch do not storecustomer-supplied
                                encryption keys, so you cannot create disks for instances
                                in a managed instance group if the source images are
                                encrypted with your own keys.
                              properties:
                                kmsKeyName:
                                  description: 'The name of the encryption key that
                                    is stored in Google Cloud KMS. For example: "kmsKeyName":
                                    "projects/kms_project_id/locations/region/keyRings/
                                    key_region/cryptoKeys/key The fully-qualifed key
                                    name may be returned for resource GET requests.
                                    For example: "kmsKeyName": "projects/kms_project_id/locations/region/keyRings/
                                    key_region/cryptoKeys/key /cryptoKeyVersions/1'
                                  type: string
                                kmsKeyServiceAccount:
                                  description: 'The service account being used for
                                    the encryption request for the given KMS key.
                                    If absent, the Compute Engine default service
                                    account is used. For example: "kmsKeyServiceAccount":
                                    "name@project_id.iam.gserviceaccount.com/'
                                  type: string
                                rawKey:
                                  description: '[DEPRECATED] CSEK is no longer supported.
                                    Use CMEK instead. Specifies a 256-bit customer-supplied
                                    encryption key, encoded in RFC 4648 base64 to
                                    either encrypt or decrypt this resource. You can
                                    provide either the rawKey or thersaEncryptedKey.
                                    For example: "rawKey": "SGVsbG8gZnJvbSBHb29nbGUgQ2xvdWQgUGxhdGZvcm0="'
                                  type: string
                                rsaEncryptedKey:
                                  description: '[DEPRECATED] CSEK is no longer supported.
                                    Use CMEK instead. Specifies an RFC 4648 base64
                                    encoded, RSA-wrapped 2048-bit customer-supplied
                                    encryption key to either encrypt or decrypt this
                                    resource. You can provide either the rawKey or
                                    thersaEncryptedKey. For example: "rsaEncryptedKey":
                                    "ieCx/NcW06PcT7Ep1X6LUTc/hLvUDYyzSZPPVCVPTVEohpeHASqC8uw5TzyO9U+Fka9JFH
                                    z0mBibXUInrC/jEk014kCK/NPjYgEMOyssZ4ZINPKxlUh2zn1bV+MCaTICrdmuSBTWlUUiFoD
                                    D6PYznLwh8ZNdaheCeZ8ewEXgFQ8V+sDroLaN3Xs3MDTXQEMMoNUXMCZEIpg9Vtp9x2oe=="
                                    The key must meet the following requirements before
                                    you can provide it to Compute Engine: 1. The key
                                    is wrapped using a RSA public key certificate
                                    provided by Google. 2. After being wrapped, the
                                    key must be encoded in RFC 4648 base64 encoding.
                                    Gets the RSA public key certificate provided by
                                    Google at: https://cloud-certs.storage.googleapis.com/google-cloud-csek-ingress.pem'
                                  type: string
                                sha256:
                                  description: '[DEPRECATED] CSEK is no longer supported.
                                    Use CMEK instead. [Output only] TheRFC 4648 base64
                                    encoded SHA-256 hash of the customer-supplied
                                    encryption key that protects this resource.'
                                  type: string
                              type: object
                            sourceSnapshot:
                              description: 'The source snapshot to create this disk.
                                When creating a new instance boot disk, one of initializeParams.sourceSnapshot
                                orinitializeParams.sourceImage or disks.source is
                                required. To create a disk with a snapshot that you
                                created, specify the snapshot name in the following
                                format: global/snapshots/my-backup If the source snapshot
                                is deleted later, this field will not be set. Note:
                                You cannot create VMs in bulk using a snapshot as
                                the source. Use an image instead when you create VMs
                                using the bulk insert method.'
                              type: string
                            sourceSnapshotEncryptionKey:
                              description: Thecustomer-supplied encryption key of
                                the source snapshot.
                              properties:
                                kmsKeyName:
                                  description: 'The name of the encryption key that
                                    is stored in Google Cloud KMS. For example: "kmsKeyName":
                                    "projects/kms_project_id/locations/region/keyRings/
                                    key_region/cryptoKeys/key The fully-qualifed key
                                    name may be returned for resource GET requests.
                                    For example: "kmsKeyName": "projects/kms_project_id/locations/region/keyRings/
                                    key_region/cryptoKeys/key /cryptoKeyVersions/1'
                                  type: string
                                kmsKeyServiceAccount:
                                  description: 'The service account being used for
                                    the encryption request for the given KMS key.
                                    If absent, the Compute Engine default service
                                    account is used. For example: "kmsKeyServiceAccount":
                                    "name@project_id.iam.gserviceaccount.com/'
                                  type: string
                                rawKey:
                                  description: '[DEPRECATED] CSEK is no longer supported.
                                    Use CMEK instead. Specifies a 256-bit customer-supplied
                                    encryption key, encoded in RFC 4648 base64 to
                                    either encrypt or decrypt this resource. You can
                                    provide either the rawKey or thersaEncryptedKey.
                                    For example: "rawKey": "SGVsbG8gZnJvbSBHb29nbGUgQ2xvdWQgUGxhdGZvcm0="'
                                  type: string
                                rsaEncryptedKey:
                                  description: '[DEPRECATED] CSEK is no longer supported.
                                    Use CMEK instead. Specifies an RFC 4648 base64
                                    encoded, RSA-wrapped 2048-bit customer-supplied
                                    encryption key to either encrypt or decrypt this
                                    resource. You can provide either the rawKey or
                                    thersaEncryptedKey. For example: "rsaEncryptedKey":
                                    "ieCx/NcW06PcT7Ep1X6LUTc/hLvUDYyzSZPPVCVPTVEohpeHASqC8uw5TzyO9U+Fka9JFH
                                    z0mBibXUInrC/jEk014kCK/NPjYgEMOyssZ4ZINPKxlUh2zn1bV+MCaTICrdmuSBTWlUUiFoD
                                    D6PYznLwh8ZNdaheCeZ8ewEXgFQ8V+sDroLaN3Xs3MDTXQEMMoNUXMCZEIpg9Vtp9x2oe=="
                                    The key must meet the following requirements before
                                    you can provide it to Compute Engine: 1. The key
                                    is wrapped using a RSA public key certificate
                                    provided by Google. 2. After being wrapped, the
                                    key must be encoded in RFC 4648 base64 encoding.
                                    Gets the RSA public key certificate provided by
                                    Google at: https://cloud-certs.storage.googleapis.com/google-cloud-csek-ingress.pem'
                                  type: string
                                sha256:
