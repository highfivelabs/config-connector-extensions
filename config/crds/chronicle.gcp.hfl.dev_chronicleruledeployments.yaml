    listKind: ChronicleRuleDeploymentList
    plural: chronicleruledeployments
    shortNames:
    - hflchronicleruledeployment
    - hflchronicleruledeployments
    singular: chronicleruledeployment
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
