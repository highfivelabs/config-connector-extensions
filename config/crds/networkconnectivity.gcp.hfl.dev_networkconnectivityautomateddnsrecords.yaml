                      means a DNS record with the specified `hostname`, `dns_suffix`,
                      and `type` does not currently exist in Cloud DNS. This could
                      be because the `AutomatedDnsRecord` has never been successfully
                      programmed, has been deleted, or there was an error during provisioning.
                      * **Presence:** If `current_config` is present: * It can be
                      different from the `original_config`. This can happen due to
                      several reasons: * Out-of-band changes: A consumer might have
                      directly modified the DNS record in Cloud DNS. * `OVERWRITE`
                      operations from other `AutomatedDnsRecord` resources: Another
                      `AutomatedDnsRecord` with the same identifying attributes (`hostname`,
                      `dns_suffix`, `type`) but a different configuration might have
                      overwritten the record using `insert_mode: OVERWRITE`. Therefore,
                      the presence of `current_config` indicates that a corresponding
                      DNS record exists, but its values (TTL and RRData) might not
                      always align with the `original_config` of the AutomatedDnsRecord.'
