apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    gcp.hfl.dev/upstream-kind: sql.cnrm.cloud.google.com/SQLUser
  creationTimestamp: null
  labels:
    gcp.hfl.dev/gap: "true"
  name: sqlusers.sql.gcp.hfl.dev
spec:
  group: sql.gcp.hfl.dev
  names:
    categories:
    - gcp
    - hfl
    kind: SQLUser
    listKind: SQLUserList
    plural: sqlusers
    shortNames:
    - hflsqluser
    - hflsqlusers
    singular: sqluser
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: SQLUser is the Schema for the sql API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              databaseRoles:
                description: A list of database roles to be assigned to the user.
                  This option is only available for MySQL and PostgreSQL instances.
                  The controller grants exactly these roles, revoking roles that were
                  granted before and are not in the list (Terraform's google_sql_user.database_roles
                  does the same).
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              host:
                description: Immutable. The host the user can connect from. This is
                  only supported for MySQL instances. Don't set this field for PostgreSQL
                  instances. Can be an IP address. Changing this forces a new resource
                  to be created.
                type: string
              instanceRef:
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The SQLInstance selfLink, when not managed by Config
                      Connector.
                    type: string
                  name:
                    description: The `name` field of a `SQLInstance` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `SQLInstance` resource.
                    type: string
                type: object
              password:
                description: The password for the user. Can be updated. For Postgres
                  instances this is a Required field, unless type is set to either
                  CLOUD_IAM_USER or CLOUD_IAM_SERVICE_ACCOUNT.
                properties:
                  value:
                    description: Value of the field. Cannot be used if 'valueFrom'
                      is specified.
                    type: string
                  valueFrom:
                    description: Source for the field's value. Cannot be used if 'value'
                      is specified.
                    properties:
                      secretKeyRef:
                        description: Reference to a value with the given key in the
                          given Secret in the resource's namespace.
                        properties:
                          key:
                            description: Key that identifies the value to be extracted.
                            type: string
                          name:
                            description: Name of the Secret to extract a value from.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                type: object
              passwordPolicy:
                properties:
                  allowedFailedAttempts:
                    description: Number of failed attempts allowed before the user
                      get locked.
                    format: int64
                    type: integer
                  enableFailedAttemptsCheck:
                    description: If true, the check that will lock user after too
                      many failed login attempts will be enabled.
                    type: boolean
                  enablePasswordVerification:
                    description: If true, the user must specify the current password
                      before changing the password. This flag is supported only for
                      MySQL.
                    type: boolean
                  passwordExpirationDuration:
                    description: Password expiration duration with one week grace
                      period.
                    type: string
                  status:
                    items:
                      properties:
                        locked:
                          description: If true, user does not have login privileges.
                          type: boolean
                        passwordExpirationTime:
                          description: Password expiration duration with one week
                            grace period.
                          type: string
                      type: object
                    type: array
                type: object
              resourceID:
                description: Immutable. Optional. The name of the resource. Used for
                  creation and acquisition. When unset, the value of `metadata.name`
                  is used as the default.
                type: string
              type:
                description: Immutable. The user type. It determines the method to
                  authenticate the user during login. The default is the database's
                  built-in user type. Flags include "BUILT_IN", "CLOUD_IAM_USER",
                  or "CLOUD_IAM_SERVICE_ACCOUNT".
                type: string
            required:
            - instanceRef
            type: object
          status:
            properties:
              appliedDatabaseRoles:
                description: The database roles the controller last granted, with
                  revokeExistingRoles, from spec.databaseRoles. The Cloud SQL Admin
                  API is not relied on to return a user's roles, so this is what the
                  controller compares spec.databaseRoles against.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the SQLUser's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              sqlServerUserDetails:
                items:
                  properties:
                    disabled:
                      description: If the user has been disabled.
                      type: boolean
                    serverRoles:
                      description: The server roles for this user in the database.
                      items:
                        type: string
                      type: array
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
