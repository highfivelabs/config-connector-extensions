            type: object
            x-kubernetes-validations:
            - message: set at least one of indexConfigs, restrictedFields and cmekSettings
              rule: has(self.indexConfigs) || has(self.restrictedFields) || has(self.cmekSettings)
          status:
            description: LoggingLogBucketFieldsStatus defines the observed state.
            properties:
              cmekServiceAccountID:
                description: The service account the Log Router uses with the bucket's
                  CMEK key, as the API reports it once cmekSettings is set.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
