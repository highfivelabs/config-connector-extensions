                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
                  rule: self == oldSelf
              recaptchaOptionsConfig:
                properties:
                  redirectSiteKey:
                    description: An optional field to supply a reCAPTCHA site key
                      to be used for all the rules using the redirect action with
                      the type of GOOGLE_RECAPTCHA under the security policy. The
                      specified site key needs to be created from the reCAPTCHA API.
                      The user is responsible for the validity of the specified site
                      key. If not specified, a Google-managed site key is used. This
                      field is only supported in Global Security Policies of type
                      CLOUD_ARMOR.
                    type: string
                type: object
              region:
                description: Immutable. The region, part of the resource's name ({parent}/regions/{region}/securityPolicies/{id}).
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              resourceID:
                description: Immutable. The resource's ID, the last part of its name.
                  When unset, metadata.name is used.
                type: string
                x-kubernetes-validations:
                - message: resourceID is immutable
                  rule: self == oldSelf
              type:
                description: |-
                  The type indicates the intended use of the security policy.
                  - CLOUD_ARMOR: Cloud Armor backend security policies can
                  be configured to filter incoming HTTP requests targeting backend services.
                  They filter requests before they hit the origin servers.
                  - CLOUD_ARMOR_EDGE: Cloud Armor edge security policies can
                  be configured to filter incoming HTTP requests targeting backend services
                  (including Cloud CDN-enabled) as well as backend buckets (Cloud Storage).
                  They filter requests before the request is served from Google's cache.
                  - CLOUD_ARMOR_INTERNAL_SERVICE (preview only): Cloud Armor
                  internal service policies can be configured to filter HTTP requests
                  targeting services managed by Traffic Director in a service mesh. They
                  filter requests before the request is served from the application.
                  - CLOUD_ARMOR_NETWORK: Cloud Armor network policies
                  can be configured to filter packets targeting network load balancing
                  resources such as backend services, target pools, target instances, and
                  instances with external IPs. They filter requests before the request is
                  served from the application.
                  This field can be set only at resource creation time.

                  One of CLOUD_ARMOR, CLOUD_ARMOR_EDGE, CLOUD_ARMOR_NETWORK.
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
              userDefinedFields:
                description: 'Definitions of user-defined fields for CLOUD_ARMOR_NETWORK
                  policies. A user-defined field consists of up to 4 bytes extracted
                  from a fixed offset in the packet, relative to the IPv4, IPv6, TCP,
                  or UDP header, with an optional mask to select certain bits. Rules
                  may then specify matching values for these fields. Example: userDefinedFields:
                  - name: "ipv4_fragment_offset" base: IPV4 offset: 6 size: 2 mask:
                  "0x1fff"'
                items:
                  properties:
                    base:
                      description: |-
                        The base relative to which 'offset' is measured. Possible values are:
                        - IPV4: Points to the beginning of the IPv4 header.
                        - IPV6: Points to the beginning of the IPv6 header.
                        - TCP: Points to the beginning of the TCP header, skipping
                        over any IPv4 options or IPv6 extension headers. Not present for
                        non-first fragments.
                        - UDP: Points to the beginning of the UDP header, skipping
                        over any IPv4 options or IPv6 extension headers. Not present for
                        non-first fragments.
                        required

                        One of IPV4, IPV6, TCP, UDP.
                      type: string
                    mask:
                      description: If specified, apply this mask (bitwise AND) to
                        the field to ignore bits before matching. Encoded as a hexadecimal
                        number (starting with "0x"). The last byte of the field (in
                        network byte order) corresponds to the least significant byte
                        of the mask.
                      type: string
                    name:
                      description: The name of this field. Must be unique within the
                        policy.
                      type: string
                    offset:
                      description: Offset of the first byte of the field (in network
                        byte order) relative to 'base'.
                      format: int32
                      type: integer
                    size:
                      description: 'Size of the field in bytes. Valid values: 1-4.'
                      format: int32
                      type: integer
                  type: object
                type: array
            required:
            - projectRef
            - region
            type: object
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
