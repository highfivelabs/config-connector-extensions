                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: The resource's name, {parent}/regions/{region}/securityPolicies/{id}.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the controller.
                format: int64
                type: integer
              observedState:
                description: The API's read-only fields.
                properties:
                  creationTimestamp:
                    description: Output only. [Output Only] Creation timestamp inRFC3339
                      text format.
                    type: string
                  fingerprint:
                    description: Specifies a fingerprint for this resource, which
                      is essentially a hash of the metadata's contents and used for
                      optimistic locking. The fingerprint is initially generated by
                      Compute Engine and changes after every request to modify or
                      update metadata. You must always provide an up-to-date fingerprint
                      hash in order to update or change metadata, otherwise the request
                      will fail with error412 conditionNotMet. To see the latest fingerprint,
                      make get() request to the security policy.
                    type: string
                  id:
                    description: Output only. [Output Only] The unique identifier
                      for the resource. This identifier is defined by the server.
                    type: string
                  kind:
                    description: Output only. [Output only] Type of the resource.
                      Alwayscompute#securityPolicyfor security policies
                    type: string
                  parent:
                    description: Output only. [Output Only] The parent of the security
