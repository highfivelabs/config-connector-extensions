    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'ComputeRegionSecurityPolicy is a compute.v1 resource (https://compute.googleapis.com/compute/v1/{parent}/regions/{region}/securityPolicies/{id}),
          from its Discovery document compute.v1 (hack/discokind). Terraform''s google_compute_region_security_policy.
          A regional Cloud Armor security policy: a regional external load balancer''s
          (CLOUD_ARMOR) or a network edge policy (CLOUD_ARMOR_NETWORK) with DDoS protection
          and user-defined fields. Its rules are not part of it.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              adaptiveProtectionConfig:
                properties:
                  layer7DdosDefenseConfig:
                    description: If set to true, enables Cloud Armor Machine Learning.
                    properties:
                      enable:
                        description: If set to true, enables CAAP for L7 DDoS detection.
                          This field is only supported in Global Security Policies
                          of type CLOUD_ARMOR.
                        type: boolean
                      ruleVisibility:
                        description: |-
                          Rule visibility can be one of the following:
                          STANDARD - opaque rules. (default)
                          PREMIUM - transparent rules.
                          This field is only supported in Global Security Policies of type
                          CLOUD_ARMOR.

                          One of PREMIUM, STANDARD.
                        type: string
                      thresholdConfigs:
                        description: Configuration options for layer7 adaptive protection
                          for various customizable thresholds.
                        items:
                          properties:
                            autoDeployConfidenceThreshold:
                              type: number
                            autoDeployExpirationSec:
                              format: int32
                              type: integer
                            autoDeployImpactedBaselineThreshold:
                              type: number
                            autoDeployLoadThreshold:
                              type: number
                            detectionAbsoluteQps:
                              type: number
                            detectionLoadThreshold:
                              type: number
                            detectionRelativeToBaselineQps:
                              type: number
                            name:
                              description: The name must be 1-63 characters long,
                                and comply withRFC1035. The name must be unique within
                                the security policy.
                              type: string
                            trafficGranularityConfigs:
                              description: Configuration options for enabling Adaptive
                                Protection to operate on specified granular traffic
                                units.
                              items:
                                properties:
                                  enableEachUniqueValue:
                                    description: If enabled, traffic matching each
                                      unique value for the specified type constitutes
                                      a separate traffic unit. It can only be set
                                      to true if `value` is empty.
                                    type: boolean
                                  type:
                                    description: |-
                                      Type of this configuration.

                                      One of HTTP_HEADER_HOST, HTTP_PATH, UNSPECIFIED_TYPE.
                                    type: string
                                  value:
                                    description: Requests that match this value constitute
                                      a granular traffic unit.
                                    type: string
                                type: object
                              type: array
                          type: object
                        type: array
                    type: object
                type: object
              advancedOptionsConfig:
                properties:
                  jsonCustomConfig:
                    description: Custom configuration to apply the JSON parsing. Only
                      applicable when json_parsing is set to STANDARD.
                    properties:
                      contentTypes:
                        description: 'A list of custom Content-Type header values
                          to apply the JSON parsing. As per RFC 1341, a Content-Type
                          header value has the following format: Content-Type := type
                          "/" subtype *[";" parameter] When configuring a custom Content-Type
                          header value, only the type/subtype needs to be specified,
                          and the parameters should be excluded.'
                        items:
                          type: string
                        type: array
                    type: object
                  jsonParsing:
                    description: One of DISABLED, STANDARD, STANDARD_WITH_GRAPHQL.
                    type: string
                  logLevel:
                    description: One of NORMAL, VERBOSE.
                    type: string
                  requestBodyInspectionSize:
                    description: The maximum request size chosen by the customer with
                      Waf enabled. Values supported are "8KB", "16KB, "32KB", "48KB"
                      and "64KB". Values are case insensitive.
                    type: string
                  userIpRequestHeaders:
                    description: An optional list of case-insensitive request header
                      names to use for resolving the callers client IP address.
                    items:
                      type: string
                    type: array
                type: object
              ddosProtectionConfig:
                properties:
                  ddosAdaptiveProtection:
                    description: One of DDOS_ADAPTIVE_PROTECTION_UNSPECIFIED, DISABLED,
                      ENABLED, PREVIEW, UNSPECIFIED_ADAPTIVE_PROTECTION.
                    type: string
                  ddosImpactedBaselineThreshold:
                    description: DDoS Protection for Network Load Balancers (and VMs
                      with public IPs) builds DDoS mitigations that minimize collateral
                      damage. It quantifies this as the fraction of a non-abuse baseline
                      that's inadvertently blocked. Rules whose collateral damage
                      exceeds ddosImpactedBaselineThreshold will not be deployed.
                      Using a lower value will prioritize keeping collateral damage
                      low, possibly at the cost of its effectiveness in rate limiting
                      some or all of the attack. It should typically be unset, so
                      Advanced DDoS (and Adaptive Protection) uses the best mitigation
                      it can find. Setting the threshold is advised if there are logs
                      for false positive detections with high collateral damage, and
                      will cause Advanced DDoS to attempt to find a less aggressive
                      rule that satisfies the constraint. If a suitable rule cannot
                      be found, the system falls back to either no mitigation for
                      smaller attacks or broader network throttles for larger ones.
                    type: number
                  ddosProtection:
                    description: One of ADVANCED, ADVANCED_PREVIEW, STANDARD.
                    type: string
                type: object
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource.
                type: string
              projectRef:
                description: Immutable. The project the resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
