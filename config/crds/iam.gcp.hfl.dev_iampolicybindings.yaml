                      same as the parent if the target is a project/folder/organization.
                      Examples: //cloudresourcemanager.googleapis.com/projects/PROJECT_NUMBER,
                      //cloudresourcemanager.googleapis.com/folders/FOLDER_ID, //cloudresourcemanager.googleapis.com/organizations/ORGANIZATION_ID,
                      //iam.googleapis.com/locations/global/workforcePools/POOL_ID.'
                    type: string
                  resource:
                    description: 'Immutable. The full resource name that''s used for
                      access policy bindings: the resource the policy applies to.
                      Examples: //cloudresourcemanager.googleapis.com/organizations/ORGANIZATION_ID,
                      //cloudresourcemanager.googleapis.com/folders/FOLDER_ID, //cloudresourcemanager.googleapis.com/projects/PROJECT_NUMBER
                      or PROJECT_ID, or a resource in the project, such as an agent
                      gateway.'
                    type: string
                type: object
                x-kubernetes-validations:
                - message: target is immutable
                  rule: self == oldSelf
                - message: target takes exactly one of principalSet and resource
                  rule: has(self.principalSet) != has(self.resource)
            required:
