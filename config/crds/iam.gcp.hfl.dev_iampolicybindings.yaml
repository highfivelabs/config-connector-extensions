                - message: policyKind is immutable
                  rule: self == oldSelf
              policyRef:
                description: 'Required. Immutable. The policy to be bound: by name,
                  an IAMAccessPolicy (iam.gcp.hfl.dev) when policyKind is ACCESS,
                  else an IAMPrincipalAccessBoundaryPolicy; or a policy''s resource
                  name as external (organizations/{organization}/locations/global/principalAccessBoundaryPolicies/{id},
                  {organizations|folders|projects}/{id}/locations/{location}/accessPolicies/{id}).
                  The binding parent and the policy must belong to the same organization.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: 'A policy''s resource name: a principal access boundary
