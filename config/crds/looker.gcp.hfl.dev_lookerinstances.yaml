                    type: integer
                  additionalStandardUserCount:
                    description: Optional. The number of additional standard users
                      the instance owner has purchased.
                    format: int32
                    type: integer
                  additionalViewerUserCount:
                    description: Optional. The number of additional viewer users the
                      instance owner has purchased.
                    format: int32
                    type: integer
                type: object
