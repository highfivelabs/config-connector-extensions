                          type: string
                      required:
                      - targetServiceAttachmentUri
                      type: object
                    type: array
                type: object
              pscEnabled:
                description: Optional. Whether to use Private Service Connect (PSC)
                  for private IP connectivity. If true, neither `public_ip_enabled`
