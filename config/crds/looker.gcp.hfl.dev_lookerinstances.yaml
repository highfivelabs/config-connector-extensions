                description: Optional. Accelerated security patch enabled for the
                  instance.
                type: boolean
              adminSettings:
                description: Optional. Looker Instance Admin settings.
                properties:
                  allowedEmailDomains:
                    description: Optional. Email domain allowlist for the instance.
                    items:
                      type: string
                    type: array
                type: object
              authType:
                description: Optional. Auth type for the Looker instance.
                properties:
