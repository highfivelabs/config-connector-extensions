apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations: {}
  creationTimestamp: null
  labels:
    gcp.hfl.dev/gap: "true"
  name: computesubnetworks.compute.gcp.hfl.dev
spec:
  group: compute.gcp.hfl.dev
  names:
    categories:
    - gcp
    - hfl
    kind: ComputeSubnetwork
    listKind: ComputeSubnetworkList
    plural: computesubnetworks
    shortNames:
    - hflcomputesubnetwork
    - hflcomputesubnetworks
    singular: computesubnetwork
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'ComputeSubnetwork is a compute.v1 resource (https://compute.googleapis.com/compute/v1/{parent}/regions/{region}/subnetworks/{id}),
          from its Discovery document compute.v1 (hack/discokind). Terraform''s google_compute_subnetwork.
          A VPC subnetwork, with what the API takes only at insert: a BYOIP IPv6 prefix
          (ipCollection), the IPv6 prefixes, subnet mask resolution and resource manager
          tags.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowSubnetCidrRoutesOverlap:
                description: Whether this subnetwork's ranges can conflict with existing
                  custom routes. Setting this to true allows this subnetwork's primary
                  and secondary ranges to overlap with (and contain) custom routes
                  that have already been configured on the corresponding network.
                  For example if a static route has range 10.1.0.0/16, a subnet range
                  10.0.0.0/8 could only be created if allow_conflicting_routes=true.
                  Overlapping is only allowed on subnetwork operations; routes whose
                  ranges conflict with this subnetwork's ranges won't be allowed unless
                  route.allow_conflicting_subnetworks is set to true. Typically packets
                  destined to IPs within the subnetwork (which may contain private/sensitive
                  data) are prevented from leaving the virtual network. Setting this
                  field to true will disable this feature. The default value is false
                  and applies to all existing subnetworks and automatically created
                  subnetworks.
                type: boolean
              description:
                description: An optional description of this resource. Provide this
                  property when you create the resource. This field can be set only
                  at resource creation time.
                type: string
                x-kubernetes-validations:
                - message: description is immutable
                  rule: self == oldSelf
              externalIpv6Prefix:
                description: The external IPv6 address range that is owned by this
                  subnetwork.
                type: string
                x-kubernetes-validations:
                - message: externalIpv6Prefix is immutable
                  rule: self == oldSelf
              internalIpv6Prefix:
                description: The internal IPv6 address range that is owned by this
                  subnetwork.
                type: string
                x-kubernetes-validations:
                - message: internalIpv6Prefix is immutable
                  rule: self == oldSelf
              ipCidrRange:
                description: The range of internal addresses that are owned by this
                  subnetwork. Provide this property when you create the subnetwork.
                  For example,10.0.0.0/8 or 100.64.0.0/10. Ranges must be unique and
                  non-overlapping within a network. Only IPv4 is supported. This field
                  is set at resource creation time. The range can be any range listed
                  in theValid ranges list. The range can be expanded after creation
                  usingexpandIpCidrRange.
                type: string
                x-kubernetes-validations:
                - message: ipCidrRange is immutable
                  rule: self == oldSelf
              ipCollection:
                description: 'Reference to the source of IP, like a PublicDelegatedPrefix
                  (PDP) for BYOIP. The PDP must be a sub-PDP in EXTERNAL_IPV6_SUBNETWORK_CREATION
                  or INTERNAL_IPV6_SUBNETWORK_CREATION mode. Use one of the following
                  formats to specify a sub-PDP when creating a dual stack or IPv6-only
                  subnetwork with external access using BYOIP: - Full resource URL,
                  as inhttps://www.googleapis.com/compute/v1/projects/projectId/regions/region/publicDelegatedPrefixes/sub-pdp-name
                  - Partial URL, as in - projects/projectId/regions/region/publicDelegatedPrefixes/sub-pdp-name
                  - regions/region/publicDelegatedPrefixes/sub-pdp-name'
                type: string
                x-kubernetes-validations:
                - message: ipCollection is immutable
                  rule: self == oldSelf
              ipv6AccessType:
                description: |-
                  The access type of IPv6 address this subnet holds. It's immutable and can
                  only be specified during creation or the first time the subnet is updated
                  into IPV4_IPV6 dual stack.

                  One of EXTERNAL, INTERNAL.
                type: string
              logConfig:
                description: This field denotes the VPC flow logging options for this
                  subnetwork. If logging is enabled, logs are exported to Cloud Logging.
                properties:
                  aggregationInterval:
                    description: |-
                      Can only be specified if VPC flow logging for this subnetwork is enabled.
                      Toggles the aggregation interval for collecting flow logs. Increasing the
                      interval time will reduce the amount of generated flow logs for long
                      lasting connections. Default is an interval of 5 seconds per connection.

                      One of INTERVAL_10_MIN, INTERVAL_15_MIN, INTERVAL_1_MIN, INTERVAL_30_SEC, INTERVAL_5_MIN, INTERVAL_5_SEC.
                    type: string
                  enable:
                    description: Whether to enable flow logging for this subnetwork.
                      If this field is not explicitly set, it will not appear in get
                      listings. If not set the default behavior is determined by the
                      org policy, if there is no org policy specified, then it will
                      default to disabled. Flow logging isn't supported if the subnet
                      purpose field is set to REGIONAL_MANAGED_PROXY.
                    type: boolean
                  filterExpr:
                    description: Can only be specified if VPC flow logs for this subnetwork
                      is enabled. The filter expression is used to define which VPC
                      flow logs should be exported to Cloud Logging.
                    type: string
                  flowSampling:
                    description: Can only be specified if VPC flow logging for this
                      subnetwork is enabled. The value of the field must be in [0,
                      1]. Set the sampling rate of VPC flow logs within the subnetwork
                      where 1.0 means all collected logs are reported and 0.0 means
                      no logs are reported. Default is 0.5 unless otherwise specified
                      by the org policy, which means half of all collected logs are
                      reported.
                    type: number
                  metadata:
                    description: |-
                      Can only be specified if VPC flow logs for this subnetwork is enabled.
                      Configures whether all, none or a subset of metadata fields should be
                      added to the reported VPC flow logs. Default isEXCLUDE_ALL_METADATA.

                      One of CUSTOM_METADATA, EXCLUDE_ALL_METADATA, INCLUDE_ALL_METADATA.
                    type: string
                  metadataFields:
                    description: Can only be specified if VPC flow logs for this subnetwork
                      is enabled and "metadata" was set to CUSTOM_METADATA.
                    items:
                      type: string
                    type: array
                type: object
              network:
                description: The URL of the network to which this subnetwork belongs,
                  provided by the client when initially creating the subnetwork. This
                  field can be set only at resource creation time.
                type: string
                x-kubernetes-validations:
                - message: network is immutable
                  rule: self == oldSelf
              networkRef:
                description: 'A reference to the ComputeNetwork that fills network,
                  in its place: external (the value network takes), or the name (and
                  namespace) of a ComputeNetwork object, this repository''s kind of
                  that name first, then Config Connector''s. Set network or this,
                  not both.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: 'The value itself, as the string field beside the
                      reference takes it: the resource''s name, or for a service account
                      its email.'
                    type: string
                  name:
                    description: 'The name of an object of the referenced kind: this
                      repository''s kind of that name first, then Config Connector''s.
                      The controller takes the value from the object''s status.'
                    type: string
                  namespace:
                    description: The object's namespace; the referencing object's
                      when unset.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: networkRef is immutable
                  rule: self == oldSelf
              params:
                description: Input only. [Input Only] Additional params passed with
                  the request, but not persisted as part of resource payload.
                properties:
                  resourceManagerTags:
                    additionalProperties:
                      type: string
                    description: |-
                      Tag keys/values directly bound to this resource.
                      Tag keys and values have the same definition as resource
                      manager tags. The field is allowed for INSERT
                      only. The keys/values to set on the resource should be specified in
                      either ID { : } or Namespaced format
                      { : }.
                      For example the following are valid inputs:
                      * {"tagKeys/333" : "tagValues/444", "tagKeys/123" : "tagValues/456"}
                      * {"123/environment" : "production", "345/abc" : "xyz"}
                      Note:
                      * Invalid combinations of ID & namespaced format is not supported. For
                      instance: {"123/environment" : "tagValues/444"} is invalid.

                      The API never returns it: it is sent when the spec changes, and a
                      change made in the cloud is not seen.
                    type: object
                type: object
                x-kubernetes-validations:
                - message: params is immutable
                  rule: self == oldSelf
              privateIpGoogleAccess:
                description: Whether the VMs in this subnet can access Google services
                  without assigned external IP addresses. This field can be both set
                  at resource creation time and updated using setPrivateIpGoogleAccess.
                type: boolean
                x-kubernetes-validations:
                - message: privateIpGoogleAccess is immutable
                  rule: self == oldSelf
              privateIpv6GoogleAccess:
                description: |-
                  This field is for internal use.
                  This field can be both set at resource creation time and updated
                  usingpatch.

                  One of DISABLE_GOOGLE_ACCESS, ENABLE_BIDIRECTIONAL_ACCESS_TO_GOOGLE, ENABLE_OUTBOUND_VM_ACCESS_TO_GOOGLE.
                type: string
              projectRef:
                description: Immutable. The project the resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
                  rule: self == oldSelf
              purpose:
                description: One of GLOBAL_MANAGED_PROXY, INTERNAL_HTTPS_LOAD_BALANCER,
                  PEER_MIGRATION, PRIVATE, PRIVATE_NAT, PRIVATE_RFC_1918, PRIVATE_SERVICE_CONNECT,
                  REGIONAL_MANAGED_PROXY.
                type: string
                x-kubernetes-validations:
                - message: purpose is immutable
                  rule: self == oldSelf
              region:
                description: Immutable. The region, part of the resource's name ({parent}/regions/{region}/subnetworks/{id}).
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              reservedInternalRange:
                description: The URL of the reserved internal range.
                type: string
                x-kubernetes-validations:
                - message: reservedInternalRange is immutable
                  rule: self == oldSelf
              resolveSubnetMask:
                description: |-
                  Configures subnet mask resolution for this subnetwork.

                  One of ARP_ALL_RANGES, ARP_BROADCAST_PRIMARY_RANGE, ARP_BROADCAST_PRIMARY_RANGE_WITH_LEARNING, ARP_PRIMARY_RANGE.
                type: string
                x-kubernetes-validations:
                - message: resolveSubnetMask is immutable
                  rule: self == oldSelf
              resourceID:
                description: Immutable. The resource's ID, the last part of its name.
                  When unset, metadata.name is used.
                type: string
                x-kubernetes-validations:
                - message: resourceID is immutable
                  rule: self == oldSelf
              role:
                description: |-
                  The role of subnetwork. Currently, this field is only used when
                  purpose is set to GLOBAL_MANAGED_PROXY orREGIONAL_MANAGED_PROXY. The value
                  can be set toACTIVE or BACKUP. An ACTIVE
                  subnetwork is one that is currently being used for Envoy-based load
                  balancers in a region. A BACKUP subnetwork is one that is
                  ready to be promoted to ACTIVE or is currently draining.
                  This field can be updated with a patch request.

                  One of ACTIVE, BACKUP.
                type: string
              secondaryIpRanges:
                description: An array of configurations for secondary IP ranges for
                  VM instances contained in this subnetwork. The primary IP of such
                  VM must belong to the primary ipCidrRange of the subnetwork. The
                  alias IPs may belong to either primary or secondary ranges. This
                  field can be updated with apatch request. Supports both IPv4 and
                  IPv6 ranges.
                items:
                  properties:
                    ipCidrRange:
                      description: 'The range of IP addresses belonging to this subnetwork
                        secondary range. Provide this property when you create the
                        subnetwork. Ranges must be unique and non-overlapping with
                        all primary and secondary IP ranges within a network. Both
                        IPv4 and IPv6 ranges are supported. For IPv4, the range can
                        be any range listed in theValid ranges list. For IPv6: The
                        range must have a /64 prefix length. The range must be omitted,
                        for auto-allocation from Google-defined ULA IPv6 range. For
                        BYOGUA internal IPv6 secondary range, the range may be specified
                        along with the `ipCollection` field. If an `ipCollection`
                        is specified, the requested ip_cidr_range must lie within
                        the range of the PDP referenced by the `ipCollection` field
                        for allocation. If `ipCollection` field is specified, but
                        ip_cidr_range is not, the range is auto-allocated from the
                        PDP referenced by the `ipCollection` field.'
                      type: string
                    ipCollection:
                      description: Reference to a Public Delegated Prefix (PDP) for
                        BYOIP. This field should be specified for configuring BYOGUA
                        internal IPv6 secondary range. When specified along with the
                        ip_cidr_range, the ip_cidr_range must lie within the PDP referenced
                        by the `ipCollection` field. When specified without the ip_cidr_range,
                        the range is auto-allocated from the PDP referenced by the
                        `ipCollection` field.
                      type: string
                    ipVersion:
                      description: One of IPV4, IPV6, IP_VERSION_UNSPECIFIED.
                      type: string
                    rangeName:
                      description: The name associated with this subnetwork secondary
                        range, used when adding an alias IP/IPv6 range to a VM instance.
                        The name must be 1-63 characters long, and comply withRFC1035.
                        The name must be unique within the subnetwork.
                      type: string
                    reservedInternalRange:
                      description: The URL of the reserved internal range. Only IPv4
                        is supported.
                      type: string
                  type: object
                type: array
              stackType:
                description: |-
                  The stack type for the subnet. If set to IPV4_ONLY, new VMs
                  in the subnet are assigned IPv4 addresses only. If set toIPV4_IPV6, new VMs
                  in the subnet can be assigned both IPv4 and
                  IPv6 addresses. If not specified, IPV4_ONLY is used.
                  This field can be both set at resource creation time and updated
                  usingpatch.

                  One of IPV4_IPV6, IPV4_ONLY, IPV6_ONLY.
                type: string
            required:
            - projectRef
            - region
            type: object
            x-kubernetes-validations:
            - message: set network or networkRef, not both
              rule: '!(has(self.network) && has(self.networkRef))'
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: The resource's name, {parent}/regions/{region}/subnetworks/{id}.
                type: string
              inputVersion:
                description: 'A digest of the input-only fields last sent (params.resourceManagerTags):
                  their values, and each Secret''s name, key and resourceVersion,
                  never its value. The API never returns these fields, so they are
                  sent again when it changes.'
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the controller.
                format: int64
                type: integer
              observedState:
                description: The API's read-only fields.
                properties:
                  creationTimestamp:
                    description: Output only. [Output Only] Creation timestamp inRFC3339
                      text format.
                    type: string
                  fingerprint:
                    description: Fingerprint of this resource. A hash of the contents
                      stored in this object. This field is used in optimistic locking.
                      This field will be ignored when inserting a Subnetwork. An up-to-date
                      fingerprint must be provided in order to update the Subnetwork,
                      otherwise the request will fail with error 412 conditionNotMet.
                      To see the latest fingerprint, make a get() request to retrieve
                      a Subnetwork.
                    type: string
                  gatewayAddress:
                    description: Output only. [Output Only] The gateway address for
                      default routes to reach destination addresses outside this subnetwork.
                    type: string
                  id:
                    description: Output only. [Output Only] The unique identifier
                      for the resource. This identifier is defined by the server.
                    type: string
                  ipv6CidrRange:
                    description: Output only. [Output Only] This field is for internal
                      use.
                    type: string
                  ipv6GceEndpoint:
                    description: 'Output only. [Output Only] Possible endpoints of
                      this subnetwork. It can be one of the following: - VM_ONLY:
                      The subnetwork can be used for creating instances and IPv6 addresses
                      with VM endpoint type. Such a subnetwork gets external IPv6
                      ranges from a public delegated prefix and cannot be used to
                      create NetLb. - VM_AND_FR: The subnetwork can be used for creating
                      both VM instances and Forwarding Rules. It can also be used
                      to reserve IPv6 addresses with both VM and FR endpoint types.
                      Such a subnetwork gets its IPv6 range from Google IP Pool directly.'
                    type: string
                  kind:
                    description: Output only. [Output Only] Type of the resource.
                      Always compute#subnetwork for Subnetwork resources.
                    type: string
                  selfLink:
                    description: '[Output Only] Server-defined URL for the resource.'
                    type: string
                  state:
                    description: 'Output only. [Output Only] The state of the subnetwork,
                      which can be one of the following values:READY: Subnetwork is
                      created and ready to useDRAINING: only applicable to subnetworks
                      that have the purpose set to INTERNAL_HTTPS_LOAD_BALANCER and
                      indicates that connections to the load balancer are being drained.
                      A subnetwork that is draining cannot be used or modified until
                      it reaches a status ofREADY'
                    type: string
                  systemReservedExternalIpv6Ranges:
                    description: Output only. [Output Only] The array of external
                      IPv6 network ranges reserved from the subnetwork's external
                      IPv6 range for system use.
                    items:
                      type: string
                    type: array
                  systemReservedInternalIpv6Ranges:
                    description: Output only. [Output Only] The array of internal
                      IPv6 network ranges reserved from the subnetwork's internal
                      IPv6 range for system use.
                    items:
                      type: string
                    type: array
                  utilizationDetails:
                    description: Output only. [Output Only] The current IP utilization
                      of all subnetwork ranges. Contains the total number of allocated
                      and free IPs in each range.
                    properties:
                      externalIpv6InstanceUtilization:
                        description: Utilizations of external IPV6 IP range.
                        properties:
                          totalAllocatedIp:
                            properties:
                              high:
                                type: string
                              low:
                                type: string
                            type: object
                          totalFreeIp:
                            properties:
                              high:
                                type: string
                              low:
                                type: string
                            type: object
                        type: object
                      externalIpv6LbUtilization:
                        description: Utilizations of external IPV6 IP range for NetLB.
                        properties:
                          totalAllocatedIp:
                            properties:
                              high:
                                type: string
                              low:
                                type: string
                            type: object
                          totalFreeIp:
                            properties:
                              high:
                                type: string
                              low:
                                type: string
                            type: object
                        type: object
                      internalIpv6Utilization:
                        description: Utilizations of internal IPV6 IP range.
                        properties:
                          totalAllocatedIp:
                            properties:
                              high:
                                type: string
                              low:
                                type: string
                            type: object
                          totalFreeIp:
                            properties:
                              high:
                                type: string
                              low:
                                type: string
                            type: object
                        type: object
                      ipv4Utilizations:
                        description: Utilizations of all IPV4 IP ranges. For primary
                          ranges, the range name will be empty.
                        items:
                          properties:
                            rangeName:
                              description: Will be set for secondary range. Empty
                                for primary IPv4 range.
                              type: string
                            totalAllocatedIp:
                              type: string
                            totalFreeIp:
                              type: string
                          type: object
                        type: array
                    type: object
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
