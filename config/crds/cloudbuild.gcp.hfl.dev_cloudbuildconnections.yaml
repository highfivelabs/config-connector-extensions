                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: The resource's name, {parent}/locations/{location}/connections/{id}.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the controller.
                format: int64
                type: integer
              observedState:
                description: The API's read-only fields.
                properties:
                  createTime:
                    description: Output only. Server assigned timestamp for when the
                      connection was created.
                    type: string
                  installationState:
                    description: Output only. Installation state of the Connection.
                    properties:
                      actionUri:
                        description: Output only. Link to follow for next action.
                          Empty string if the installation is already complete.
                        type: string
                      message:
                        description: Output only. Message of what the user should
                          do next to continue the installation. Empty string if the
                          installation is already complete.
                        type: string
                      stage:
                        description: Output only. Current step of the installation
                          process.
                        type: string
                    type: object
                  reconciling:
                    description: Output only. Set to true when the connection is being
                      set up or updated in the background.
                    type: boolean
                  updateTime:
                    description: Output only. Server assigned timestamp for when the
                      connection was updated.
                    type: string
                type: object
            type: object
