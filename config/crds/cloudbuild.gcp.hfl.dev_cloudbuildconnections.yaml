                type: string
              githubConfig:
                description: Configuration for connections to github.com.
                properties:
                  appInstallationId:
                    description: Optional. GitHub App installation id.
                    format: int64
                    type: integer
                  authorizerCredential:
                    description: Optional. OAuth credential of the account that authorized
                      the Cloud Build GitHub App. It is recommended to use a robot
                      account instead of a human user account. The OAuth token must
                      be tied to the Cloud Build GitHub App.
                    properties:
                      oauthTokenSecretVersion:
                        description: 'Optional. A SecretManager resource containing
                          the OAuth token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    type: object
                type: object
              githubEnterpriseConfig:
                description: Configuration for connections to an instance of GitHub
                  Enterprise.
                properties:
                  apiKey:
                    description: Required. API Key used for authentication of webhook
                      events.
                    type: string
                  appId:
                    description: Optional. Id of the GitHub App created from the manifest.
                    format: int64
                    type: integer
                  appInstallationId:
                    description: Optional. ID of the installation of the GitHub App.
                    format: int64
                    type: integer
                  appSlug:
                    description: Optional. The URL-friendly name of the GitHub App.
                    type: string
                  hostUri:
                    description: Required. The URI of the GitHub Enterprise host this
                      connection is for.
                    type: string
                  privateKeySecretVersion:
                    description: Optional. SecretManager resource containing the private
                      key of the GitHub App, formatted as `projects/*/secrets/*/versions/*`.
                    type: string
                  serviceDirectoryConfig:
                    description: Optional. Configuration for using Service Directory
                      to privately connect to a GitHub Enterprise server. This should
                      only be set if the GitHub Enterprise server is hosted on-premises
                      and not reachable by public internet. If this field is left
                      empty, calls to the GitHub Enterprise server will be made over
                      the public internet.
                    properties:
                      service:
                        description: 'Required. The Service Directory service name.
                          Format: projects/{project}/locations/{location}/namespaces/{namespace}/services/{service}.'
                        type: string
                    required:
                    - service
                    type: object
                  sslCa:
                    description: Optional. SSL certificate to use for requests to
                      GitHub Enterprise.
                    type: string
                  webhookSecretSecretVersion:
                    description: Optional. SecretManager resource containing the webhook
                      secret of the GitHub App, formatted as `projects/*/secrets/*/versions/*`.
                    type: string
                required:
                - apiKey
                - hostUri
                type: object
              gitlabConfig:
                description: Configuration for connections to gitlab.com or an instance
                  of GitLab Enterprise.
                properties:
                  authorizerCredential:
                    description: Required. A GitLab personal access token with the
                      `api` scope access.
                    properties:
                      userTokenSecretVersion:
                        description: 'Required. A SecretManager resource containing
                          the user token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    required:
                    - userTokenSecretVersion
                    type: object
                  hostUri:
                    description: Optional. The URI of the GitLab Enterprise host this
                      connection is for. If not specified, the default value is https://gitlab.com.
                    type: string
                  readAuthorizerCredential:
                    description: Required. A GitLab personal access token with the
                      minimum `read_api` scope access.
                    properties:
                      userTokenSecretVersion:
                        description: 'Required. A SecretManager resource containing
                          the user token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    required:
                    - userTokenSecretVersion
                    type: object
                  serviceDirectoryConfig:
                    description: Optional. Configuration for using Service Directory
                      to privately connect to a GitLab Enterprise server. This should
                      only be set if the GitLab Enterprise server is hosted on-premises
                      and not reachable by public internet. If this field is left
                      empty, calls to the GitLab Enterprise server will be made over
                      the public internet.
                    properties:
                      service:
                        description: 'Required. The Service Directory service name.
                          Format: projects/{project}/locations/{location}/namespaces/{namespace}/services/{service}.'
                        type: string
                    required:
                    - service
                    type: object
                  sslCa:
                    description: Optional. SSL certificate to use for requests to
                      GitLab Enterprise.
                    type: string
                  webhookSecretSecretVersion:
                    description: Required. Immutable. SecretManager resource containing
                      the webhook secret of a GitLab Enterprise project, formatted
                      as `projects/*/secrets/*/versions/*`.
                    type: string
                required:
                - authorizerCredential
                - readAuthorizerCredential
                - webhookSecretSecretVersion
                type: object
              location:
                description: Immutable. The location, part of the resource's name
