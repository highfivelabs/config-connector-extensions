    name: v1beta1
    schema:
      openAPIV3Schema:
        description: CloudBuildConnection is a cloudbuild.v2 resource (https://cloudbuild.googleapis.com/v2/{parent}/locations/{location}/connections/{id}),
          from its Discovery document cloudbuild.v2 (hack/discokind). Terraform's
          google_cloudbuildv2_connection. A Cloud Build connection to a GitHub, GitLab
          or Bitbucket host.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: Optional. Allows clients to store small amounts of arbitrary
                  data.
                type: object
              bitbucketCloudConfig:
                description: Configuration for connections to Bitbucket Cloud.
                properties:
                  authorizerCredential:
                    description: Required. An access token with the `webhook`, `repository`,
                      `repository:admin` and `pullrequest` scope access. It can be
                      either a workspace, project or repository access token. It's
                      recommended to use a system account to generate these credentials.
                    properties:
                      userTokenSecretVersion:
                        description: 'Required. A SecretManager resource containing
                          the user token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    required:
                    - userTokenSecretVersion
                    type: object
                  readAuthorizerCredential:
                    description: Required. An access token with the `repository` access.
                      It can be either a workspace, project or repository access token.
                      It's recommended to use a system account to generate the credentials.
                    properties:
                      userTokenSecretVersion:
                        description: 'Required. A SecretManager resource containing
                          the user token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    required:
                    - userTokenSecretVersion
                    type: object
                  webhookSecretSecretVersion:
                    description: Required. SecretManager resource containing the webhook
                      secret used to verify webhook events, formatted as `projects/*/secrets/*/versions/*`.
                    type: string
                  workspace:
                    description: Required. The Bitbucket Cloud Workspace ID to be
                      connected to Google Cloud Platform.
                    type: string
                required:
                - authorizerCredential
                - readAuthorizerCredential
                - webhookSecretSecretVersion
                - workspace
                type: object
              bitbucketDataCenterConfig:
                description: Configuration for connections to Bitbucket Data Center.
                properties:
                  authorizerCredential:
                    description: Required. A http access token with the `REPO_ADMIN`
                      scope access.
                    properties:
                      userTokenSecretVersion:
                        description: 'Required. A SecretManager resource containing
                          the user token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    required:
                    - userTokenSecretVersion
                    type: object
                  hostUri:
                    description: Required. The URI of the Bitbucket Data Center instance
                      or cluster this connection is for.
                    type: string
                  readAuthorizerCredential:
                    description: Required. A http access token with the `REPO_READ`
                      access.
                    properties:
                      userTokenSecretVersion:
                        description: 'Required. A SecretManager resource containing
                          the user token that authorizes the Cloud Build connection.
                          Format: `projects/*/secrets/*/versions/*`.'
                        type: string
                    required:
                    - userTokenSecretVersion
                    type: object
                  serviceDirectoryConfig:
                    description: Optional. Configuration for using Service Directory
                      to privately connect to a Bitbucket Data Center. This should
                      only be set if the Bitbucket Data Center is hosted on-premises
                      and not reachable by public internet. If this field is left
                      empty, calls to the Bitbucket Data Center will be made over
                      the public internet.
                    properties:
                      service:
                        description: 'Required. The Service Directory service name.
                          Format: projects/{project}/locations/{location}/namespaces/{namespace}/services/{service}.'
                        type: string
                    required:
                    - service
                    type: object
                  sslCa:
                    description: Optional. SSL certificate to use for requests to
                      the Bitbucket Data Center.
                    type: string
                  webhookSecretSecretVersion:
                    description: Required. Immutable. SecretManager resource containing
                      the webhook secret used to verify webhook events, formatted
                      as `projects/*/secrets/*/versions/*`.
                    type: string
                required:
                - authorizerCredential
                - hostUri
                - readAuthorizerCredential
                - webhookSecretSecretVersion
                type: object
              disabled:
                description: Optional. If disabled is set to true, functionality is
                  disabled for this connection. Repository based API methods and webhooks
                  processing for repositories in this connection will be disabled.
                type: boolean
              etag:
                description: This checksum is computed by the server based on the
                  value of other fields, and may be sent on update and delete requests
