apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations: {}
  creationTimestamp: null
  labels:
    gcp.hfl.dev/gap: "true"
  name: computefirewallpolicyrules.compute.gcp.hfl.dev
spec:
  group: compute.gcp.hfl.dev
  names:
    categories:
    - gcp
    - hfl
    kind: ComputeFirewallPolicyRule
    listKind: ComputeFirewallPolicyRuleList
    plural: computefirewallpolicyrules
    shortNames:
    - hflcomputefirewallpolicyrule
    - hflcomputefirewallpolicyrules
    singular: computefirewallpolicyrule
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'ComputeFirewallPolicyRule is a rule of a hierarchical firewall
          policy, owning the whole rule: Config Connector''s ComputeFirewallPolicyRule
          with the security profile group, TLS inspection, secure tags, rule name
          and network contexts. Use one kind or the other for a rule, never both.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ComputeFirewallPolicyRuleSpec is one rule of a hierarchical
              firewall policy (an organization's or a folder's). A rule is identified
              by its priority in the policy.
            properties:
              action:
                description: The Action to perform when the client connection triggers
                  the rule. Valid actions are "allow", "deny", "goto_next" and "apply_security_profile_group".
                enum:
                - allow
                - deny
                - goto_next
                - apply_security_profile_group
                type: string
              description:
                description: An optional description for this resource.
                type: string
              direction:
                description: 'The direction in which this rule applies. Possible values:
                  INGRESS, EGRESS'
                enum:
                - INGRESS
                - EGRESS
                type: string
              disabled:
                description: Denotes whether the firewall policy rule is disabled.
                  When set to true, the firewall policy rule is not enforced and traffic
                  behaves as if it did not exist. If this is unspecified, the firewall
                  policy rule will be enabled.
                type: boolean
              enableLogging:
                description: 'Denotes whether to enable logging for a particular rule.
                  If logging is enabled, logs will be exported to the configured export
                  destination in Stackdriver. Logs may be exported to BigQuery or
                  Pub/Sub. Note: you cannot enable logging on "goto_next" rules.'
                type: boolean
              firewallPolicyRef:
                description: 'Immutable. The policy the rule belongs to: a Config
                  Connector ComputeFirewallPolicy by name, or locations/global/firewallPolicies/{{firewallPolicyID}}.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: A reference to an externally managed ComputeFirewallPolicy
                      resource. Should be in the format "locations/global/firewallPolicies/{{firewallPolicyID}}".
                    type: string
                  name:
                    description: The name of a ComputeFirewallPolicy resource.
                    type: string
                  namespace:
                    description: The namespace of a ComputeFirewallPolicy resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: firewallPolicyRef is immutable
                  rule: self == oldSelf
              match:
                description: A match condition that incoming traffic is evaluated
                  against. If it evaluates to true, the corresponding 'action' is
                  enforced.
                properties:
                  destAddressGroups:
                    description: Address groups which should be matched against the
                      traffic destination. Maximum number of destination address groups
                      is 10. Destination address groups is only supported in Egress
                      rules.
                    items:
                      type: string
                    type: array
                  destFqdns:
                    description: Domain names that will be used to match against the
                      resolved domain name of destination of traffic. Can only be
                      specified if DIRECTION is egress.
                    items:
                      type: string
                    type: array
                  destIPRanges:
                    description: CIDR IP address range. Maximum number of destination
                      CIDR IP ranges allowed is 256.
                    items:
                      type: string
                    type: array
                  destNetworkContext:
                    description: 'Written here. The network context of the destination
                      (egress rules): INTERNET or NON_INTERNET.'
                    type: string
                  destRegionCodes:
                    description: The Unicode country codes whose IP addresses will
                      be used to match against the source of traffic. Can only be
                      specified if DIRECTION is egress.
                    items:
                      type: string
                    type: array
                  destThreatIntelligences:
                    description: Name of the Google Cloud Threat Intelligence list.
                    items:
                      type: string
                    type: array
                  layer4Configs:
                    description: Pairs of IP protocols and ports that the rule should
                      match.
                    items:
                      properties:
                        ipProtocol:
                          description: The IP protocol to which this rule applies.
                            The protocol type is required when creating a firewall
                            rule. This value can either be one of the following well
                            known protocol strings (`tcp`, `udp`, `icmp`, `esp`, `ah`,
                            `ipip`, `sctp`), or the IP protocol number.
                          type: string
                        ports:
                          description: 'An optional list of ports to which this rule
                            applies. This field is only applicable for UDP or TCP
                            protocol. Each entry must be either an integer or a range.
                            If not specified, this rule applies to connections through
                            any port. Example inputs include: ``.'
                          items:
                            type: string
                          type: array
                      required:
                      - ipProtocol
                      type: object
                    type: array
                  srcAddressGroups:
                    description: Address groups which should be matched against the
                      traffic source. Maximum number of source address groups is 10.
                      Source address groups is only supported in Ingress rules.
                    items:
                      type: string
                    type: array
                  srcFqdns:
                    description: Domain names that will be used to match against the
                      resolved domain name of source of traffic. Can only be specified
                      if DIRECTION is ingress.
                    items:
                      type: string
                    type: array
                  srcIPRanges:
                    description: CIDR IP address range. Maximum number of source CIDR
                      IP ranges allowed is 256.
                    items:
                      type: string
                    type: array
                  srcNetworkContext:
                    description: 'Written here. The network context of the source
                      (ingress rules): INTERNET, NON_INTERNET, VPC_NETWORKS or INTRA_VPC.'
                    type: string
                  srcNetworks:
                    description: Written here. The VPC networks the source must be
                      in (ingress rules, with srcNetworkContext VPC_NETWORKS), as
                      "projects/{{projectID}}/global/networks/{{network}}" or the
                      network's full URL.
                    items:
                      type: string
                    type: array
                  srcRegionCodes:
                    description: The Unicode country codes whose IP addresses will
                      be used to match against the source of traffic. Can only be
                      specified if DIRECTION is ingress.
                    items:
                      type: string
                    type: array
                  srcSecureTags:
                    description: Written here. Secure tags (organization tag values,
                      tagValues/{id}) the source must have (ingress rules only).
                    items:
                      description: NetworkFirewallPolicyRuleSecureTag is a tag value.
                      properties:
                        name:
                          description: The tag value, as tagValues/{id}.
                          pattern: ^tagValues/[0-9]+$
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  srcThreatIntelligences:
                    description: Name of the Google Cloud Threat Intelligence list.
                    items:
                      type: string
                    type: array
                required:
                - layer4Configs
                type: object
              priority:
                description: Immutable. An integer indicating the priority of a rule
                  in the list. The priority must be a positive value between 0 and
                  2147483647. Rules are evaluated from highest to lowest priority
                  where 0 is the highest priority and 2147483647 is the lowest prority.
                format: int64
                maximum: 2147483647
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: priority is immutable
                  rule: self == oldSelf
              ruleName:
                description: Written here. An optional name for the rule; it is not
                  an identifier and can change.
                type: string
              securityProfileGroup:
                description: Written here. The security profile group a matching connection
                  is sent to, when action is apply_security_profile_group (and only
                  then), as "//networksecurity.googleapis.com/organizations/{{organizationID}}/locations/global/securityProfileGroups/{{name}}"
                  or the group's https://networksecurity.googleapis.com/v1/... URL.
                  Cloud NGFW Enterprise inspects the traffic with it.
                type: string
              targetResources:
                description: The networks the rule applies to; with none, every network
                  under the policy's attachments.
                items:
                  description: ComputeNetworkRef is a reference to a GCP ComputeNetwork.
                  oneOf:
                  - not:
                      required:
                      - external
                    required:
                    - name
                  - not:
                      anyOf:
                      - required:
                        - name
                      - required:
                        - namespace
                    required:
                    - external
                  properties:
                    external:
                      description: A reference to an externally managed ComputeNetwork
                        resource. Should be in the format "projects/{{projectID}}/global/networks/{{networkID}}".
                      type: string
                    name:
                      description: The name of a ComputeNetwork resource.
                      type: string
                    namespace:
                      description: The namespace of a ComputeNetwork resource.
                      type: string
                  type: object
                type: array
              targetSecureTags:
                description: Written here. Secure tags (organization tag values, tagValues/{id})
                  whose instances the rule applies to. Not together with targetServiceAccounts.
                items:
                  description: NetworkFirewallPolicyRuleSecureTag is a tag value.
                  properties:
                    name:
                      description: The tag value, as tagValues/{id}.
                      pattern: ^tagValues/[0-9]+$
                      type: string
                  required:
                  - name
                  type: object
                type: array
              targetServiceAccounts:
                description: Service accounts whose instances the rule applies to.
                items:
                  description: IAMServiceAccountRef is a reference to a GCP IAMServiceAccount.
                  oneOf:
                  - not:
                      required:
                      - external
                    required:
                    - name
                  - not:
                      anyOf:
                      - required:
                        - name
                      - required:
                        - namespace
                    required:
                    - external
                  properties:
                    external:
                      description: A reference to an externally managed IAMServiceAccount
                        resource. Should be in the format "{{serviceAccountID}}@{{projectID}}.iam.gserviceaccount.com".
                      type: string
                    name:
                      description: The name of an IAMServiceAccount resource.
                      type: string
                    namespace:
                      description: The namespace of an IAMServiceAccount resource.
                      type: string
                  type: object
                type: array
              tlsInspect:
                description: Written here. Whether the traffic is TLS-decrypted for
                  inspection (the network needs a TLS inspection policy on its firewall
                  endpoint). Only with action apply_security_profile_group. Unset
                  means false.
                type: boolean
            required:
            - action
            - direction
            - firewallPolicyRef
            - match
            - priority
            type: object
            x-kubernetes-validations:
            - message: securityProfileGroup is set exactly when action is apply_security_profile_group
              rule: (self.action == 'apply_security_profile_group') == has(self.securityProfileGroup)
            - message: tlsInspect needs action apply_security_profile_group
              rule: '!has(self.tlsInspect) || !self.tlsInspect || self.action == ''apply_security_profile_group'''
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique Config Connector specifier for the resource
                  in GCP.
                type: string
              kind:
                description: Type of the resource. Always `compute#firewallPolicyRule`
                  for firewall policy rules
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              ruleTupleCount:
                description: Calculation of the complexity of a single firewall policy
                  rule.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
