apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations: {}
  creationTimestamp: null
  labels:
    gcp.hfl.dev/gap: "true"
  name: dataplexdatascans.dataplex.gcp.hfl.dev
spec:
  group: dataplex.gcp.hfl.dev
  names:
    categories:
    - gcp
    - hfl
    kind: DataplexDataScan
    listKind: DataplexDataScanList
    plural: dataplexdatascans
    shortNames:
    - hfldataplexdatascan
    - hfldataplexdatascans
    singular: dataplexdatascan
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: DataplexDataScan is a dataplex.v1 resource (https://dataplex.googleapis.com/v1/{parent}/locations/{location}/dataScans/{id}),
          from its Discovery document dataplex.v1 (hack/discokind). Terraform's google_dataplex_datascan.
          A Dataplex data quality or data profile scan.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              data:
                description: Required. The data source for DataScan.
                properties:
                  entity:
                    description: 'Immutable. The Dataplex Universal Catalog entity
                      that represents the data source (e.g. BigQuery table) for DataScan,
                      of the form: projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}/entities/{entity_id}.'
                    type: string
                  resource:
                    description: 'Immutable. The service-qualified full resource name
                      of the cloud resource for a DataScan job to scan against. The
                      field could either be: Cloud Storage bucket for DataDiscoveryScan
                      Format: //storage.googleapis.com/projects/PROJECT_ID/buckets/BUCKET_ID
                      or BigQuery table of type "TABLE" for DataProfileScan/DataQualityScan/DataDocumentationScan
                      Format: //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
                      or BigQuery dataset for DataDocumentationScan only Format: //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID'
                    type: string
                type: object
              dataDiscoverySpec:
                description: Settings for a data discovery scan.
                properties:
                  bigqueryPublishingConfig:
                    description: Optional. Configuration for metadata publishing.
                    properties:
                      connection:
                        description: Optional. The BigQuery connection used to create
                          BigLake tables. Must be in the form projects/{project_id}/locations/{location_id}/connections/{connection_id}
                        type: string
                      location:
                        description: Optional. The location of the BigQuery dataset
                          to publish BigLake external or non-BigLake external tables
                          to. 1. If the Cloud Storage bucket is located in a multi-region
                          bucket, then BigQuery dataset can be in the same multi-region
                          bucket or any single region that is included in the same
                          multi-region bucket. The datascan can be created in any
                          single region that is included in the same multi-region
                          bucket 2. If the Cloud Storage bucket is located in a dual-region
                          bucket, then BigQuery dataset can be located in regions
                          that are included in the dual-region bucket, or in a multi-region
                          that includes the dual-region. The datascan can be created
                          in any single region that is included in the same dual-region
                          bucket. 3. If the Cloud Storage bucket is located in a single
                          region, then BigQuery dataset can be in the same single
                          region or any multi-region bucket that includes the same
                          single region. The datascan will be created in the same
                          single region as the bucket. 4. If the BigQuery dataset
                          is in single region, it must be in the same single region
                          as the datascan.For supported values, refer to https://cloud.google.com/bigquery/docs/locations#supported_locations.
                        type: string
                      project:
                        description: Optional. The project of the BigQuery dataset
                          to publish BigLake external or non-BigLake external tables
                          to. If not specified, the project of the Cloud Storage bucket
                          will be used. The format is "projects/{project_id_or_number}".
                        type: string
                      tableType:
                        description: |-
                          Optional. Determines whether to publish discovered tables as BigLake
                          external tables or non-BigLake external tables.

                          One of TABLE_TYPE_UNSPECIFIED, EXTERNAL, BIGLAKE.
                        type: string
                    type: object
                  storageConfig:
                    description: Cloud Storage related configurations.
                    properties:
                      csvOptions:
                        description: Optional. Configuration for CSV data.
                        properties:
                          delimiter:
                            description: Optional. The delimiter that is used to separate
                              values. The default is , (comma).
                            type: string
                          encoding:
                            description: Optional. The character encoding of the data.
                              The default is UTF-8.
                            type: string
                          headerRows:
                            description: Optional. The number of rows to interpret
                              as header rows that should be skipped when reading data
                              rows.
                            format: int32
                            type: integer
                          quote:
                            description: Optional. The character used to quote column
                              values. Accepts " (double quotation mark) or ' (single
                              quotation mark). If unspecified, defaults to " (double
                              quotation mark).
                            type: string
                          typeInferenceDisabled:
                            description: Optional. Whether to disable the inference
                              of data types for CSV data. If true, all columns are
                              registered as strings.
                            type: boolean
                        type: object
                      excludePatterns:
                        description: Optional. Defines the data to exclude during
                          discovery. Provide a list of patterns that identify the
                          data to exclude. For Cloud Storage bucket assets, these
                          patterns are interpreted as glob patterns used to match
                          object names. For BigQuery dataset assets, these patterns
                          are interpreted as patterns to match table names.
                        items:
                          type: string
                        type: array
                      includePatterns:
                        description: Optional. Defines the data to include during
                          discovery when only a subset of the data should be considered.
                          Provide a list of patterns that identify the data to include.
                          For Cloud Storage bucket assets, these patterns are interpreted
                          as glob patterns used to match object names. For BigQuery
                          dataset assets, these patterns are interpreted as patterns
                          to match table names.
                        items:
                          type: string
                        type: array
                      jsonOptions:
                        description: Optional. Configuration for JSON data.
                        properties:
                          encoding:
                            description: Optional. The character encoding of the data.
                              The default is UTF-8.
                            type: string
                          typeInferenceDisabled:
                            description: Optional. Whether to disable the inference
                              of data types for JSON data. If true, all columns are
                              registered as their primitive types (strings, number,
                              or boolean).
                            type: boolean
                        type: object
                    type: object
                type: object
              dataDocumentationSpec:
                description: Settings for a data documentation scan.
                properties:
                  catalogPublishingEnabled:
                    description: Optional. Whether to publish result to Dataplex Catalog.
                    type: boolean
                  customInstructions:
                    description: Optional. Custom instructions for generating data
                      documentation. The maximum length is 2,048 characters.
                    type: string
                  generationScopes:
                    description: Optional. Specifies which components of the data
                      documentation to generate. Any component that is required to
                      generate the specified components will also be generated. If
                      no generation scope is specified, all available documentation
                      components will be generated.
                    items:
                      type: string
                    type: array
                  sqlDialect:
                    description: |-
                      Optional. The SQL dialect to use in the generated SQL queries. If not
                      specified, the default dialect is Google SQL.

                      One of SQL_DIALECT_UNSPECIFIED, GOOGLE_SQL, SPARK_SQL.
                    type: string
                type: object
              dataProfileSpec:
                description: Settings for a data profile scan.
                properties:
                  catalogPublishingEnabled:
                    description: Optional. If set, the latest DataScan job result
                      will be published as Dataplex Universal Catalog metadata.
                    type: boolean
                  excludeFields:
                    description: Optional. The fields to exclude from data profile.If
                      specified, the fields will be excluded from data profile, regardless
                      of include_fields value.
                    properties:
                      fieldNames:
                        description: Optional. Expected input is a list of fully qualified
                          names of fields as in the schema.Only top-level field names
                          for nested fields are supported. For instance, if 'x' is
                          of nested field type, listing 'x' is supported but 'x.y.z'
                          is not supported. Here 'y' and 'y.z' are nested fields of
                          'x'.
                        items:
                          type: string
                        type: array
                    type: object
                  includeFields:
                    description: Optional. The fields to include in data profile.If
                      not specified, all fields at the time of profile scan job execution
                      are included, except for ones listed in exclude_fields.
                    properties:
                      fieldNames:
                        description: Optional. Expected input is a list of fully qualified
                          names of fields as in the schema.Only top-level field names
                          for nested fields are supported. For instance, if 'x' is
                          of nested field type, listing 'x' is supported but 'x.y.z'
                          is not supported. Here 'y' and 'y.z' are nested fields of
                          'x'.
                        items:
                          type: string
                        type: array
                    type: object
                  mode:
                    description: |-
                      Optional. The execution mode for the profile scan.

                      One of MODE_UNSPECIFIED, STANDARD, LIGHTWEIGHT.
                    type: string
                  postScanActions:
                    description: Optional. Actions to take upon job completion..
                    properties:
                      bigqueryExport:
                        description: Optional. If set, results will be exported to
                          the provided BigQuery table.
                        properties:
                          resultsTable:
                            description: 'Optional. The BigQuery table to export DataProfileScan
                              results to. Format: //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID'
                            type: string
                        type: object
                    type: object
                  rowFilter:
                    description: 'Optional. A filter applied to all rows in a single
                      DataScan job. The filter needs to be a valid SQL expression
                      for a WHERE clause in BigQuery standard SQL syntax. Example:
                      col1 >= 0 AND col2 < 10'
                    type: string
                  samplingPercent:
                    description: Optional. The percentage of the records to be selected
                      from the dataset for DataScan. Value can range between 0.0 and
                      100.0 with up to 3 significant decimal digits. Sampling is not
                      applied if sampling_percent is not specified, 0 or 100.
                    type: number
                type: object
              dataQualitySpec:
                description: Settings for a data quality scan.
                properties:
                  catalogPublishingEnabled:
                    description: Optional. If set, the latest DataScan job result
                      will be published as Dataplex Universal Catalog metadata.
                    type: boolean
                  enableCatalogBasedRules:
                    description: Optional. If enabled, the data scan will retrieve
                      rules defined in the dataplex-types.global.data-rules aspect
                      on all paths of the catalog entry corresponding to the BigQuery
                      table resource and all attached glossary terms. The path that
                      data-rules aspect is attached on the table entry defines the
                      column that the rule will be evaluated against. For glossary
                      terms, the path that the terms are attached on the table entry
                      defines the column that the rule will be evaluated against.
                      At the start of scan execution, the rules reflect the latest
                      state retrieved from the catalog entry and any updates on the
                      rules thereafter are ignored for that execution. The updates
                      will be reflected from the next execution. Rules defined in
                      the datascan must be empty if this field is enabled.
                    type: boolean
                  filter:
                    description: Optional. Filter for selectively running a subset
                      of rules. You can filter the request by the name or attribute
                      key-value pairs defined on the rule. If not specified, all rules
                      are run. The filter is applicable to both, the rules retrieved
                      from catalog and explicitly defined rules in the scan. Please
                      see filter syntax (https://docs.cloud.google.com/dataplex/docs/auto-data-quality-overview#rule-filtering)
                      for more details.
                    type: string
                  postScanActions:
                    description: Optional. Actions to take upon job completion.
                    properties:
                      bigqueryExport:
                        description: Optional. If set, results will be exported to
                          the provided BigQuery table.
                        properties:
                          resultsTable:
                            description: 'Optional. The BigQuery table to export DataQualityScan
                              results to. Format: //bigquery.googleapis.com/projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID
                              or projects/PROJECT_ID/datasets/DATASET_ID/tables/TABLE_ID'
                            type: string
                        type: object
                      notificationReport:
                        description: Optional. If set, results will be sent to the
                          provided notification receipts upon triggers.
                        properties:
                          jobEndTrigger:
                            description: Optional. If set, report will be sent when
                              a scan job ends.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          jobFailureTrigger:
                            description: Optional. If set, report will be sent when
                              a scan job fails.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          recipients:
                            description: Required. The recipients who will receive
                              the notification report.
                            properties:
                              emails:
                                description: Optional. The email recipients who will
                                  receive the DataQualityScan results report.
                                items:
                                  type: string
                                type: array
                            type: object
                          scoreThresholdTrigger:
                            description: Optional. If set, report will be sent when
                              score threshold is met.
                            properties:
                              scoreThreshold:
                                description: Optional. The score range is in 0,100.
                                type: number
                            type: object
                        required:
                        - recipients
                        type: object
                    type: object
                  rowFilter:
                    description: 'Optional. A filter applied to all rows in a single
                      DataScan job. The filter needs to be a valid SQL expression
                      for a WHERE clause in GoogleSQL syntax (https://cloud.google.com/bigquery/docs/reference/standard-sql/query-syntax#where_clause).Example:
                      col1 >= 0 AND col2 < 10'
                    type: string
                  rules:
                    description: Required. The list of rules to evaluate against a
                      data source. At least one rule is required.
                    items:
                      properties:
                        attributes:
                          additionalProperties:
                            type: string
                          description: Optional. Map of attribute name and value linked
                            to the rule. The rules to evaluate can be filtered based
                            on attributes provided here and a filter expression provided
                            in the DataQualitySpec.filter field.
                          type: object
                        column:
                          description: Optional. The unnested column which this rule
                            is evaluated against.
                          type: string
                        debugQueries:
                          description: Optional. Specifies the debug queries for this
                            rule. Currently, only one query is supported, but this
                            may be expanded in the future.
                          items:
                            properties:
                              description:
                                description: Optional. Specifies the description of
                                  the debug query. The maximum length is 1,024 characters.
                                type: string
                              sqlStatement:
                                description: Required. Specifies the SQL statement
                                  to be executed.
                                type: string
                            required:
                            - sqlStatement
                            type: object
                          type: array
                        description:
                          description: Optional. Description of the rule. The maximum
                            length is 1,024 characters.
                          type: string
                        dimension:
                          description: Optional. The dimension a rule belongs to.
                            Results are also aggregated at the dimension level. Custom
                            dimension name is supported with all uppercase letters
                            and maximum length of 30 characters.
                          type: string
                        ignoreNull:
                          description: 'Optional. Rows with null values will automatically
                            fail a rule, unless ignore_null is true. In that case,
                            such null rows are trivially considered passing.This field
                            is only valid for the following type of rules: RangeExpectation
                            RegexExpectation SetExpectation UniquenessExpectation'
                          type: boolean
                        name:
                          description: Optional. A mutable name for the rule. The
                            name must contain only letters (a-z, A-Z), numbers (0-9),
                            or hyphens (-). The maximum length is 63 characters. Must
                            start with a letter. Must end with a number or a letter.
                          type: string
                        nonNullExpectation:
                          description: Row-level rule which evaluates whether each
                            column value is null.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        rangeExpectation:
                          description: Row-level rule which evaluates whether each
                            column value lies between a specified range.
                          properties:
                            maxValue:
                              description: Optional. The maximum column value allowed
                                for a row to pass this validation. At least one of
                                min_value and max_value need to be provided.
                              type: string
                            minValue:
                              description: Optional. The minimum column value allowed
                                for a row to pass this validation. At least one of
                                min_value and max_value need to be provided.
                              type: string
                            strictMaxEnabled:
                              description: Optional. Whether each value needs to be
                                strictly lesser than ('<') the maximum, or if equality
                                is allowed.Only relevant if a max_value has been defined.
                                Default = false.
                              type: boolean
                            strictMinEnabled:
                              description: Optional. Whether each value needs to be
                                strictly greater than ('>') the minimum, or if equality
                                is allowed.Only relevant if a min_value has been defined.
                                Default = false.
                              type: boolean
                          type: object
                        regexExpectation:
                          description: Row-level rule which evaluates whether each
                            column value matches a specified regex.
                          properties:
                            regex:
                              description: Optional. A regular expression the column
                                value is expected to match.
                              type: string
                          type: object
                        rowConditionExpectation:
                          description: Row-level rule which evaluates whether each
                            row in a table passes the specified condition.
                          properties:
                            sqlExpression:
                              description: Optional. The SQL expression.
                              type: string
                          type: object
                        setExpectation:
                          description: Row-level rule which evaluates whether each
                            column value is contained by a specified set.
                          properties:
                            values:
                              description: Optional. Expected values for the column
                                value.
                              items:
                                type: string
                              type: array
                          type: object
                        sqlAssertion:
                          description: Aggregate rule which evaluates the number of
                            rows returned for the provided statement. If any rows
                            are returned, this rule fails.
                          properties:
                            sqlStatement:
                              description: Optional. The SQL statement.
                              type: string
                          type: object
                        statisticRangeExpectation:
                          description: Aggregate rule which evaluates whether the
                            column aggregate statistic lies between a specified range.
                          properties:
                            maxValue:
                              description: Optional. The maximum column statistic
                                value allowed for a row to pass this validation.At
                                least one of min_value and max_value need to be provided.
                              type: string
                            minValue:
                              description: Optional. The minimum column statistic
                                value allowed for a row to pass this validation.At
                                least one of min_value and max_value need to be provided.
                              type: string
                            statistic:
                              description: |-
                                Optional. The aggregate metric to evaluate.

                                One of STATISTIC_UNDEFINED, MEAN, MIN, MAX.
                              type: string
                            strictMaxEnabled:
                              description: Optional. Whether column statistic needs
                                to be strictly lesser than ('<') the maximum, or if
                                equality is allowed.Only relevant if a max_value has
                                been defined. Default = false.
                              type: boolean
                            strictMinEnabled:
                              description: Optional. Whether column statistic needs
                                to be strictly greater than ('>') the minimum, or
                                if equality is allowed.Only relevant if a min_value
                                has been defined. Default = false.
                              type: boolean
                          type: object
                        suspended:
                          description: Optional. Whether the Rule is active or suspended.
                            Default is false.
                          type: boolean
                        tableConditionExpectation:
                          description: Aggregate rule which evaluates whether the
                            provided expression is true for a table.
                          properties:
                            sqlExpression:
                              description: Optional. The SQL expression.
                              type: string
                          type: object
                        templateReference:
                          description: Aggregate rule which references a rule template
                            and provides the parameters to be substituted in the template.
                            If any rows are returned, this rule fails.
                          properties:
                            name:
                              description: 'Required. The template entry name. Entry
                                must be of EntryType projects/dataplex-types/locations/global/entryTypes/data-quality-rule-template
                                and contains top-level aspect of AspectType projects/dataplex-types/locations/global/aspectTypes/data-quality-rule-template.
                                The format is: projects/{project_id_or_number}/locations/{location_id}/entryGroups/{entry_group_id}/entries/{entry_id}'
                              type: string
                            values:
                              description: Optional. Provides the map of parameter
                                name and value. The maximum size of the field is 120KB
                                (encoded as UTF-8).
                              x-kubernetes-preserve-unknown-fields: true
                          required:
                          - name
                          type: object
                        threshold:
                          description: Optional. The minimum ratio of passing_rows
                            / total_rows required to pass this rule, with a range
                            of 0.0, 1.0.0 indicates default value (i.e. 1.0).This
                            field is only valid for row-level type rules.
                          type: number
                        uniquenessExpectation:
                          description: Row-level rule which evaluates whether each
                            column value is unique.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                    type: array
                  samplingPercent:
                    description: Optional. The percentage of the records to be selected
                      from the dataset for DataScan. Value can range between 0.0 and
                      100.0 with up to 3 significant decimal digits. Sampling is not
                      applied if sampling_percent is not specified, 0 or 100.
                    type: number
                required:
                - rules
                type: object
              description:
                description: Optional. Description of the scan. Must be between 1-1024
                  characters.
                type: string
              displayName:
                description: Optional. User friendly display name. Must be between
                  1-256 characters.
                type: string
              executionIdentity:
                description: Optional. Immutable. The identity to run the datascan.
                  If not specified, defaults to the Dataplex Service Agent.
                properties:
                  dataplexServiceAgent:
                    description: Optional. The Dataplex service agent associated with
                      the user's project.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  serviceAccount:
                    description: Optional. The provided service account.
                    properties:
                      email:
                        description: Required. Service account email. The datascan
                          will execute with this service account's credentials. The
                          user calling this API must have permissions to act as this
                          service account. Dataplex service agent must be granted
                          iam.serviceAccounts.getAccessToken permission on this service
                          account, for example, through the iam.serviceAccountTokenCreator
                          role .
                        type: string
                    required:
                    - email
                    type: object
                  userCredential:
                    description: Optional. The credential of the calling user. Supports
                      only ONE_TIME trigger type.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
                x-kubernetes-validations:
                - message: executionIdentity is immutable
                  rule: self == oldSelf
              executionSpec:
                description: Optional. DataScan execution settings.If not specified,
                  the fields in it will use their default values.
                properties:
                  field:
                    description: Immutable. The unnested field (of type Date or Timestamp)
                      that contains values which monotonically increase over time.If
                      not specified, a data scan will run for all data in the table.
                    type: string
                  trigger:
                    description: Optional. Spec related to how often and when a scan
                      should be triggered.If not specified, the default is OnDemand,
                      which means the scan will not run until the user calls RunDataScan
                      API.
                    properties:
                      onDemand:
                        description: The scan runs once via RunDataScan API.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      oneTime:
                        description: The scan runs once, and does not create an associated
                          ScanJob child resource.
                        properties:
                          ttlAfterScanCompletion:
                            description: Optional. Time to live for OneTime scans.
                              default value is 24 hours, minimum value is 0 seconds,
                              and maximum value is 365 days. The time is calculated
                              from the data scan job completion time. If value is
                              set as 0 seconds, the scan will be immediately deleted
                              upon job completion, regardless of whether the job succeeded
                              or failed.
                            type: string
                        type: object
                      schedule:
                        description: The scan is scheduled to run periodically.
                        properties:
                          cron:
                            description: 'Required. Cron (https://en.wikipedia.org/wiki/Cron)
                              schedule for running scans periodically.To explicitly
                              set a timezone in the cron tab, apply a prefix in the
                              cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or "TZ=${IANA_TIME_ZONE}".
                              The ${IANA_TIME_ZONE} may only be a valid string from
                              IANA time zone database (wikipedia (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List)).
                              For example, CRON_TZ=America/New_York 1 * * * *, or
                              TZ=America/New_York 1 * * * *.This field is required
                              for Schedule scans.'
                            type: string
                        required:
                        - cron
                        type: object
                    type: object
                type: object
              labels:
                additionalProperties:
                  type: string
                description: Optional. User-defined labels for the scan.
                type: object
              location:
                description: Immutable. The location, part of the resource's name
                  ({parent}/locations/{location}/dataScans/{id}).
                type: string
                x-kubernetes-validations:
                - message: location is immutable
                  rule: self == oldSelf
              projectRef:
                description: Immutable. The project the resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: projectRef is immutable
