    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'ComputeNetworkFields sets fields of a VPC network that Config
          Connector''s ComputeNetwork has no field for (routingConfig''s BGP best
          path selection), and only those: it patches the network with a body naming
          them. Deleting it leaves them as they are.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ComputeNetworkFieldsSpec is the fields of a VPC network this
              object owns.
            properties:
              resourceRef:
                description: 'Immutable. The network: Config Connector''s ComputeNetwork
                  by name (compute.cnrm.cloud.google.com), or any network by external,
                  as "projects/{{projectID}}/global/networks/{{network}}". The network
                  must exist; this object never creates or deletes it.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: A reference to an externally managed ComputeNetwork
                      resource. Should be in the format "projects/{{projectID}}/global/networks/{{networkID}}".
                    type: string
                  name:
                    description: The name of a ComputeNetwork resource.
                    type: string
                  namespace:
                    description: The namespace of a ComputeNetwork resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: resourceRef is immutable
                  rule: self == oldSelf
              routingConfig:
                description: 'The network''s BGP best path selection (routingConfig).
                  Config Connector''s routingMode is not here: it stays Config Connector''s.'
                properties:
                  bgpAlwaysCompareMed:
                    description: Compare the multi-exit discriminator of routes from
                      different neighbor ASNs. Only with STANDARD.
                    type: boolean
                  bgpBestPathSelectionMode:
                    description: 'How Cloud Routers in the network choose among routes
                      learned for the same prefix: LEGACY (the default) or STANDARD.'
                    enum:
                    - LEGACY
                    - STANDARD
                    type: string
                  bgpInterRegionCost:
                    description: 'Whether the inter-region cost is added to a route''s
                      MED: DEFAULT or ADD_COST_TO_MED. Only with STANDARD.'
                    enum:
                    - DEFAULT
                    - ADD_COST_TO_MED
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set at least one field of routingConfig
                  rule: has(self.bgpBestPathSelectionMode) || has(self.bgpAlwaysCompareMed)
                    || has(self.bgpInterRegionCost)
                - message: bgpAlwaysCompareMed and bgpInterRegionCost need bgpBestPathSelectionMode
                    STANDARD
                  rule: '!(has(self.bgpAlwaysCompareMed) || has(self.bgpInterRegionCost))
                    || (has(self.bgpBestPathSelectionMode) && self.bgpBestPathSelectionMode
                    == ''STANDARD'')'
            required:
            - resourceRef
            - routingConfig
            type: object
          status:
            description: ComputeNetworkFieldsStatus defines the observed state.
            properties:
              conditions:
                description: Conditions represent the latest available observations
