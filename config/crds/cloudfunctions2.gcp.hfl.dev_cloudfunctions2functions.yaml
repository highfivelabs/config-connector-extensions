                    format: int32
                    type: integer
                  minInstanceCount:
                    description: The limit on the minimum number of function instances
                      that may coexist at a given time. Function instances are kept
                      in idle state for a short period after they finished executing
                      the request to reduce cold start time for subsequent requests.
                      Setting a minimum instance count will ensure that the given
                      number of instances are kept running in idle state always. This
                      can help with cold start times when jump in incoming request
                      count occurs after the idle instance would have been stopped
                      in the default case.
                    format: int32
                    type: integer
                  secretEnvironmentVariables:
                    description: Secret environment variables configuration.
                    items:
                      properties:
                        key:
                          description: Name of the environment variable.
                          type: string
                        projectId:
                          description: Project identifier (preferably project number
                            but can also be the project ID) of the project that contains
                            the secret. If not set, it is assumed that the secret
                            is in the same project as the function.
                          type: string
                        secret:
                          description: Name of the secret in secret manager (not the
                            full resource name).
                          type: string
                        version:
                          description: Version of the secret (version number or the
                            string 'latest'). It is recommended to use a numeric version
                            for secret environment variables as any updates to the
                            secret value is not reflected until new instances start.
                          type: string
                      type: object
                    type: array
                  secretVolumes:
                    description: Secret volumes configuration.
                    items:
                      properties:
                        mountPath:
                          description: 'The path within the container to mount the
                            secret volume. For example, setting the mount_path as
                            `/etc/secrets` would mount the secret value files under
                            the `/etc/secrets` directory. This directory will also
                            be completely shadowed and unavailable to mount any other
                            secrets. Recommended mount path: /etc/secrets'
                          type: string
                        projectId:
                          description: Project identifier (preferably project number
                            but can also be the project ID) of the project that contains
                            the secret. If not set, it is assumed that the secret
                            is in the same project as the function.
                          type: string
                        secret:
                          description: Name of the secret in secret manager (not the
                            full resource name).
                          type: string
                        versions:
                          description: List of secret versions to mount for this secret.
                            If empty, the `latest` version of the secret will be made
                            available in a file named after the secret under the mount
                            point.
                          items:
                            properties:
                              path:
                                description: Relative path of the file under the mount
                                  path where the secret value for this version will
                                  be fetched and made available. For example, setting
                                  the mount_path as '/etc/secrets' and path as `secret_foo`
                                  would mount the secret value file at `/etc/secrets/secret_foo`.
                                type: string
                              version:
                                description: Version of the secret (version number
                                  or the string 'latest'). It is preferable to use
                                  `latest` version with secret volumes as secret value
                                  changes are reflected immediately.
                                type: string
                            type: object
                          type: array
                      type: object
                    type: array
                  securityLevel:
                    description: |-
                      Security level configure whether the function only accepts https. This
                      configuration is only applicable to 1st Gen functions with Http trigger. By
                      default https is optional for 1st Gen functions; 2nd Gen functions are
                      https ONLY.

                      One of SECURITY_LEVEL_UNSPECIFIED, SECURE_ALWAYS, SECURE_OPTIONAL.
                    type: string
                  serviceAccountEmail:
                    description: The email of the service's service account. If empty,
                      defaults to `{project_number}-compute@developer.gserviceaccount.com`.
                    type: string
                  timeoutSeconds:
                    description: The function execution timeout. Execution is considered
                      failed and can be terminated if the function is not completed
                      at the end of the timeout period. Defaults to 60 seconds.
                    format: int32
                    type: integer
                  vpcConnector:
                    description: The Serverless VPC Access connector that this cloud
                      function can connect to. The format of this field is `projects/*/locations/*/connectors/*`.
                    type: string
                  vpcConnectorEgressSettings:
                    description: |-
                      The egress settings for the connector, controlling what traffic is diverted
                      through it.

                      One of VPC_CONNECTOR_EGRESS_SETTINGS_UNSPECIFIED, PRIVATE_RANGES_ONLY, ALL_TRAFFIC.
                    type: string
                type: object
            required:
