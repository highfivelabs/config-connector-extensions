                          items:
                            type: string
                          type: array
                      type: object
                    type: array
                  environmentVariables:
                    additionalProperties:
                      type: string
                    description: Environment variables that shall be available during
                      function execution.
                    type: object
                  ingressSettings:
                    description: |-
                      The ingress settings for the function, controlling what traffic can reach
