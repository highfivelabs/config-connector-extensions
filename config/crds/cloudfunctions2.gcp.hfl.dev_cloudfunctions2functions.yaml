                    type: string
                  pubsubTopic:
                    description: 'Optional. The name of a Pub/Sub topic in the same
                      project that will be used as the transport topic for the event
                      delivery. Format: `projects/{project}/topics/{topic}`. This
                      is only valid for events of type `google.cloud.pubsub.topic.v1.messagePublished`.
                      The topic provided here will not be deleted at function deletion.'
                    type: string
                  retryPolicy:
                    description: |-
                      Optional. If unset, then defaults to ignoring failures (i.e. not retrying
                      them).

                      One of RETRY_POLICY_UNSPECIFIED, RETRY_POLICY_DO_NOT_RETRY, RETRY_POLICY_RETRY.
                    type: string
                  service:
                    description: Optional. The hostname of the service that 1st Gen
                      function should be observed. If no string is provided, the default
                      service implementing the API will be used. For example, `storage.googleapis.com`
                      is the default for all event types in the `google.storage` namespace.
                      The field is only applicable to 1st Gen functions.
                    type: string
                  serviceAccountEmail:
                    description: 'Optional. The email of the trigger''s service account.
                      The service account must have permission to invoke Cloud Run
                      services, the permission is `run.routes.invoke`. If empty, defaults
                      to the Compute Engine default service account: `{project_number}-compute@developer.gserviceaccount.com`.'
                    type: string
                  triggerRegion:
                    description: The region that the trigger will be in. The trigger
                      will only receive events originating in this region. It can
                      be the same region as the function, a different region or multi-region,
                      or the global region. If not provided, defaults to the same
                      region as the function.
                    type: string
                required:
