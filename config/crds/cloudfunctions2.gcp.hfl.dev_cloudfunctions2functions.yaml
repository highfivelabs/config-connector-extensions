                      longer available in response to Container Registry's deprecation:
                      https://cloud.google.com/artifact-registry/docs/transition/transition-from-gcr
                      Please use Artifact Registry instead, which is the default choice. If
                      unspecified, it defaults to `ARTIFACT_REGISTRY`. If `docker_repository`
                      field is specified, this field should either be left unspecified or set to
                      `ARTIFACT_REGISTRY`.

                      One of DOCKER_REGISTRY_UNSPECIFIED, CONTAINER_REGISTRY, ARTIFACT_REGISTRY.
                    type: string
                  dockerRepository:
                    description: Repository in Artifact Registry to which the function
                      docker image will be pushed after it is built by Cloud Build.
                      If specified by user, it is created and managed by user with
                      a customer managed encryption key. Otherwise, GCF will create
                      and use a repository named 'gcf-artifacts' for every deployed
                      region. It must match the pattern `projects/{project}/locations/{location}/repositories/{repository}`.
                      Repository format must be 'DOCKER'.
                    type: string
                  entryPoint:
                    description: The name of the function (as defined in source code)
                      that will be executed. Defaults to the resource name suffix,
                      if not specified. For backward compatibility, if function with
                      given name is not found, then the system will try to use function
                      named "function". For Node.js this is name of a function exported
                      by the module specified in `source_location`.
                    type: string
                  environmentVariables:
                    additionalProperties:
                      type: string
                    description: User-provided build-time environment variables for
                      the function
                    type: object
                  onDeployUpdatePolicy:
                    type: object
                  runtime:
                    description: The runtime in which to run the function. Required
                      when deploying a new function, optional when updating an existing
                      function. For a complete list of possible choices, see the [`gcloud`
                      command reference](https://cloud.google.com/sdk/gcloud/reference/functions/deploy#--runtime).
                    type: string
                  serviceAccount:
                    description: Service account to be used for building the container.
                      The format of this field is `projects/{projectId}/serviceAccounts/{serviceAccountEmail}`.
                    type: string
                  source:
                    description: The location of the function source code.
                    properties:
                      gitUri:
                        description: 'If provided, get the source from GitHub repository.
                          This option is valid only for GCF 1st Gen function. Example:
                          https://github.com///blob//'
                        type: string
                      repoSource:
                        description: If provided, get the source from this location
                          in a Cloud Source Repository.
                        properties:
                          branchName:
                            description: Regex matching branches to build. The syntax
                              of the regular expressions accepted is the syntax accepted
                              by RE2 and described at https://github.com/google/re2/wiki/Syntax
                            type: string
                          commitSha:
                            description: Explicit commit SHA to build.
                            type: string
                          dir:
                            description: Directory, relative to the source root, in
                              which to run the build. This must be a relative path.
                              If a step's `dir` is specified and is an absolute path,
                              this value is ignored for that step's execution. eg.
                              helloworld (no leading slash allowed)
                            type: string
                          projectId:
                            description: ID of the project that owns the Cloud Source
                              Repository. If omitted, the project ID requesting the
                              build is assumed.
                            type: string
                          repoName:
                            description: Name of the Cloud Source Repository.
                            type: string
                          tagName:
                            description: Regex matching tags to build. The syntax
                              of the regular expressions accepted is the syntax accepted
                              by RE2 and described at https://github.com/google/re2/wiki/Syntax
                            type: string
                        type: object
                      storageSource:
                        description: If provided, get the source from this location
                          in Google Cloud Storage.
                        properties:
                          bucket:
                            description: Google Cloud Storage bucket containing the
                              source (see [Bucket Name Requirements](https://cloud.google.com/storage/docs/bucket-naming#requirements)).
                            type: string
                          generation:
                            description: Google Cloud Storage generation for the object.
                              If the generation is omitted, the latest generation
                              will be used.
                            format: int64
                            type: integer
                          object:
                            description: Google Cloud Storage object containing the
                              source. This object must be a gzipped archive file (`.tar.gz`)
                              containing source to build.
                            type: string
                          sourceUploadUrl:
                            description: When the specified storage bucket is a 1st
                              gen function uploard url bucket, this field should be
                              set as the generated upload url for 1st gen deployment.
                            type: string
                        type: object
                    type: object
                  sourceToken:
                    description: 'An identifier for Firebase function sources. Disclaimer:
                      This field is only supported for Firebase function deployments.'
                    type: string
                  workerPool:
                    description: Name of the Cloud Build private pool that should
                      be used to build the function. The format of this field is `projects/{project}/locations/{region}/workerPools/{workerPool}`
                      where {project} and {region} are the project id and region respectively
                      where the worker pool is defined and {workerPool} is the short
                      name of the worker pool. If the project id is not the same as
                      the function, then the Cloud Functions Service Agent (service-@gcf-admin-robot.iam.gserviceaccount.com)
                      must be granted the role Cloud Build Custom Workers Builder
                      (roles/cloudbuild.customworkers.builder) in the project.
                    type: string
                type: object
              description:
                description: User-provided description of a function.
