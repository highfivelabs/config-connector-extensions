                                      format: int32
                                      type: integer
                                    service:
                                      description: Optional. Service is the name of
                                        the service to place in the gRPC HealthCheckRequest
                                        (see https://github.com/grpc/grpc/blob/master/doc/health-checking.md
                                        ). If this is not specified, the default behavior
                                        is defined by gRPC.
                                      type: string
                                  type: object
                                httpGet:
                                  description: Optional. HTTPGet specifies the http
                                    request to perform. Exactly one of httpGet, tcpSocket,
                                    or grpc must be specified.
                                  properties:
                                    httpHeaders:
                                      description: Optional. Custom headers to set
                                        in the request. HTTP allows repeated headers.
                                      items:
                                        properties:
                                          name:
                                            description: Required. The header field
