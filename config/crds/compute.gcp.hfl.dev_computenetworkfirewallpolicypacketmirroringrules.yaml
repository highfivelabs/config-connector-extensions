                type: string
              securityProfileGroup:
                description: The security profile group whose custom mirroring profile
                  names where mirrored packets go, as //networksecurity.googleapis.com/{group's
                  name} or the group's name (organizations/{org}/locations/global/securityProfileGroups/{group}
                  or projects/{project}/locations/global/securityProfileGroups/{group}).
                  Only for action mirror, which needs it.
                type: string
              targetSecureTags:
                description: Secure tags (tag values, tagValues/{id}) whose instances
                  the rule applies to. With none, the rule applies to every instance
                  on the policy's networks.
                items:
                  description: NetworkFirewallPolicyPacketMirroringRuleSecureTag is
                    a tag value.
                  properties:
                    name:
                      description: The tag value, as tagValues/{id}.
                      pattern: ^tagValues/[0-9]+$
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
