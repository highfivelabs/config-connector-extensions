          metadata:
            type: object
          spec:
            description: 'ComputeNetworkFirewallPolicyPacketMirroringRuleSpec is one
              packet mirroring rule of a global network firewall policy: which traffic
              of the policy''s networks is copied to a mirroring endpoint group. A
              rule is identified by its priority in the policy.'
            properties:
              action:
                description: 'What to do with matching traffic: mirror (to the mirroring
                  endpoint group of securityProfileGroup''s custom mirroring profile),
                  do_not_mirror, or goto_next.'
                enum:
                - mirror
                - do_not_mirror
                - goto_next
                type: string
              description:
                description: An optional description of the rule.
                type: string
              direction:
                description: 'The direction the rule applies to: INGRESS or EGRESS.'
                enum:
                - INGRESS
                - EGRESS
                type: string
              disabled:
                description: Whether the rule is switched off. Unset means it is enforced.
                type: boolean
              firewallPolicyRef:
                description: 'The policy the rule belongs to: a Config Connector ComputeNetworkFirewallPolicy
                  by name, or projects/{project}/global/firewallPolicies/{policy}.
                  Immutable.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: A reference to an externally managed ComputeNetworkFirewallPolicy
                      resource. Should be in the format "projects/{{projectID}}/global/firewallPolicies/{{firewallPolicyID}}".
                    type: string
                  name:
                    description: The name of a ComputeNetworkFirewallPolicy resource.
                    type: string
                  namespace:
                    description: The namespace of a ComputeNetworkFirewallPolicy resource.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: firewallPolicyRef is immutable
                  rule: self == oldSelf
              match:
                description: What traffic the rule matches.
                properties:
                  destIPRanges:
                    description: Destination CIDR ranges.
                    items:
                      type: string
                    type: array
                  layer4Configs:
                    description: Pairs of IP protocols and ports the rule matches.
                    items:
                      description: NetworkFirewallPolicyPacketMirroringRuleLayer4Config
                        is an IP protocol and its ports.
                      properties:
                        ipProtocol:
                          description: tcp, udp, icmp, esp, ah, ipip, sctp, all, or
                            the protocol number.
                          type: string
                        ports:
                          description: Ports or port ranges (80, 8000-8080), for tcp
                            and udp. Unset means every port.
                          items:
                            type: string
                          type: array
                      required:
                      - ipProtocol
                      type: object
                    minItems: 1
                    type: array
                  srcIPRanges:
                    description: Source CIDR ranges.
                    items:
                      type: string
                    type: array
                required:
                - layer4Configs
                type: object
              priority:
                description: 'The rule''s priority, 0 to 2147483647: rules are evaluated
                  from the lowest number (the highest priority) to the highest, and
                  a policy has one packet mirroring rule at each priority. Immutable.'
                format: int64
                maximum: 2147483647
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: priority is immutable
                  rule: self == oldSelf
              projectRef:
                description: 'The project of the policy. Optional: the policy names
                  its project. When set, it must be the policy''s project. Immutable.'
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
