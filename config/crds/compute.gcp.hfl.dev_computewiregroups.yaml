                                type: integer
                            type: object
                          type: array
                        label:
                          description: 'Output only. [Output Only] A label that identifies
                            the wire. The format of this label combines the existing
                            labels of the wire group endpoints and Interconnect connections
                            used by this wire in alphabetical order as follows: `ENDPOINT_A+CONNECTION_A1,ENDPOINT_B+CONNECTION_B1`,
                            where: - ENDPOINT_A and ENDPOINT_B: are the labels that
                            you entered as map keys when you specified the wire group
                            endpoint objects. - CONNECTION_A1 and CONNECTION_B1: are
                            the labels that you entered as map keys when you specified
                            the wire group Interconnect objects.'
                          type: string
                        wireProperties:
