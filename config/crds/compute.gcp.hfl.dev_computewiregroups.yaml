                  rule: self == oldSelf
              resourceID:
                description: Immutable. The resource's ID, the last part of its name.
                  When unset, metadata.name is used.
                type: string
                x-kubernetes-validations:
                - message: resourceID is immutable
                  rule: self == oldSelf
              wireProperties:
                description: Properties for all wires in the wire group.
                properties:
                  bandwidthAllocation:
                    description: |-
                      The configuration of the bandwidth allocation, one of the following:
                      - ALLOCATE_PER_WIRE: configures a separate unmetered bandwidth allocation
                      (and associated charges) for each wire in the group.
                      - SHARED_WITH_WIRE_GROUP: this is the default behavior, which configures
                      one unmetered bandwidth allocation for the wire group. The unmetered
                      bandwidth is divided equally across each wire in the group, but dynamic
                      throttling reallocates unused unmetered bandwidth from unused or underused
                      wires to other wires in the group.

                      One of ALLOCATE_PER_WIRE, SHARED_WITH_WIRE_GROUP.
                    type: string
                  bandwidthUnmetered:
                    description: The unmetered bandwidth in Gigabits per second, using
                      decimal units. `10` is 10 Gbps, `100` is 100 Gbps. The bandwidth
                      must be greater than 0.
                    format: int64
                    type: integer
                  faultResponse:
                    description: |-
                      Response when a fault is detected in a pseudowire:
                      - NONE: default.
                      - DISABLE_PORT: set the port line protocol down when inline probes
                      detect a fault. This setting is only permitted on port mode
                      pseudowires.

                      One of DISABLE_PORT, NONE.
                    type: string
                  flowManagement:
                    description: |-
                      The flow management configuration for the wire.

                      One of DYNAMIC_PATH, FIXED_PATH.
                    type: string
                type: object
