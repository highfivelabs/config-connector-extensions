        description: ComputeWireGroup is a compute.v1 resource (https://compute.googleapis.com/compute/v1/{parent}/global/crossSiteNetworks/{crossSiteNetwork}/wireGroups/{id}),
          from its Discovery document compute.v1 (hack/discokind). A group of wires
