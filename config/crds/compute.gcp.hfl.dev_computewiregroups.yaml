          metadata:
            type: object
          spec:
            properties:
              adminEnabled:
                description: Indicates whether the wires in the wire group are enabled.
                  When false, the wires in the wire group are disabled. When true
                  and when there is simultaneously no wire-specific override of `adminEnabled`
                  to false, a given wire is enabled. Defaults to true.
                type: boolean
              crossSiteNetwork:
                description: Immutable. The crossSiteNetwork, part of the resource's
                  name ({parent}/global/crossSiteNetworks/{crossSiteNetwork}/wireGroups/{id}).
                type: string
