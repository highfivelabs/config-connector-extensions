                  rule: self == oldSelf
              description:
                description: An optional description of the wire group.
                type: string
              endpoints:
                description: 'A map that contains the logical endpoints of the wire
                  group. Specify key-value pairs for the map as follows: - Key: an
                  RFC1035 user-specified label. - Value: an Endpoint object.'
                x-kubernetes-preserve-unknown-fields: true
              projectRef:
                description: Immutable. The project the resource belongs to.
