      type: date
    - description: When 'True', the most recent reconcile of the resource succeeded
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The reason for the value in 'Ready'
      jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    - description: The last transition time for the value in 'Status'
      jsonPath: .status.conditions[?(@.type=='Ready')].lastTransitionTime
      name: Status Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ComputeRouter is the Schema for the compute API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ComputeRouterSpec defines the desired state of ComputeRouter
            properties:
              bgp:
                description: BGP information specific to this router.
                properties:
                  advertiseMode:
                    description: 'User-specified flag to indicate which mode to use
                      for advertisement. Default value: "DEFAULT" Possible values:
                      ["DEFAULT", "CUSTOM"].'
                    type: string
                  advertisedGroups:
                    description: |-
                      User-specified list of prefix groups to advertise in custom mode.
                      This field can only be populated if advertiseMode is CUSTOM and
                      is advertised to all peers of the router. These groups will be
                      advertised in addition to any specified prefixes. Leave this field
                      blank to advertise no custom groups.

                      This enum field has the one valid value: ALL_SUBNETS.
                    items:
                      type: string
                    type: array
                  advertisedIpRanges:
                    description: User-specified list of individual IP ranges to advertise
                      in custom mode. This field can only be populated if advertiseMode
                      is CUSTOM and is advertised to all peers of the router. These
                      IP ranges will be advertised in addition to any specified groups.
                      Leave this field blank to advertise no custom IP ranges.
                    items:
                      properties:
                        description:
                          description: User-specified description for the IP range.
                          type: string
                        range:
                          description: The IP range to advertise. The value must be
                            a CIDR-formatted string.
                          type: string
                      required:
                      - range
                      type: object
                    type: array
                  asn:
                    description: Local BGP Autonomous System Number (ASN). Must be
                      an RFC6996 private ASN, either 16-bit or 32-bit. The value will
                      be fixed for this router resource. All VPN tunnels that link
                      to this router will have the same local ASN.
                    format: int64
                    type: integer
                  identifierRange:
                    description: Explicitly specifies a range of valid BGP Identifiers
                      for this Router. It is provided as a link-local IPv4 range (from
                      169.254.0.0/16), of size at least /30, even if the BGP sessions
                      are over IPv6. It must not overlap with any IPv4 BGP session
                      ranges. Other vendors commonly call this router ID. The API
                      chooses one when it is not set.
                    type: string
                  keepaliveInterval:
                    description: |-
                      The interval in seconds between BGP keepalive messages that are sent
                      to the peer. Hold time is three times the interval at which keepalive
                      messages are sent, and the hold time is the maximum number of seconds
                      allowed to elapse between successive keepalive messages that BGP
                      receives from a peer.

                      BGP will use the smaller of either the local hold time value or the
                      peer's hold time value as the hold time for the BGP connection
                      between the two peers. If set, this value must be between 20 and 60.
                      The default is 20.
                    format: int64
                    type: integer
                required:
                - asn
                type: object
              bgpPeers:
                description: 'BGP peers of this router: the whole list. A peer the
                  spec leaves out is removed, but for one the API manages for an interconnect
                  attachment (managementType MANAGED_BY_ATTACHMENT).'
                items:
                  properties:
                    advertiseMode:
                      description: 'User-specified flag to indicate which mode to
                        use for advertisement: DEFAULT or CUSTOM.'
                      type: string
                    advertisedGroups:
                      description: User-specified list of prefix groups to advertise
                        in custom mode, which currently supports ALL_SUBNETS. This
                        field can only be set if advertiseMode is CUSTOM; it overrides
                        the router's list.
                      items:
                        type: string
                      type: array
                    advertisedIpRanges:
                      description: User-specified list of individual IP ranges to
                        advertise in custom mode. This field can only be set if advertiseMode
                        is CUSTOM; it overrides the router's list.
                      items:
                        properties:
                          description:
                            description: User-specified description for the IP range.
                            type: string
                          range:
                            description: The IP range to advertise. The value must
                              be a CIDR-formatted string.
                            type: string
                        required:
                        - range
                        type: object
                      type: array
                    advertisedRoutePriority:
                      description: The priority of routes advertised to this BGP peer.
                        Where there is more than one matching route of maximum length,
                        the routes with the lowest priority value win.
                      format: int64
                      type: integer
                    bfd:
                      description: BFD configuration for the BGP peering.
                      properties:
                        minReceiveInterval:
                          description: The minimum interval, in milliseconds, between
                            BFD control packets received from the peer router. The
                            actual value is negotiated between the two routers and
                            is equal to the greater of this value and the transmit
                            interval of the other router. If set, this value must
                            be between 1000 and 30000. The default is 1000.
                          format: int32
                          type: integer
                        minTransmitInterval:
                          description: The minimum interval, in milliseconds, between
                            BFD control packets transmitted to the peer router. The
                            actual value is negotiated between the two routers and
                            is equal to the greater of this value and the corresponding
                            receive interval of the other router. If set, this value
                            must be between 1000 and 30000. The default is 1000.
                          format: int32
                          type: integer
                        multiplier:
                          description: The number of consecutive BFD packets that
                            must be missed before BFD declares that a peer is unavailable.
                            If set, the value must be a value between 5 and 16. The
                            default is 5.
                          format: int32
                          type: integer
                        sessionInitializationMode:
                          description: The BFD session initialization mode for this
                            BGP peer. If set to ACTIVE, the Cloud Router will initiate
                            the BFD session for this BGP peer. If set to PASSIVE,
                            the Cloud Router will wait for the peer router to initiate
                            the BFD session for this BGP peer. If set to DISABLED,
                            BFD is disabled for this BGP peer. The default is DISABLED.
                            Check the SessionInitializationMode enum for the list
                            of possible values.
                          type: string
                      type: object
                    customLearnedIpRanges:
                      description: The custom learned route IP address ranges for
                        this BGP session.
                      items:
                        properties:
                          range:
                            description: The custom learned route IP address range.
                              Must be a valid CIDR-formatted prefix. If an IP address
                              is provided without a subnet mask, it is interpreted
                              as, for IPv4, a `/32` singular IP address range, and,
                              for IPv6, `/128`.
                            type: string
                        type: object
                      type: array
                    customLearnedRoutePriority:
                      description: The priority of the custom learned routes, 0 to
                        65335. The API uses 100 when it is not given.
                      format: int64
                      type: integer
                    enable:
                      description: The status of the BGP peer connection. If false,
                        any active session with the peer is terminated and all associated
                        routing information is removed. If true, the peer connection
                        can be established with routing information. The default is
                        true.
                      type: boolean
                    enableIpv4:
                      description: Enable IPv4 traffic over BGP Peer. It is enabled
                        by default if the peerIpAddress is version 4.
                      type: boolean
                    enableIpv6:
                      description: Enable IPv6 traffic over BGP Peer. If not specified,
                        it is disabled by default.
                      type: boolean
                    exportPolicies:
                      description: Names of the export route policies of this router
                        applied to this peer, in the order they are evaluated.
                      items:
                        type: string
                      type: array
                    importPolicies:
                      description: Names of the import route policies of this router
                        applied to this peer, in the order they are evaluated.
                      items:
                        type: string
                      type: array
                    interfaceName:
                      description: Name of the interface the BGP peer is associated
                        with. Immutable.
                      type: string
                    ipAddress:
                      description: IP address of the interface inside Google Cloud
                        Platform. Only IPv4 is supported. The API chooses it from
                        the interface's range when it is not given.
                      type: string
                    ipv4NexthopAddress:
                      description: IPv4 address of the interface inside Google Cloud
                        Platform.
                      type: string
                    ipv6NexthopAddress:
                      description: IPv6 address of the interface inside Google Cloud
                        Platform. The address must be in the range 2600:2d00:0:2::/64
                        or 2600:2d00:0:3::/64.
                      type: string
                    md5AuthenticationKeyName:
                      description: The name of one of this router's md5AuthenticationKeys;
                        present if MD5 authentication is enabled for the peering.
                      type: string
                    name:
                      description: Name of this BGP peer. The name must be 1-63 characters
                        long and comply with RFC1035. Immutable.
                      type: string
                    peerAsn:
                      description: Peer BGP Autonomous System Number (ASN). Each BGP
                        interface may use a different value.
                      format: int64
                      type: integer
                    peerIpAddress:
                      description: IP address of the BGP interface outside Google
                        Cloud Platform. Only IPv4 is supported.
                      type: string
                    peerIpv4NexthopAddress:
                      description: IPv4 address of the BGP interface outside Google
                        Cloud Platform.
                      type: string
                    peerIpv6NexthopAddress:
                      description: IPv6 address of the BGP interface outside Google
                        Cloud Platform.
                      type: string
                    routerApplianceInstanceRef:
                      description: The VM instance that is the BGP peer, for a Router
                        Appliance; its subnetwork must be the one of the interface
                        this peer is on.
                      oneOf:
                      - not:
                          required:
                          - external
                        required:
                        - name
                      - not:
                          anyOf:
                          - required:
                            - name
                          - required:
                            - namespace
                        required:
                        - external
                      properties:
                        external:
                          description: A reference to an externally managed ComputeInstance
                            resource. Should be in the format "projects/{{projectID}}/zones/{{zone}}/instances/{{instanceID}}".
                          type: string
                        name:
                          description: The name of a ComputeInstance resource.
                          type: string
                        namespace:
                          description: The namespace of a ComputeInstance resource.
                          type: string
                      type: object
                  required:
                  - interfaceName
                  - name
                  - peerAsn
                  type: object
                type: array
              description:
                description: An optional description of this resource.
                type: string
              encryptedInterconnectRouter:
                description: Immutable. Indicates if a router is dedicated for use
