                              - name
                            - not:
                                anyOf:
                                - required:
                                  - name
                                - required:
                                  - namespace
                              required:
                              - external
                            properties:
                              external:
                                description: A reference to an externally managed
                                  ComputeSubnetwork resource. Should be in the format
                                  "projects/{{projectID}}/regions/{{region}}/subnetworks/{{subnetworkID}}".
                                type: string
                              name:
                                description: The name of a ComputeSubnetwork resource.
                                type: string
                              namespace:
                                description: The namespace of a ComputeSubnetwork
                                  resource.
                                type: string
                            type: object
                        required:
                        - sourceIpRangesToNat
                        - subnetworkRef
                        type: object
                      type: array
