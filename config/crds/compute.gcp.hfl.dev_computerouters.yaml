                            description: List of the secondary ranges of the subnetwork
                              that are allowed to use NAT. This can be populated only
                              if 'LIST_OF_SECONDARY_IP_RANGES' is one of the values
                              in sourceIpRangesToNat.
                            items:
                              type: string
                            type: array
                          sourceIpRangesToNat:
                            description: 'List of options for which source IPs in
                              the subnetwork should have NAT enabled. Supported values
                              include: ''ALL_IP_RANGES'', ''LIST_OF_SECONDARY_IP_RANGES'',
                              ''PRIMARY_IP_RANGE''.'
                            items:
                              type: string
                            type: array
                          subnetworkRef:
                            description: The subnetwork to NAT.
                            oneOf:
