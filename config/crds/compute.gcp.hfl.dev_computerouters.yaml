    gcp.hfl.dev/gap: "true"
  name: computerouters.compute.gcp.hfl.dev
spec:
  group: compute.gcp.hfl.dev
  names:
    categories:
    - gcp
    - hfl
    kind: ComputeRouter
    listKind: ComputeRouterList
    plural: computerouters
    shortNames:
    - hflcomputerouter
    - hflcomputerouters
    singular: computerouter
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
