                        forces a new interface to be created. Immutable.
                      type: string
                    ipVersion:
                      description: 'IP version of this interface: IPV4 or IPV6. The
                        API sets IPV4 when it is not given. Immutable.'
                      type: string
                    name:
                      description: Name of this interface entry. The name must be
                        1-63 characters long and comply with RFC1035. Immutable.
                      type: string
                    privateIpAddress:
                      description: The regional private internal IP address that is
                        used to establish BGP sessions to a VM instance acting as
