                      type: string
                    redundantInterface:
                      description: The name of another interface on this router that
                        is redundant with this one (a Router Appliance interface pair).
                        Immutable.
                      type: string
                    subnetworkRef:
                      description: The subnetwork of a Router Appliance this interface
                        is in. Only one of vpnTunnelRef, interconnectAttachmentRef
                        and subnetworkRef can be set. Immutable.
                      oneOf:
                      - not:
                          required:
                          - external
                        required:
                        - name
                      - not:
                          anyOf:
                          - required:
                            - name
                          - required:
                            - namespace
                        required:
                        - external
                      properties:
                        external:
                          description: A reference to an externally managed ComputeSubnetwork
                            resource. Should be in the format "projects/{{projectID}}/regions/{{region}}/subnetworks/{{subnetworkID}}".
                          type: string
                        name:
                          description: The name of a ComputeSubnetwork resource.
                          type: string
                        namespace:
                          description: The namespace of a ComputeSubnetwork resource.
                          type: string
                      type: object
                    vpnTunnelRef:
                      description: The VPN tunnel this interface is linked to. Only
                        one of vpnTunnelRef, interconnectAttachmentRef and subnetworkRef
                        can be set. Immutable.
                      oneOf:
                      - not:
                          required:
                          - external
                        required:
                        - name
                      - not:
                          anyOf:
                          - required:
                            - name
                          - required:
                            - namespace
                        required:
                        - external
                      properties:
                        external:
                          description: 'Allowed value: The `selfLink` field of a `ComputeVPNTunnel`
                            resource.'
                          type: string
                        name:
                          description: 'Name of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                          type: string
                        namespace:
                          description: 'Namespace of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/'
                          type: string
                      type: object
                  required:
                  - name
                  type: object
                type: array
              md5AuthenticationKeys:
                description: 'Keys used for MD5 authentication of BGP peers: the whole
                  list.'
                items:
                  description: RouterMD5AuthenticationKey is a key a BGP peer authenticates
                    with. Its value is read from a Secret in the router's namespace
                    and never kept in the spec or the status; the API does not return
                    it.
                  properties:
                    keyRef:
                      description: The Secret key that holds the value of the key
                        used for MD5 authentication.
                      properties:
                        key:
                          description: Key that identifies the value to be extracted.
                          type: string
                        name:
                          description: Name of the Secret to extract a value from.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    name:
                      description: Name used to identify the key. Must be unique within
                        a router. Must be referenced by exactly one bgpPeer (its md5AuthenticationKeyName).
                        Must comply with RFC1035.
                      type: string
                  required:
                  - keyRef
                  - name
                  type: object
                type: array
              nats:
                description: 'Cloud NAT gateways on this router: the whole list.'
                items:
                  description: RouterNAT is a Cloud NAT gateway on the router. The
                    fields are those of upstream's ComputeRouterNATSpec, with the
                    NAT's name in place of its resource ID, and the router and region
                    the router's own.
                  properties:
                    autoNetworkTier:
                      description: 'The network tier to use when automatically reserving
                        NAT IP addresses: PREMIUM or STANDARD. Must be one of the
                        network tiers the project allows (the project''s default by
                        default).'
                      type: string
                    drainNatIps:
                      description: A list of URLs of the IP resources to be drained.
                        These IPs must be valid static external IPs that have been
                        assigned to the NAT.
                      items:
                        description: ComputeAddressRef is a reference to a GCP ComputeAddress.
                        oneOf:
                        - not:
                            required:
                            - external
                          required:
                          - name
                        - not:
                            anyOf:
                            - required:
                              - name
                            - required:
                              - namespace
                          required:
                          - external
                        properties:
                          external:
                            description: A reference to an externally managed ComputeAddress
                              resource. Should be in the format "projects/{{projectID}}/global/addresses/{{addressID}}"
                              or "projects/{{projectID}}/regions/{{region}}/addresses/{{addressID}}".
                            type: string
                          name:
                            description: The name of a ComputeAddress resource.
                            type: string
                          namespace:
                            description: The namespace of a ComputeAddress resource.
                            type: string
                        type: object
                      type: array
                    enableDynamicPortAllocation:
                      description: Enable Dynamic Port Allocation. If minPortsPerVm
                        is set, it must be a power of two between 32 and 32768 (default
                        32). If maxPortsPerVm is set, it must be a power of two greater
                        than minPortsPerVm (default 65536). Mutually exclusive with
                        enableEndpointIndependentMapping.
                      type: boolean
                    enableEndpointIndependentMapping:
                      description: Enable endpoint independent mapping. For more information
                        see the [official documentation](https://cloud.google.com/nat/docs/overview#specs-rfcs).
                      type: boolean
                    endpointTypes:
                      description: 'Specifies the endpoint types supported by the
                        NAT gateway: ENDPOINT_TYPE_VM, ENDPOINT_TYPE_SWG, ENDPOINT_TYPE_MANAGED_PROXY_LB.
                        The API uses ENDPOINT_TYPE_VM when it is not given. Immutable.'
                      items:
                        type: string
                      type: array
                    icmpIdleTimeoutSec:
                      description: Timeout (in seconds) for ICMP connections. Defaults
                        to 30s if not set.
                      format: int64
                      type: integer
                    logConfig:
                      description: Configuration for logging on NAT.
                      properties:
                        enable:
                          description: Indicates whether or not to export logs.
                          type: boolean
                        filter:
                          description: 'Specifies the desired filtering of logs on
                            this NAT. Possible values: ["ERRORS_ONLY", "TRANSLATIONS_ONLY",
                            "ALL"].'
                          type: string
                      required:
                      - enable
                      - filter
                      type: object
                    maxPortsPerVm:
                      description: Maximum number of ports allocated to a VM from
                        this NAT. This is only valid if enableDynamicPortAllocation
                        is true.
                      format: int64
                      type: integer
                    minPortsPerVm:
                      description: Minimum number of ports allocated to a VM from
                        this NAT. Defaults to 64 for static port allocation and 32
                        for dynamic port allocation if not set.
                      format: int64
                      type: integer
                    name:
                      description: Name of the NAT service. The name must be 1-63
                        characters long and comply with RFC1035. Immutable.
                      type: string
                    nat64Subnetworks:
                      description: List of subnetworks to which NAT64 is applied,
                        when sourceSubnetworkIpRangesToNat64 is LIST_OF_IPV6_SUBNETWORKS.
                      items:
                        properties:
                          name:
                            description: URL for the subnetwork resource that will
                              use NAT64.
                            type: string
                        type: object
                      type: array
                    natIpAllocateOption:
                      description: 'How external IPs should be allocated for this
                        NAT. Valid values are ''AUTO_ONLY'' for only allowing NAT
                        IPs allocated by Google Cloud Platform, or ''MANUAL_ONLY''
                        for only user-allocated NAT IP addresses. Possible values:
                        ["MANUAL_ONLY", "AUTO_ONLY"].'
                      type: string
                    natIps:
                      description: Self-links of NAT IPs. Only valid if natIpAllocateOption
                        is set to MANUAL_ONLY.
                      items:
                        description: ComputeAddressRef is a reference to a GCP ComputeAddress.
                        oneOf:
                        - not:
                            required:
                            - external
                          required:
                          - name
                        - not:
                            anyOf:
                            - required:
                              - name
                            - required:
                              - namespace
                          required:
                          - external
                        properties:
                          external:
                            description: A reference to an externally managed ComputeAddress
                              resource. Should be in the format "projects/{{projectID}}/global/addresses/{{addressID}}"
                              or "projects/{{projectID}}/regions/{{region}}/addresses/{{addressID}}".
                            type: string
                          name:
                            description: The name of a ComputeAddress resource.
                            type: string
                          namespace:
                            description: The namespace of a ComputeAddress resource.
                            type: string
                        type: object
                      type: array
                    rules:
                      description: A list of rules associated with this NAT.
                      items:
                        properties:
                          action:
                            description: The action to be enforced for traffic that
                              matches this rule.
                            properties:
                              sourceNatActiveIpsRefs:
                                description: A list of URLs of the IP resources used
                                  for this NAT rule. These IP addresses must be valid
                                  static external IP addresses assigned to the project.
                                  This field is used for public NAT.
                                items:
                                  description: ComputeAddressRef is a reference to
