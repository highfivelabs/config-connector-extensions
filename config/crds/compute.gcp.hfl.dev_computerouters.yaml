                                      required:
                                      - external
                                    required:
                                    - name
                                  - not:
                                      anyOf:
                                      - required:
                                        - name
                                      - required:
                                        - namespace
                                    required:
                                    - external
                                  properties:
                                    external:
                                      description: A reference to an externally managed
                                        ComputeAddress resource. Should be in the
                                        format "projects/{{projectID}}/global/addresses/{{addressID}}"
                                        or "projects/{{projectID}}/regions/{{region}}/addresses/{{addressID}}".
                                      type: string
                                    name:
                                      description: The name of a ComputeAddress resource.
                                      type: string
                                    namespace:
                                      description: The namespace of a ComputeAddress
                                        resource.
                                      type: string
                                  type: object
                                type: array
                              sourceNatActiveRangesRefs:
                                description: A list of references to ComputeSubnetwork
                                  resources. Rules configured with these rules translate
                                  source IPs to the IP ranges of these subnetworks.
                                  This field is used for private NAT.
                                items:
                                  description: ComputeSubnetworkRef is a reference
                                    to a GCP ComputeSubnetwork.
                                  oneOf:
                                  - not:
                                      required:
                                      - external
                                    required:
                                    - name
                                  - not:
                                      anyOf:
                                      - required:
                                        - name
                                      - required:
                                        - namespace
                                    required:
                                    - external
                                  properties:
                                    external:
                                      description: A reference to an externally managed
