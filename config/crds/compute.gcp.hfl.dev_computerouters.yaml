                      format: int64
                      type: integer
                    type:
                      description: 'Indicates whether this NAT is used for public
                        or private IP translation. If unspecified, it defaults to
                        PUBLIC. If ''PUBLIC'' NAT used for public IP translation.
                        If ''PRIVATE'' NAT used for private IP translation. Default
                        value: "PUBLIC" Possible values: ["PUBLIC", "PRIVATE"]. Immutable.'
                      type: string
                    udpIdleTimeoutSec:
                      description: Timeout (in seconds) for UDP connections. Defaults
                        to 30s if not set.
                      format: int64
                      type: integer
                  required:
                  - name
                  - sourceSubnetworkIpRangesToNat
