                                        format "projects/{{projectID}}/regions/{{region}}/subnetworks/{{subnetworkID}}".
                                      type: string
                                    name:
                                      description: The name of a ComputeSubnetwork
                                        resource.
                                      type: string
                                    namespace:
                                      description: The namespace of a ComputeSubnetwork
                                        resource.
                                      type: string
                                  type: object
                                type: array
                              sourceNatDrainIpsRefs:
                                description: A list of URLs of the IP resources to
                                  be drained. These IPs must be valid static external
                                  IPs that have been assigned to the NAT. These IPs
                                  should be used for updating/patching a NAT rule
