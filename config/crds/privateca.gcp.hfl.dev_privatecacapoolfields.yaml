            type: string
          metadata:
            type: object
          spec:
            description: 'PrivateCACAPoolFieldsSpec is the fields of a CA pool this
              object owns. A field left out is not owned: it is never read or written.'
            properties:
              issuancePolicy:
                description: The fields of the pool's issuance policy this object
                  owns.
                properties:
                  backdateDuration:
                    description: Optional. The duration to backdate all certificates
                      issued from this [CaPool][google.cloud.security.privateca.v1.CaPool].
                      If not set, the certificates will be issued with a not_before_time
                      of the issuance time (i.e. the current time). If set, the certificates
                      will be issued with a not_before_time of the issuance time minus
                      the backdate_duration. The not_after_time will be adjusted to
                      preserve the requested lifetime. The backdate_duration must
                      be less than or equal to 48 hours. A duration in seconds, such
                      as "3600s".
                    pattern: ^[0-9]+(\.[0-9]{1,9})?s$
                    type: string
                  baselineValues:
                    description: The part of the pool's baseline X.509 values this
                      object owns.
                    properties:
                      nameConstraints:
                        description: 'The name constraints every certificate the pool
                          issues carries (RFC 5280 section 4.2.1.10), owned whole:
                          each list replaces the pool''s.'
                        properties:
                          critical:
                            description: Indicates whether or not the name constraints
                              are marked critical.
                            type: boolean
                          excludedDNSNames:
                            description: Contains excluded DNS names. Any DNS name
                              that can be constructed by simply adding zero or more
                              labels to the left-hand side of the name satisfies the
                              name constraint. For example, `example.com`, `www.example.com`,
                              `www.sub.example.com` would satisfy `example.com` while
                              `example1.com` does not.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          excludedEmailAddresses:
                            description: Contains the excluded email addresses. The
                              value can be a particular email address, a hostname
                              to indicate all email addresses on that host or a domain
                              with a leading period (e.g. `.example.com`) to indicate
                              all email addresses in that domain.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          excludedIPRanges:
                            description: Contains the excluded IP ranges. For IPv4
                              addresses, the ranges are expressed using CIDR notation
                              as specified in RFC 4632. For IPv6 addresses, the ranges
                              are expressed in similar encoding as IPv4 addresses.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          excludedUris:
                            description: Contains the excluded URIs that apply to
                              the host part of the name. The value can be a hostname
                              or a domain with a leading period (like `.example.com`)
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          permittedDNSNames:
