        description: 'PrivateCACAPoolFields sets fields of a Certificate Authority
          Service CA pool that Config Connector''s PrivateCACAPool has no field for
          (issuancePolicy.backdateDuration and issuancePolicy.baselineValues.nameConstraints),
          and only those: it patches the pool''s issuance policy as the pool has it,
          with its own fields changed. Deleting it clears the fields it set; with
          deletion-policy abandon they stay.'
