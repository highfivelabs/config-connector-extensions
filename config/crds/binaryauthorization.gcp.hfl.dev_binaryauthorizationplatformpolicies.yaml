                                                    type: string
                                                type: object
                                              type: array
                                          required:
                                          - publicKeys
                                          type: object
                                      required:
                                      - publicKeySet
                                      type: object
                                    type: array
                                required:
                                - sigstoreAuthorities
                                type: object
                              simpleSigningAttestationCheck:
                                description: Optional. Require a SimpleSigning-type
                                  attestation for every image in the deployment.
                                properties:
                                  attestationAuthenticators:
                                    description: Required. The authenticators required
                                      by this check to verify an attestation. Typically
                                      this is one or more PKIX public keys for signature
                                      verification. Only one authenticator needs to
                                      consider an attestation verified in order for
                                      an attestation to be considered fully authenticated.
                                      In otherwords, this list of authenticators is
                                      an "OR" of the authenticator results. At least
                                      one authenticator is required.
                                    items:
                                      properties:
                                        displayName:
                                          description: Optional. A user-provided name
                                            for this `AttestationAuthenticator`. This
                                            field has no effect on the policy evaluation
                                            behavior except to improve readability
                                            of messages in evaluation results.
                                          type: string
                                        pkixPublicKeySet:
                                          description: Optional. A set of raw PKIX
                                            SubjectPublicKeyInfo format public keys.
                                            If any public key in the set validates
                                            the attestation signature, then the signature
                                            is considered authenticated (i.e. any
                                            one key is sufficient to authenticate).
                                          properties:
                                            pkixPublicKeys:
                                              description: Required. `pkix_public_keys`
                                                must have at least one entry.
                                              items:
                                                properties:
                                                  keyId:
                                                    description: Optional. The ID
                                                      of this public key. Signatures
                                                      verified by Binary Authorization
                                                      must include the ID of the public
                                                      key that can be used to verify
                                                      them. The ID must match exactly
                                                      contents of the `key_id` field
                                                      exactly. The ID may be explicitly
                                                      provided by the caller, but
                                                      it MUST be a valid RFC3986 URI.
                                                      If `key_id` is left blank and
                                                      this `PkixPublicKey` is not
                                                      used in the context of a wrapper
                                                      (see next paragraph), a default
                                                      key ID will be computed based
                                                      on the digest of the DER encoding
                                                      of the public key. If this `PkixPublicKey`
                                                      is used in the context of a
                                                      wrapper that has its own notion
                                                      of key ID (e.g. `AttestorPublicKey`),
                                                      then this field can either match
                                                      that value exactly, or be left
                                                      blank, in which case it behaves
                                                      exactly as though it is equal
                                                      to that wrapper value.
                                                    type: string
                                                  publicKeyPem:
                                                    description: A PEM-encoded public
                                                      key, as described in https://tools.ietf.org/html/rfc7468#section-13
                                                    type: string
                                                  signatureAlgorithm:
                                                    description: |-
                                                      The signature algorithm used to verify a message against a signature using
                                                      this key. These signature algorithm must match the structure and any object
                                                      identifiers encoded in `public_key_pem` (i.e. this algorithm must match
                                                      that of the public key).

                                                      One of SIGNATURE_ALGORITHM_UNSPECIFIED, RSA_PSS_2048_SHA256, RSA_SIGN_PSS_2048_SHA256, RSA_PSS_3072_SHA256, RSA_SIGN_PSS_3072_SHA256, RSA_PSS_4096_SHA256, RSA_SIGN_PSS_4096_SHA256, RSA_PSS_4096_SHA512, RSA_SIGN_PSS_4096_SHA512, RSA_SIGN_PKCS1_2048_SHA256, RSA_SIGN_PKCS1_3072_SHA256, RSA_SIGN_PKCS1_4096_SHA256, RSA_SIGN_PKCS1_4096_SHA512, ECDSA_P256_SHA256, EC_SIGN_P256_SHA256, ECDSA_P384_SHA384, EC_SIGN_P384_SHA384, ECDSA_P521_SHA512, EC_SIGN_P521_SHA512, ML_DSA_65.
                                                    type: string
                                                type: object
                                              type: array
                                          required:
                                          - pkixPublicKeys
                                          type: object
                                      type: object
                                    type: array
                                  containerAnalysisAttestationProjects:
                                    description: Optional. The projects where attestations
