                                      ID must be used, not a project number. When
                                      fetching Occurrences from Container Analysis,
                                      only `AttestationOccurrence` kinds are considered.
                                      In the future, additional Occurrence kinds may
                                      be added to the query. Maximum number of `container_analysis_attestation_projects`
                                      allowed in each `SimpleSigningAttestationCheck`
                                      is 10.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - attestationAuthenticators
                                type: object
                              slsaCheck:
                                description: Optional. Require that an image was built
                                  by a trusted builder (such as Google Cloud Build),
                                  meets requirements for Supply chain Levels for Software
                                  Artifacts (SLSA), and was built from a trusted source
                                  code repostitory.
                                properties:
                                  rules:
                                    description: Specifies a list of verification
                                      rules for the SLSA attestations. An image is
                                      considered compliant with the SlsaCheck if any
                                      of the rules are satisfied.
                                    items:
                                      properties:
                                        attestationSource:
                                          description: Specifies where to fetch the
                                            provenances attestations generated by
                                            the builder (group).
                                          properties:
                                            containerAnalysisAttestationProjects:
                                              description: The IDs of the Google Cloud
                                                projects that store the SLSA attestations
                                                as Container Analysis Occurrences,
                                                in the format `projects/[PROJECT_ID]`.
                                                Maximum number of `container_analysis_attestation_projects`
                                                allowed in each `AttestationSource`
                                                is 10.
                                              items:
                                                type: string
                                              type: array
                                          type: object
                                        configBasedBuildRequired:
                                          description: If true, require the image
                                            to be built from a top-level configuration.
                                            `trusted_source_repo_patterns` specifies
                                            the repositories containing this configuration.
                                          type: boolean
                                        customConstraints:
                                          description: Optional. A CEL expression
                                            for specifying custom constraints on the
                                            provenance payload. This can be used when
                                            users want to specify expectations on
                                            provenance fields that are not covered
                                            by the general check. For example, users
                                            can use this field to require that certain
                                            parameters should never be used during
                                            the build process.
                                          type: string
                                        trustedBuilder:
                                          description: |-
                                            Each verification rule is used for evaluation against provenances generated
                                            by a specific builder (group). For some of the builders, such as the Google
                                            Cloud Build, users don't need to explicitly specify their roots of trust in
                                            the policy since the evaluation service can automatically fetch them based
                                            on the builder (group).

                                            One of BUILDER_UNSPECIFIED, GOOGLE_CLOUD_BUILD.
                                          type: string
                                        trustedSourceRepoPatterns:
                                          description: 'List of trusted source code
                                            repository URL patterns. These patterns
                                            match the full repository URL without
                                            its scheme (e.g. `https://`). The patterns
                                            must not include schemes. For example,
                                            the pattern `source.cloud.google.com/my-project/my-repo-name`
                                            matches the following URLs: - `source.cloud.google.com/my-project/my-repo-name`
                                            - `git+ssh://source.cloud.google.com/my-project/my-repo-name`
                                            - `https://source.cloud.google.com/my-project/my-repo-name`
                                            A pattern matches a URL either exactly
                                            or with `*` wildcards. `*` can be used
                                            in only two ways: 1. trailing `*` after
                                            hosturi/ to match varying endings; 2.
                                            trailing `**` after hosturi/ to match
                                            `/` as well. `*` and `**` can only be
                                            used as wildcards and can only occur at
                                            the end of the pattern after a `/`. (So
                                            it''s not possible to match a URL that
                                            contains literal `*`.) For example: -
                                            `github.com/my-project/my-repo` is valid
                                            to match a single repo - `github.com/my-project/*`
                                            will match all direct repos in `my-project`
                                            - `github.com/**` matches all repos in
                                            GitHub'
                                          items:
                                            type: string
                                          type: array
                                      type: object
                                    type: array
                                type: object
                              trustedDirectoryCheck:
                                description: Optional. Require that an image lives
                                  in a trusted directory.
                                properties:
                                  trustedDirPatterns:
                                    description: 'Required. List of trusted directory
                                      patterns. A pattern is in the form "registry/path/to/directory".
                                      The registry domain part is defined as two or
                                      more dot-separated words, e.g., `us.pkg.dev`,
                                      or `gcr.io`. Additionally, `*` can be used in
                                      three ways as wildcards: 1. leading `*` to match
                                      varying prefixes in registry subdomain (useful
                                      for location prefixes); 2. trailing `*` after
                                      registry/ to match varying endings; 3. trailing
                                      `**` after registry/ to match "/" as well. For
                                      example: -- `gcr.io/my-project/my-repo` is valid
                                      to match a single directory -- `*-docker.pkg.dev/my-project/my-repo`
                                      or `*.gcr.io/my-project` are valid to match
                                      varying prefixes -- `gcr.io/my-project/*` will
                                      match all direct directories in `my-project`
                                      -- `gcr.io/my-project/**` would match all directories
                                      in `my-project` -- `gcr.i*` is not allowed since
                                      the registry is not completely specified --
                                      `sub*domain.gcr.io/nginx` is not valid because
                                      only leading `*` or trailing `*` are allowed.
                                      -- `*pkg.dev/my-project/my-repo` is not valid
                                      because leading `*` can only match subdomain
                                      -- `**-docker.pkg.dev` is not valid because
                                      one leading `*` is allowed, and that it cannot
                                      match `/`'
                                    items:
                                      type: string
                                    type: array
                                required:
