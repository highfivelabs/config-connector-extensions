          (platform is gke).'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                description: Optional. A description comment about the policy.
                type: string
              gkePolicy:
                description: Optional. GKE platform-specific policy.
                properties:
                  checkSets:
                    description: Optional. The `CheckSet` objects to apply, scoped
                      by namespace or namespace and service account. Exactly one `CheckSet`
                      will be evaluated for a given Pod (unless the list is empty,
                      in which case the behavior is "always allow"). If multiple `CheckSet`
                      objects have scopes that match the namespace and service account
                      of the Pod being evaluated, only the `CheckSet` with the MOST
                      SPECIFIC scope will match. `CheckSet` objects must be listed
                      in order of decreasing specificity, i.e. if a scope matches
                      a given service account (which must include the namespace),
                      it must come before a `CheckSet` with a scope matching just
                      that namespace. This property is enforced by server-side validation.
                      The purpose of this restriction is to ensure that if more than
                      one `CheckSet` matches a given Pod, the `CheckSet` that will
                      be evaluated will always be the first in the list to match (because
                      if any other matches, it must be less specific). If `check_sets`
                      is empty, the default behavior is to allow all images. If `check_sets`
                      is non-empty, the last `check_sets` entry must always be a `CheckSet`
                      with no scope set, i.e. a catchall to handle any situation not
                      caught by the preceding `CheckSet` objects.
                    items:
                      properties:
                        checks:
                          description: Optional. The checks to apply. The ultimate
                            result of evaluating the check set will be "allow" if
                            and only if every check in `checks` evaluates to "allow".
                            If `checks` is empty, the default behavior is "always
                            allow".
                          items:
                            properties:
                              alwaysDeny:
                                description: Optional. A special-case check that always
                                  denies. Note that this still only applies when the
                                  scope of the `CheckSet` applies and the image isn't
                                  exempted by an image allowlist. This check is primarily
                                  useful for testing, or to set the default behavior
                                  for all unmatched scopes to "deny".
                                type: boolean
                              displayName:
                                description: Optional. A user-provided name for this
                                  check. This field has no effect on the policy evaluation
                                  behavior except to improve readability of messages
                                  in evaluation results.
                                type: string
                              imageAllowlist:
                                description: Optional. Images exempted from this check.
                                  If any of the patterns match the image url, the
                                  check will not be evaluated.
                                properties:
                                  allowPattern:
                                    description: Required. A disjunction of image
                                      patterns to allow. If any of these patterns
                                      match, then the image is considered exempted
                                      by this allowlist.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - allowPattern
                                type: object
                              imageFreshnessCheck:
                                description: Optional. Require that an image is no
                                  older than a configured expiration time. Image age
                                  is determined by its upload time.
                                properties:
                                  maxUploadAgeDays:
                                    description: Required. The max number of days
                                      that is allowed since the image was uploaded.
                                      Must be greater than zero.
                                    format: int32
                                    type: integer
                                required:
                                - maxUploadAgeDays
                                type: object
                              sigstoreSignatureCheck:
                                description: Optional. Require that an image was signed
                                  by Cosign with a trusted key. This check requires
                                  that both the image and signature are stored in
                                  Artifact Registry.
                                properties:
                                  sigstoreAuthorities:
                                    description: Required. The authorities required
                                      by this check to verify the signature. A signature
                                      only needs to be verified by one authority to
                                      pass the check.
                                    items:
                                      properties:
                                        displayName:
                                          description: Optional. A user-provided name
                                            for this `SigstoreAuthority`. This field
                                            has no effect on the policy evaluation
                                            behavior except to improve readability
                                            of messages in evaluation results.
                                          type: string
                                        publicKeySet:
                                          description: Required. A simple set of public
