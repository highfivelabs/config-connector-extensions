        description: 'BinaryAuthorizationPlatformPolicy is a binaryauthorization.v1
          resource (https://binaryauthorization.googleapis.com/v1/{parent}/platforms/{platform}/policies/{id}),
          from its Discovery document binaryauthorization.v1 (hack/discokind). Terraform''s
          google_binary_authorization_platform_policy. A Binary Authorization platform
