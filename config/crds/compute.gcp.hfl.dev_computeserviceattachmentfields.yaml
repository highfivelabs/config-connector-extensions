              Service Connect service attachment this object owns. A field left out
              is not owned: it is never read or written.'
            properties:
              propagatedConnectionLimit:
                description: The number of consumer spokes a connected Private Service
                  Connect endpoint may be propagated to through Network Connectivity
                  Center, per endpoint (the API's default is 250).
                format: int32
                minimum: 0
                type: integer
              reconcileConnections:
