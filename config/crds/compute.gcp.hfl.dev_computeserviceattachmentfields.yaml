                  also applies to the endpoints already connected: true, and an endpoint
                  whose project or network leaves the accept list (or joins the reject
                  list) is disconnected, and a pending one now accepted is connected;
                  false, and a list change affects only endpoints that connect later.'
                type: boolean
              resourceRef:
