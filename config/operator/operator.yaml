# The config-connector-extensions operator: holds no Google credentials and
# never calls Google Cloud. It runs the managers beside Config Connector's,
# each as its own service account carrying Config Connector's Workload
# Identity annotation; --identity=config-connector (or the annotation
# gcp.hfl.dev/identity on ConfigConnector or a ConfigConnectorContext) runs
# them as Config Connector's service accounts instead (pkg/operator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-connector-extensions-operator
  namespace: config-connector-extensions-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-connector-extensions-operator
  namespace: config-connector-extensions-system
  labels:
    app.kubernetes.io/name: config-connector-extensions-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: config-connector-extensions-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-connector-extensions-operator
    spec:
      serviceAccountName: config-connector-extensions-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: ko://github.com/highfivelabs/config-connector-extensions/cmd/operator
        env:
        - name: CCE_MANAGER_IMAGE
          value: ko://github.com/highfivelabs/config-connector-extensions/cmd/manager
        args: []
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
