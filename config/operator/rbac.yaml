# What the operator may do: read Config Connector's objects and service
# accounts, run the managers, and bind Config Connector's service accounts
# to the two manager roles below, and no other role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: config-connector-extensions-operator
rules:
- apiGroups: ["core.cnrm.cloud.google.com"]
  resources: ["configconnectors", "configconnectorcontexts"]
  verbs: ["get", "list", "watch"]
# Config Connector's service accounts are only read (to wait for them and
# copy their Workload Identity annotation). The managers' own service
# accounts are written; RBAC cannot limit create to names, so this covers
# every namespace, and the operator writes only the ones it labels.
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  verbs: ["bind"]
  resourceNames: ["config-connector-extensions-manager", "config-connector-extensions-manager-cluster"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: config-connector-extensions-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: config-connector-extensions-operator
subjects:
- kind: ServiceAccount
  name: config-connector-extensions-operator
  namespace: config-connector-extensions-system
---
# A manager's Kubernetes rights, granted to Config Connector's service
# account: cluster-wide in cluster mode, in the one namespace it watches in
# namespaced mode (a RoleBinding there).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: config-connector-extensions-manager
rules:
- apiGroups: ["sql.gcp.hfl.dev", "sqladmin.gcp.hfl.dev", "secretmanager.gcp.hfl.dev", "artifactregistry.gcp.hfl.dev", "iam.gcp.hfl.dev", "run.gcp.hfl.dev", "compute.gcp.hfl.dev", "storage.gcp.hfl.dev", "logging.gcp.hfl.dev"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["sql.gcp.hfl.dev", "sqladmin.gcp.hfl.dev", "secretmanager.gcp.hfl.dev", "artifactregistry.gcp.hfl.dev", "iam.gcp.hfl.dev", "run.gcp.hfl.dev", "compute.gcp.hfl.dev", "storage.gcp.hfl.dev", "logging.gcp.hfl.dev"]
  resources: ["*/status", "*/finalizers"]
  verbs: ["get", "update", "patch"]
# Values from Secrets (SQLUser.spec.password, SecretManagerSecretVersion.spec.secretData)
# and ConfigMaps (StorageBucketObject.spec.contentFrom).
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
# Config Connector kinds the gap kinds reference.
- apiGroups: ["sql.cnrm.cloud.google.com", "kms.cnrm.cloud.google.com", "resourcemanager.cnrm.cloud.google.com", "iam.cnrm.cloud.google.com", "secretmanager.cnrm.cloud.google.com", "compute.cnrm.cloud.google.com", "vpcaccess.cnrm.cloud.google.com", "storage.cnrm.cloud.google.com", "networkservices.cnrm.cloud.google.com", "artifactregistry.cnrm.cloud.google.com", "pubsub.cnrm.cloud.google.com", "run.cnrm.cloud.google.com"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["core.cnrm.cloud.google.com"]
  resources: ["configconnectorcontexts"]
  verbs: ["get", "list", "watch"]
---
# The cluster-scoped reads a manager scoped to one namespace still needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: config-connector-extensions-manager-cluster
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["core.cnrm.cloud.google.com"]
  resources: ["configconnectors"]
  verbs: ["get", "list", "watch"]
# A namespace's cnrm.cloud.google.com/project-id annotation.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
