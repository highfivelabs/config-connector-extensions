# Kind to resource ids ("host/Resource"), where the name rule fails.
kinds:
  # A project's or, with the organization-id annotation, an organization's
  # custom role (config/servicemappings/iam.yaml containers).
  IAMCustomRole: [iam.googleapis.com/projects.roles, iam.googleapis.com/Role]
  # The name rule makes "caches" "cach", and the quota preference kind is
  # named for the API's API (checked 2026-11-23, building application.yaml).
  StorageAnywhereCache: [storage.googleapis.com/AnywhereCach]
  StorageRapidCache: [storage.googleapis.com/RapidCach]
  APIQuotaPreference: [cloudquotas.googleapis.com/QuotaPreference]

# Kinds that are not an API resource with a create method (IAM policy
# attachments, associations), with the reason.
no_resource:
  # ours
  ComputeProjectMetadataItem: one key of a project's common instance metadata, written with projects.setCommonInstanceMetadata (no create method)
  ComputeProjectDefaultNetworkTier: a project's default network tier, written with projects.setDefaultNetworkTier (it always exists)
  ProjectDefaultServiceAccounts: what a project does to its default service accounts, written with serviceAccounts.delete, disable and the project's setIamPolicy (no create method)
  ComputeRegionNetworkEndpoint: an endpoint of a regional network endpoint group, written with regionNetworkEndpointGroups.attachNetworkEndpoints
  ComputeRouterRoutePolicy: a route policy of a Cloud Router, written with routers.patchRoutePolicy
  KMSCryptoKeyFields: a field kind, the keyAccessJustificationsPolicy of a key Config Connector's KMSCryptoKey owns, written with cryptoKeys.patch (decision 37)
  ContainerClusterFields: a field kind, fields of a cluster Config Connector's ContainerCluster owns, written with clusters.update (decision 37)
  ContainerNodePoolFields: a field kind, kubelet fields of a node pool Config Connector's ContainerNodePool owns, written with nodePools.update (decision 37)
  ComputeServiceAttachmentFields: a field kind, reconcileConnections and propagatedConnectionLimit of a service attachment Config Connector's ComputeServiceAttachment owns, written with serviceAttachments.patch (decision 37)
  LoggingLogBucketFields: a field kind, indexConfigs, restrictedFields and cmekSettings of a log bucket Config Connector's LoggingLogBucket owns, written with buckets.patch (decision 37)
  ComputeNetworkFields: a field kind, the BGP best path selection of a network Config Connector's ComputeNetwork owns, written with networks.patch (decision 37)
  ComputeSubnetworkFields: a field kind, allowSubnetCidrRoutesOverlap of a subnet Config Connector's ComputeSubnetwork owns, written with subnetworks.patch (decision 37)
  PubSubTopicFields: a field kind, ingestionDataSourceSettings and messageTransforms of a topic Config Connector's PubSubTopic owns, written with topics.patch (decision 37)
  PubSubSubscriptionFields: a field kind, messageTransforms, bigtableConfig and export fields of a subscription Config Connector's PubSubSubscription owns, written with subscriptions.patch (decision 37)
  MonitoringUptimeCheckConfigFields: a field kind, userLabels and HTTP check fields of an uptime check Config Connector's MonitoringUptimeCheckConfig owns, written with uptimeCheckConfigs.patch (decision 37)
  DNSPolicyFields: a field kind, dns64Config of a DNS server policy Config Connector's DNSPolicy owns, written with policies.patch (decision 37)
  ComputeSecurityPolicyFields: a field kind, Adaptive Protection threshold configs and the request body inspection size of a security policy Config Connector's ComputeSecurityPolicy owns, written with securityPolicies.patch (decision 37)
  PrivateCACAPoolFields: a field kind, backdateDuration and baseline name constraints of a CA pool Config Connector's PrivateCACAPool owns, written with caPools.patch (decision 37)
  PrivateCACertificateTemplateFields: a field kind, maximumLifetime and name constraints of a certificate template Config Connector's PrivateCACertificateTemplate owns, written with certificateTemplates.patch (decision 37)
  DiscoveryEngineCmekConfig: a Vertex AI Search CMEK config, made and changed with cmekConfigs.patch (no create method)
  LoggingSettings: the Log Router settings of an organization or folder, written with updateSettings (they always exist)
  SecretManagerSecretVersion: a secret version, written with secrets.addVersion
  ServiceIdentity: a folder's or organization's service agent, made with services.generateServiceIdentity (nothing reads or deletes it)
  IAMBinding: one role binding in another resource's IAM policy, written with setIamPolicy
  IAMMember: one member of one role in another resource's IAM policy, written with setIamPolicy
  IAMDenyPolicy: an IAM v2 deny policy on a project, folder or organization, made with policies.createPolicy (IAM v2 is not in the Discovery documents counted)
  IAMPolicyBinding: an IAM v3 policy binding of a project, folder or organization, made with policyBindings.create (IAM v3 is not in the Discovery documents counted)
  # official (IAM policy attachments)
  IAMPolicy: an IAM policy of another resource, written with setIamPolicy
  IAMPolicyMember: one member in another resource's IAM policy, written with setIamPolicy
  IAMPartialPolicy: part of another resource's IAM policy, written with setIamPolicy
  IAMAuditConfig: audit configs of another resource's IAM policy, written with setIamPolicy

# Kind-name prefix of a group when it is not the group's own name.
prefixes: {}

# Kinds that fill one list of another resource's body (Config Connector
# splits a router's NATs, peers and interfaces, a firewall policy's rules and
# associations, into kinds of their own): "service/Resource:path". Their
# fields are matched against the parent's attributes under that path.
subresources:
  ComputeRouterNAT: compute.googleapis.com/Router:nats[]
  ComputeRouterPeer: compute.googleapis.com/Router:bgpPeers[]
  ComputeRouterInterface: compute.googleapis.com/Router:interfaces[]
  ComputeFirewallPolicyRule: compute.googleapis.com/FirewallPolicy:rules[]
  ComputeFirewallPolicyAssociation: compute.googleapis.com/FirewallPolicy:associations[]
  ComputeRegionNetworkFirewallPolicyRule: compute.googleapis.com/RegionNetworkFirewallPolicy:rules[]
  ComputeRegionNetworkFirewallPolicyAssociation: compute.googleapis.com/RegionNetworkFirewallPolicy:associations[]
  ComputeNetworkFirewallPolicyRule: compute.googleapis.com/NetworkFirewallPolicy:rules[]
  ComputeNetworkFirewallPolicyAssociation: compute.googleapis.com/NetworkFirewallPolicy:associations[]
  ComputeNetworkFirewallPolicyPacketMirroringRule: compute.googleapis.com/NetworkFirewallPolicy:packetMirroringRules[]
  ComputeFirewallPolicyPacketMirroringRule: compute.googleapis.com/FirewallPolicy:packetMirroringRules[]
  ComputeOrganizationSecurityPolicyRule: compute.googleapis.com/OrganizationSecurityPolicy:rules[]
  ComputeRegionSecurityPolicyRule: compute.googleapis.com/RegionSecurityPolicy:rules[]
  ComputeOrganizationSecurityPolicyAssociation: compute.googleapis.com/OrganizationSecurityPolicy:associations[]
  ComputeInstanceGroupNamedPort: compute.googleapis.com/InstanceGroup:namedPorts[]
  AccessContextManagerAccessLevelCondition: accesscontextmanager.googleapis.com/AccessPolicyAccessLevel:basic.conditions[]
  AccessContextManagerServicePerimeterResource: accesscontextmanager.googleapis.com/AccessPolicyServicePerimeter:status.resources[]
  BigQueryDatasetAccess: bigquery.googleapis.com/Dataset:access[]

# A kind that also fills a list of another resource's body, in addition to
# its own resource: "service/Resource:path".
also:
  ContainerNodePool: container.googleapis.com/Cluster:nodePools[]

# Names the Config Connector kinds give an API path that the rules cannot
# connect (Terraform's names): per resource, API path prefix to CRD path
# prefix, the longest prefix wins. Kubernetes Engine is where it matters
# most (a managed cluster is the end of the foundation).
aliases:
  container.googleapis.com/Cluster:
    autoscaling.autoprovisioningNodePoolDefaults: clusterAutoscaling.autoProvisioningDefaults
    autoscaling: clusterAutoscaling
    shieldedNodes.enabled: enableShieldedNodes
    legacyAbac.enabled: enableLegacyAbac
    binaryAuthorization.enabled: enableBinaryAuthorization
    autopilot.enabled: enableAutopilot
    locations: nodeLocations
    initialClusterVersion: minMasterVersion
    defaultMaxPodsConstraint.maxPodsPerNode: defaultMaxPodsPerNode
    networkConfig.datapathProvider: datapathProvider
    nodePools[].config: nodePools[].nodeConfig
    nodePools[].locations: nodePools[].nodeLocations
    nodePools[].maxPodsConstraint.maxPodsPerNode: nodePools[].maxPodsPerNode
  container.googleapis.com/ClusterNodePool:
    config: nodeConfig
    locations: nodeLocations
    maxPodsConstraint.maxPodsPerNode: maxPodsPerNode
  # Terraform's names for a record set's routing policy fencing and trickle
  # traffic (google_dns_record_set's enable_geo_fencing,
  # enable_geo_fencing_for_backups, trickle_ratio), which Config
  # Connector's DNSRecordSet keeps (foundation item 15, checked 2026-11-23).
  dns.googleapis.com/ResourceRecordSet:
    routingPolicy.geo.enableFencing: routingPolicy.enableGeoFencing
    routingPolicy.primaryBackup.backupGeoTargets.enableFencing: routingPolicy.primaryBackup.enableGeoFencingForBackups
    routingPolicy.primaryBackup.trickleTraffic: routingPolicy.primaryBackup.trickleRatio
