# Kind group (the part of the API group before the first dot) to the
# service hosts it covers, where Config Connector's service mapping and
# the Discovery name do not already say so.
group_hosts:
  tags: [cloudresourcemanager.googleapis.com]
  filestore: [file.googleapis.com]
  cloudfunctions2: [cloudfunctions.googleapis.com]
  cloudids: [ids.googleapis.com]
  bigqueryanalyticshub: [analyticshub.googleapis.com]
  bigquerybiglake: [biglake.googleapis.com]
  clouddms: [datamigration.googleapis.com]
  dialogflowcx: [dialogflow.googleapis.com]
  identityplatform: [identitytoolkit.googleapis.com]
  mlengine: [ml.googleapis.com]
  cloudtalentsolution: [jobs.googleapis.com]
  configdeployment: [config.googleapis.com]
  grafeas: [containeranalysis.googleapis.com]
  visionai: [visionai.googleapis.com, warehouse-visionai.googleapis.com]
  vertexai: [aiplatform.googleapis.com]

# Kind to resource ids ("host/Resource"), where the name rule fails.
kinds: {}

# Kinds that are not an API resource with a create method (IAM policy
# attachments, associations), with the reason.
no_resource:
  # ours
  ComputeProjectMetadataItem: one key of a project's common instance metadata, written with projects.setCommonInstanceMetadata (no create method)
  ComputeRegionNetworkEndpoint: an endpoint of a regional network endpoint group, written with regionNetworkEndpointGroups.attachNetworkEndpoints
  ComputeRouterRoutePolicy: a route policy of a Cloud Router, written with routers.patchRoutePolicy
  LoggingSettings: the Log Router settings of an organization or folder, written with updateSettings (they always exist)
  SecretManagerSecretVersion: a secret version, written with secrets.addVersion
  IAMRoleBinding: one role binding in another resource's IAM policy, written with setIamPolicy
  IAMRoleMember: one member of one role in another resource's IAM policy, written with setIamPolicy
  # official (IAM policy attachments)
  IAMPolicy: an IAM policy of another resource, written with setIamPolicy
  IAMPolicyMember: one member in another resource's IAM policy, written with setIamPolicy
  IAMPartialPolicy: part of another resource's IAM policy, written with setIamPolicy
  IAMAuditConfig: audit configs of another resource's IAM policy, written with setIamPolicy

# Kind-name prefix of a group when it is not the group's own name.
prefixes: {}

# Kinds that fill one list of another resource's body (Config Connector
# splits a router's NATs, peers and interfaces, a firewall policy's rules and
# associations, into kinds of their own): "service/Resource:path". Their
# fields are matched against the parent's attributes under that path.
subresources:
  ComputeRouterNAT: compute.googleapis.com/Router:nats[]
  ComputeRouterPeer: compute.googleapis.com/Router:bgpPeers[]
  ComputeRouterInterface: compute.googleapis.com/Router:interfaces[]
  ComputeFirewallPolicyRule: compute.googleapis.com/FirewallPolicy:rules[]
  ComputeFirewallPolicyAssociation: compute.googleapis.com/FirewallPolicy:associations[]
  ComputeNetworkFirewallPolicyRule: compute.googleapis.com/NetworkFirewallPolicy:rules[]
  ComputeNetworkFirewallPolicyAssociation: compute.googleapis.com/NetworkFirewallPolicy:associations[]
  ComputeOrganizationSecurityPolicyRule: compute.googleapis.com/OrganizationSecurityPolicy:rules[]
  ComputeOrganizationSecurityPolicyAssociation: compute.googleapis.com/OrganizationSecurityPolicy:associations[]
  ComputeInstanceGroupNamedPort: compute.googleapis.com/InstanceGroup:namedPorts[]
  AccessContextManagerAccessLevelCondition: accesscontextmanager.googleapis.com/AccessPolicyAccessLevel:basic.conditions[]
  AccessContextManagerServicePerimeterResource: accesscontextmanager.googleapis.com/AccessPolicyServicePerimeter:status.resources[]
  BigQueryDatasetAccess: bigquery.googleapis.com/Dataset:access[]

# A kind that also fills a list of another resource's body, in addition to
# its own resource: "service/Resource:path".
also:
  ContainerNodePool: container.googleapis.com/Cluster:nodePools[]

# Names the Config Connector kinds give an API path that the rules cannot
# connect (Terraform's names): per resource, API path prefix to CRD path
# prefix, the longest prefix wins. Kubernetes Engine is where it matters
# most (a managed cluster is the end of the foundation).
aliases:
  container.googleapis.com/Cluster:
    autoscaling.autoprovisioningNodePoolDefaults: clusterAutoscaling.autoProvisioningDefaults
    autoscaling: clusterAutoscaling
    shieldedNodes.enabled: enableShieldedNodes
    legacyAbac.enabled: enableLegacyAbac
    binaryAuthorization.enabled: enableBinaryAuthorization
    autopilot.enabled: enableAutopilot
    locations: nodeLocations
    initialClusterVersion: minMasterVersion
    defaultMaxPodsConstraint.maxPodsPerNode: defaultMaxPodsPerNode
    networkConfig.datapathProvider: datapathProvider
    nodePools[].config: nodePools[].nodeConfig
    nodePools[].locations: nodePools[].nodeLocations
    nodePools[].maxPodsConstraint.maxPodsPerNode: nodePools[].maxPodsPerNode
  container.googleapis.com/ClusterNodePool:
    config: nodeConfig
    locations: nodeLocations
    maxPodsConstraint.maxPodsPerNode: maxPodsPerNode
