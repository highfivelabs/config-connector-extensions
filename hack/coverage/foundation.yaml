  # ---- A, stability ----
  - title: Stable kinds for the alpha-only foundation kinds (deny policies, principal access boundary, hierarchical security policy, network firewall rules, response policies)
    importance: A
    gap: stability
    modules: 6
    module_names: organization, folder, project, net-cloud-armor, net-firewall-policy, dns-response-policy
    size: L
    resources:
      - compute.googleapis.com/OrganizationSecurityPolicy
      - compute.googleapis.com/NetworkFirewallPolicy
      - dns.googleapis.com/ResponsePolicy
      - dns.googleapis.com/ResponsePolicyRule
    missing: >-
      Nothing is missing; the kinds exist only as `v1alpha1` and the charts refuse alpha: `IAMDenyPolicy`,
      `IAMPrincipalAccessBoundaryPolicy`, `IAMAccessBoundaryPolicy`, `IAMAccessPolicy`,
      `ComputeOrganizationSecurityPolicy` with its association and rule, `ComputeNetworkFirewallPolicyRule`,
      `DNSResponsePolicy`, `DNSResponsePolicyRule` (the measured list is "Official but alpha-only" below).
    attributes: >-
      None known beyond the field gaps in the field items; the work is promotion, not fields.
    upstream: >-
      IAM deny policies: open PR #7303 "Add IAM deny policies support" (2026-07-08, review required). No pull request
      found for the others. Config Connector promotes a kind from alpha to beta with its releases; check the
      release notes before building.
    build: >-
      Do not copy alpha kinds. Per kind: wait for the promotion when upstream has a pull request; otherwise ship a
      stable kind in our group that is the same schema on the direct reconciler. Deny policy first (the
      organization, folder and project modules all need it; its API is IAM v2 `policies` with `createPolicy`,
      which the Discovery denominator does not count as a create). Order: `IAMDenyPolicy`,
      `ComputeOrganizationSecurityPolicyAssociation`, `ComputeNetworkFirewallPolicyRule`,
      `IAMPrincipalAccessBoundaryPolicy`, `DNSResponsePolicy` and its rule. `IAMDenyPolicy` built 2026-11-10
      (`iam.gcp.hfl.dev/v1beta1`, upstream's alpha types and direct controller copied; mockgcp unpatched); live
      pending Deny Admin, which is granted on an organization.
    decided: >-
      "Ship our own stable kinds." Copy upstream's alpha types and controllers into our group as stable kinds; when
      upstream promotes, users move over by acquiring the same resource (`docs/design.md` decision 13, as with
      `RunService`, decision 11).
  # ---- A, fields ----
  - title: Cloud Router fields (BGP peers, NAT, interfaces, MD5 keys)
    importance: A
    gap: field
    modules: 6
    module_names: net-cloudnat, net-vpn-ha, net-vpn-dynamic, net-vlan-attachment, net-ipsec-over-interconnect, ncc-spoke-ra
    size: S
    resources:
      - compute.googleapis.com/Router
    missing: >-
      `md5AuthenticationKeys[]` on `ComputeRouter` (a BGP peer's `md5AuthenticationKeyName` needs it); on
      `ComputeRouterPeer`: `enableIpv4`, `ipv4NexthopAddress`, `peerIpv4NexthopAddress`,
      `customLearnedRoutePriority`, `customLearnedIpRanges`, `importPolicies`/`exportPolicies` (these two pair with
      our `ComputeRouterRoutePolicy`); on `ComputeRouterInterface`: `ipVersion`; on `ComputeRouterNAT`:
      `autoNetworkTier`, `nat64Subnetworks`, `sourceSubnetworkIpRangesToNat64`; `bgp.identifierRange`. (`name`
      fields are the object's name, not missing.)
    attributes: The measured list; the first five matter for HA VPN and Interconnect.
    upstream: >-
      no pull request for these fields. Open PR #13960 (2026-10-27) "align migration diffs for ComputeRouter":
      `ComputeRouter` is moving to the direct controller, which is where new fields would land.
    build: >-
      Our `ComputeRouter` (`compute.gcp.hfl.dev/v1alpha1`, built 2026-11-10): upstream's direct `ComputeRouter`
      copied, owning the whole router, with `bgp.identifierRange`, `md5AuthenticationKeys` (values from Secrets),
      `interfaces`, `bgpPeers` and `nats` and every field listed above; patch 0027 (`docs/design.md` 6.5). A router
      moves to it by acquiring the same name and abandoning the official `ComputeRouter`, `ComputeRouterInterface`,
      `ComputeRouterPeer` and `ComputeRouterNAT` objects.
    decided: >-
      "Copy upstream's PR as our kind." Copy #13960's direct `ComputeRouter` into our group as a complete kind that
      owns the whole router; a workload that needs these fields moves its router to ours (acquire by name, abandon
      the official object); retire ours when upstream releases (`docs/design.md` decision 14).
