      request is covered but for `sharedSecretHash`, which the API sets and
      our kind keeps in status. The interconnect attachment's
      `candidateIpv6Subnets`, the IPv6 router candidates and `l2Forwarding`
      are in our generated `ComputeInterconnectAttachment` (built
