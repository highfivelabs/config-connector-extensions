# The foundation gap report's queue (docs/coverage/foundation.md): the
# judgement, by hand. The order is the rank and must follow: importance
# (A, B, C), then gap (whole, stability, field), then modules (most first),
# then size (S, M, L); the generator refuses a file that does not. The
# numbers (coverage of `resources`, the uncovered attributes, the official
# kinds) are measured by the generator.
#
# resources: "service/Resource" or "service/Resource:path[]" (only the
#   attributes under the path). Leave empty when the API has no create to
#   count against.
# modules: Cloud Foundation Fabric v60.0.0 modules that create the resource
#   (catalog/docs/gcp-inventory.md, catalog @ 6258f92).
# Upstream was read 2026-11-09: Config Connector master (3df0e2d5; its CRDs
#   equal the pin's but for one AI Platform kind) and open pull requests,
#   read-only.
items:
  # ---- A, whole resources ----
  - title: Hierarchy and project settings (service identity at folder and organization, default service accounts, default network tier)
    importance: A
    gap: whole
    modules: 3
    module_names: project, folder, organization
    size: M
    resources: []
    missing: >-
      `ServiceIdentity` for a folder and for an organization (`google_folder_service_identity`,
      `google_organization_service_identity`; Config Connector's `ServiceIdentity` is project-only),
      `ProjectDefaultServiceAccounts` (what the project module does to the default Compute and App Engine service
      accounts: delete, deprivilege or disable), `ComputeProjectDefaultNetworkTier`.
    attributes: >-
      ServiceIdentity: `service` and a `folderRef` or `organizationRef`, status `email`. Default service accounts:
      `action` (`DELETE`, `DEPRIVILEGE`, `DISABLE`), `restorePolicy`, a `projectRef`. Network tier: `networkTier`
      (`PREMIUM`, `STANDARD`).
    upstream: >-
      none. No kind or pull request for folder or organization service identities, default service accounts or the
      default network tier (`docs/design.md` 6.5 rows 7 and 10 found the same).
    build: >-
      `ServiceIdentity` with a folder or organization parent in `serviceusage.gcp.hfl.dev/v1alpha1`
      (`serviceusage.googleapis.com` `services:generateServiceIdentity`, a long-running operation returning the
      email; Terraform's `google_folder_service_identity` read, not copied): built 2026-11-09, generated with
      `hack/scaffold-kind.sh`; live pending the test folder. `ProjectDefaultServiceAccounts`
      (`resourcemanager.gcp.hfl.dev`): the Compute default account is `{projectNumber}-compute@developer.gserviceaccount.com`,
      the App Engine one `{projectId}@appspot.gserviceaccount.com`; `DELETE` is `serviceAccounts.delete`,
      `DEPRIVILEGE` removes its project role bindings (`projects.setIamPolicy`), `DISABLE` is
      `serviceAccounts.disable`; abandon restores nothing unless `restorePolicy: REVERT`: built 2026-11-09
      (`ProjectDefaultServiceAccounts`, mockgcp patch 0024); live pending a test project under the test folder.
      `ComputeProjectDefaultNetworkTier`: `projects.setDefaultNetworkTier`, a singleton per project like
      `ComputeProjectMetadataItem` (copy it): built 2026-11-09; live pending a test project under the test folder
      and `compute.projects.setDefaultNetworkTier` there.
  - title: Regional network firewall policy rules, associations and packet mirroring rules
    importance: A
    gap: whole
    modules: 2
    module_names: net-firewall-policy, net-vpc
    size: M
    resources:
      - compute.googleapis.com/RegionNetworkFirewallPolicy:rules[]
      - compute.googleapis.com/RegionNetworkFirewallPolicy:associations[]
      - compute.googleapis.com/RegionNetworkFirewallPolicy:packetMirroringRules[]
      - compute.googleapis.com/NetworkFirewallPolicy:packetMirroringRules[]
      - compute.googleapis.com/FirewallPolicy:packetMirroringRules[]
    missing: >-
      `ComputeRegionNetworkFirewallPolicyRule`, `ComputeRegionNetworkFirewallPolicyAssociation` and
      `ComputeRegionNetworkFirewallPolicyPacketMirroringRule`; the same packet mirroring rule for the global network
      policy (`google_compute_network_firewall_policy_packet_mirroring_rule`) and the hierarchical policy. Our
      `ComputeRegionNetworkFirewallPolicy` is the policy only (its `description`).
    attributes: >-
      All of a rule: `priority`, `action`, `direction`, `disabled`, `enableLogging`, `ruleName`, `description`,
      `match` (`srcIpRanges`, `destIpRanges`, `layer4Configs[]`, `srcFqdns`, `destFqdns`, `srcRegionCodes`,
      `destRegionCodes`, `srcThreatIntelligences`, `destThreatIntelligences`, `srcAddressGroups`,
      `destAddressGroups`, `srcSecureTags`, `srcNetworkType`, `destNetworkType`), `targetSecureTags`,
      `targetServiceAccounts`, `securityProfileGroup`, `tlsInspect`. An association is `attachmentTarget`
      (a network), `name` and `priority`.
    upstream: >-
      none. No kind or pull request for the regional policy; the global `ComputeNetworkFirewallPolicyRule` and
      `...Association` are Terraform-based (the rule is alpha-only, see the stability item), with no packet mirroring
      rule at all. `docs/design.md` 6.5 row 6 has the same finding.
    build: >-
      Three kinds in `compute.gcp.hfl.dev/v1alpha1`, `ComputeRegionNetworkFirewallPolicyRule`,
      `...Association`, `...PacketMirroringRule`, each with `policyRef` (our `ComputeRegionNetworkFirewallPolicy`
      by name or `external`) and `region`. Copy `pkg/controller/direct/compute/regionnetworkfirewallpolicy_controller.go`
      and `apis/compute/v1alpha1/computeregionnetworkfirewallpolicy_*` as the pattern (direct controller on the
      regional client; the policy's mockgcp patch is `0014`). API: `regionNetworkFirewallPolicies.addRule`,
      `patchRule`, `removeRule`, `getRule`, `addAssociation`, `removeAssociation`, `addPacketMirroringRule`,
      `patchPacketMirroringRule`, `removePacketMirroringRule`; identity `projects/{p}/regions/{r}/firewallPolicies/{policy}`
      plus `priority` for a rule and `name` for an association; every change goes through the policy's
      fingerprint. Fields from Terraform's `google_compute_region_network_firewall_policy_rule` (read, not copied).
      Extend mockgcp with a numbered patch (check `mockgcp/mockcompute` for what the policy's patch `0014`
      already serves); write the end-to-end test on `pkg/test/mockenv` and record a live row.
