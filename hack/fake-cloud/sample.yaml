# What bundt's charts/infra/gcp renders for bntd, cut to what the fake
# cloud needs: a Cloud SQL Postgres instance with IAM sign-in, its
# database, bntd's Google service account, and its IAM database user with
# database roles (gaps-gcp's SQLUser). Each names its project, as
# the chart does: with no Config Connector webhook here, the namespace's
# project-id annotation is not copied onto resources.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: bundt
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  # Bundt runs POSTGRES_17; mockgcp knows Postgres up to 16 (docs/fake-cloud.md).
  databaseVersion: POSTGRES_16
  region: us-central1
  settings:
    tier: db-custom-1-3840
    edition: ENTERPRISE
    availabilityType: ZONAL
    diskSize: 10
    deletionProtectionEnabled: true
    databaseFlags:
      - name: cloudsql.iam_authentication
        value: "on"
    backupConfiguration:
      enabled: true
      pointInTimeRecoveryEnabled: true
---
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLDatabase
metadata:
  name: bundt
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: bundt
  instanceRef:
    name: bundt
  charset: UTF8
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  # Google requires 6 to 30 characters.
  name: bntd-app
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  displayName: bntd
---
apiVersion: sql.gcp.hfl.dev/v1beta1
kind: SQLUser
metadata:
  name: bntd
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  resourceID: bntd-app@mock-project.iam
  type: CLOUD_IAM_SERVICE_ACCOUNT
  instanceRef:
    name: bundt
  databaseRoles:
    - cloudsqlsuperuser
