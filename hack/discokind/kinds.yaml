  resource: projects.locations.cmekConfigs
  parents: [project]
  terraform: google_discovery_engine_cmek_config
  locationHost: true
  query: [setDefault]
  sweepLocation: us
  fakeDefaults: {state: ACTIVE}
  note: "A Cloud KMS key that Vertex AI Search (Discovery Engine) encrypts a location's data with; location is us or eu, served at that location's host. The API has no create: patch makes the config. Terraform's set_default defaults to true; here setDefault is sent only when the spec sets it."

# Security Command Center at folder and project level (foundation item
# 20, decision 16): Config Connector's SecurityCenterBigQueryExport and
# SecurityCenterNotificationConfig are v1alpha1 and take an organization
# only, so ours are stable (decision 26) with all three parents, on the v1
# API as our SecurityCenterMuteConfig is.

- kind: SecurityCenterBigQueryExport
  group: securitycenter.gcp.hfl.dev
  version: v1beta1
  discovery: securitycenter.v1
  resource: projects.bigQueryExports
  parents: [project, folder, organization]
  terraform: google_scc_project_scc_big_query_export
  note: "A continuous export of Security Command Center findings to a BigQuery dataset (projects/{project}/datasets/{dataset}); an organization's, folder's or project's (Terraform's google_scc_organization_scc_big_query_export, _folder_scc_big_query_export, _project_scc_big_query_export)."

- kind: SecurityCenterNotificationConfig
  group: securitycenter.gcp.hfl.dev
  version: v1beta1
  discovery: securitycenter.v1
  resource: projects.notificationConfigs
  parents: [project, folder, organization]
  terraform: google_scc_project_notification_config
  note: "Security Command Center findings that match streamingConfig.filter, published to a Pub/Sub topic (projects/{project}/topics/{topic}); an organization's, folder's or project's (Terraform's google_scc_notification_config, _folder_notification_config, _project_notification_config)."

# Foundation whole-resource gaps with no Config Connector kind (2026-11-19,
# docs/coverage/foundation.md "Every resource"): a Cross-Site
# Interconnect's attachment group (item 7, beside ComputeInterconnectGroup)
# and a Cloud DNS outbound endpoint (the forwarding address a VPC network's
# outbound DNS queries leave from).

- kind: ComputeInterconnectAttachmentGroup
  group: compute.gcp.hfl.dev
  version: v1alpha1
  discovery: compute.v1
  resource: interconnectAttachmentGroups
  parents: [project]
  terraform: google_compute_interconnect_attachment_group
  skip: {etag: "the API's optimistic-locking token, which it generates; a spec that held it would go stale with every change"}
  note: "A group of VLAN attachments for a topology Google checks."

- kind: DNSOutboundEndpoint
  group: dns.gcp.hfl.dev
  version: v1alpha1
  discovery: dns.v1
  resource: outboundEndpoints
  parents: [project]
  terraform: google_dns_outbound_endpoint
  sweepLocation: us-central1
  note: "An address on a subnetwork that Cloud DNS sends a VPC network's outbound forwarded queries from."

# Foundation item 21 (2026-11-23): an access policy's authorized orgs
# descriptions. Config Connector's open pull request #14202 adds the kind
# as a Terraform-based one (google_access_context_manager_authorized_orgs_desc,
# accesscontextmanager.cnrm.cloud.google.com/v1alpha1), which this
# manager cannot run; its field names are the API's, as here, and its
# fixtures are copied into this kind's (UPSTREAM.md, docs/design.md 2.3).

- kind: AccessContextManagerAuthorizedOrgsDesc
  group: accesscontextmanager.gcp.hfl.dev
  version: v1alpha1
  discovery: accesscontextmanager.v1
  resource: accessPolicies.authorizedOrgsDescs
  terraform: google_access_context_manager_authorized_orgs_desc
  nameInBody: true
  immutable: [assetType, authorizationDirection, authorizationType]
  note: "The organizations an organization's access policy trusts for, or lets evaluate, device and credential strength signals; accessPolicy is the access policy's number. The ID starts with a letter, then letters, digits or _."

# Foundation item 21's perimeter fields (2026-11-23): Config Connector's
# Terraform-based AccessContextManagerServicePerimeter lacks, in both the
# enforced (status) and the dry-run (spec) configuration, an egress rule's
# sources and sourceRestriction, the rules' roles and titles, PSC endpoint
# sources and VPC accessible services' allowedServicePatterns; Terraform's
# update sends status or spec whole, so no field kind can own them. Ours is
# a parallel kind with the API's field set (decision 19); upstream master
# has direct types for the perimeter (no controller) without these fields.
- kind: AccessContextManagerServicePerimeter
  group: accesscontextmanager.gcp.hfl.dev
  version: v1alpha1
  discovery: accesscontextmanager.v1
  resource: accessPolicies.servicePerimeters
  terraform: google_access_context_manager_service_perimeter
  nameInBody: true
  immutable: [perimeterType]
  skip: {etag: "the API's optimistic-locking token, which it generates; a spec that held it would go stale with every change"}
  note: "A VPC Service Controls perimeter of an access policy, with its enforced (status) and dry-run (spec) configurations; accessPolicy is the access policy's number. The ID starts with a letter, then letters, digits or _."
