# Config Connector's NetworkSecurityAuthzPolicy is alpha and takes every
# target as a forwarding rule (ForwardingRuleRef), so it cannot name an
# agent gateway; ours takes target.resources as the API's names (a
# forwarding rule, a Secure Web Proxy gateway or an agent gateway), a
# stable equivalent (decision 26).
- kind: NetworkSecurityAuthzPolicy
