# Gaps the catalog's modules create (catalog docs/coverage/resource-types.csv,
# 2026-11-12). ComputeNetworkAttachment is a Config Connector alpha kind
# for VPC networking, a foundation area: our own stable kind (decision 13).

- kind: ComputeNetworkAttachment
  group: compute.gcp.hfl.dev
  version: v1beta1
  discovery: compute.v1
  resource: networkAttachments
  parents: [project]
  terraform: google_compute_network_attachment
  note: "Subnets of a consumer's network that Private Service Connect producers attach interfaces to."

# The catalog's VPN and interconnect ports (2026-11-13): Config Connector's
# ComputeInterconnectAttachment (v1beta1) lacks the candidate Cloud Router
# and customer router addresses (candidateCloudRouterIpAddress,
# candidateCustomerRouterIpAddress and their IPv6 forms), so ours is a
# stable equivalent with the API's whole field set (decisions 19 and 26, as
# NetworkServicesGateway). Immutable as Terraform's
# google_compute_interconnect_attachment forces a new attachment for them.
- kind: ComputeInterconnectAttachment
  group: compute.gcp.hfl.dev
  version: v1beta1
  discovery: compute.v1
  resource: interconnectAttachments
  parents: [project]
  terraform: google_compute_interconnect_attachment
  immutable: [interconnect, type, router, edgeAvailabilityDomain, candidateSubnets, candidateIpv6Subnets, candidateCloudRouterIpAddress, candidateCloudRouterIpv6Address, candidateCustomerRouterIpAddress, candidateCustomerRouterIpv6Address, vlanTag8021q, ipsecInternalAddresses, encryption, subnetLength, pairingKey, l2Forwarding]
  note: "A VLAN attachment: an interconnect's connection to a Cloud Router, with the router and customer addresses chosen from candidates."

# Foundation item 11 (2026-11-23): Config Connector's DCL-based
# ComputeServiceAttachment sends consumerAcceptLists whole and has no
# networkUrl in it, and takes no domainNames, metadata or
# natIpsPerEndpoint. Ours is a parallel kind with the API's whole field set
# (decision 19, as ComputeInterconnectAttachment); a workload moves to it by
# acquiring the same attachment. mockgcp serves service attachments for the
# field kind's test (patch 0054), so the fake leaves them to it.
# Immutable as Terraform's google_compute_service_attachment forces a new
# attachment for them; enableProxyProtocol as Config Connector's CRD says.
- kind: ComputeServiceAttachment
  group: compute.gcp.hfl.dev
  version: v1alpha1
  discovery: compute.v1
  resource: serviceAttachments
  parents: [project]
  terraform: google_compute_service_attachment
  mockgcp: true
  immutable: [targetService, domainNames, enableProxyProtocol]
  skip: {producerForwardingRule: "the API's older name for targetService, which replaces it"}
  note: "A Private Service Connect producer's service attachment: the internal load balancer it publishes, its NAT subnets, and the consumer projects and networks it accepts."

# Foundation item 16 (2026-11-23): Config Connector's Terraform-based
# ComputeSubnetwork lacks ipCollection, externalIpv6Prefix,
# internalIpv6Prefix, resolveSubnetMask and params.resourceManagerTags,
# which the API takes only at insert, and the secondary ranges'
# ipCollection and ipVersion (a list Terraform sends whole). Ours is a
# parallel kind with the API's field set (decision 19); mockgcp serves
# subnetworks for many other tests, so the fake leaves them to it. Immutable:
# what the API takes only at insert, and ipCidrRange and
# privateIpGoogleAccess, which it changes only by expandIpCidrRange and
# setPrivateIpGoogleAccess, not by patch (a subnet that needs either stays
# on Config Connector's kind).
- kind: ComputeSubnetwork
  group: compute.gcp.hfl.dev
  version: v1alpha1
  discovery: compute.v1
  resource: subnetworks
  parents: [project]
  terraform: google_compute_subnetwork
  mockgcp: true
  immutable: [description, network, ipCidrRange, privateIpGoogleAccess, purpose, ipCollection, externalIpv6Prefix, internalIpv6Prefix, resolveSubnetMask, reservedInternalRange, params]
  inputOnly: [params.resourceManagerTags]
  skip: {enableFlowLogs: "deprecated by the API in favour of logConfig.enable"}
  note: "A VPC subnetwork, with what the API takes only at insert: a BYOIP IPv6 prefix (ipCollection), the IPv6 prefixes, subnet mask resolution and resource manager tags."

# Foundation item 27 (2026-11-23): a regional Cloud Armor security policy,
# which Config Connector has no kind for (its ComputeSecurityPolicy is
# global and Terraform-based), for regional external load balancers and
# network edge policies (CLOUD_ARMOR_NETWORK: ddosProtectionConfig and
# userDefinedFields). Rules are left out: the API changes them only by
# addRule, patchRule and removeRule (a rule kind is next), and adds the
# default rule itself. Labels are left out too: only setLabels changes them.
- kind: ComputeRegionSecurityPolicy
  group: compute.gcp.hfl.dev
  version: v1alpha1
  discovery: compute.v1
  resource: regionSecurityPolicies
  parents: [project]
  terraform: google_compute_region_security_policy
  immutable: [type]
  skip:
    rules: "the API changes rules only by addRule, patchRule and removeRule, and adds the default rule itself"
    labels: "the API sets labels only by setLabels, which the generated controller does not call"
    labelFingerprint: "setLabels' optimistic-locking token"
    associations: "an organization (hierarchical) security policy's; a regional policy has none"
    shortName: "an organization (hierarchical) security policy's; a regional policy has none"
  note: "A regional Cloud Armor security policy: a regional external load balancer's (CLOUD_ARMOR) or a network edge policy (CLOUD_ARMOR_NETWORK) with DDoS protection and user-defined fields. Its rules are not part of it."

