  resource: projects.locations.authzPolicies
  parents: [project]
  terraform: google_network_security_authz_policy
  note: "An authorization policy: allow, deny or delegate (to IAP or an authorization extension) the requests a forwarding rule, a Secure Web Proxy or an agent gateway receives."
  sweepLocation: us-central1

