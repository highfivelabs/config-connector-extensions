apiVersion: gkehub.gcp.hfl.dev/v1alpha1
kind: GKEHubRolloutSequence
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: global
  labels:
    cce-e2e: "true"
    cce-run: "${RUN_ID}"
  displayName: config-connector-extensions test
  stages:
  - fleetProjects: ["projects/${PROJECT}"]
    soakDuration: 3600s
