apiVersion: securitycenter.gcp.hfl.dev/v1beta1
kind: SecurityCenterNotificationConfig
metadata:
  name: ${NAME}
spec:
  organizationRef:
    external: organizations/${ORGANIZATION}
  description: Findings published by a config-connector-extensions test.
  pubsubTopic: projects/${PROJECT}/topics/${NAME}
  streamingConfig:
    filter: severity="HIGH"
