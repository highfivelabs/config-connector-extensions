apiVersion: securitycenter.gcp.hfl.dev/v1beta1
kind: SecurityCenterBigQueryExport
metadata:
  name: ${NAME}
spec:
  organizationRef:
    external: organizations/${ORGANIZATION}
  description: Findings exported by a config-connector-extensions test, changed.
  dataset: projects/${PROJECT}/datasets/${ID}
  filter: severity="HIGH" OR severity="CRITICAL"
