# Modified by High Five Labs for config-connector-extensions.
# Copied from Config Connector's open pull request #14202
# (pkg/test/resourcefixture/testdata/basic/accesscontextmanager/v1alpha1/
# accesscontextmanagerauthorizedorgsdesc/accesscontextmanagerauthorizedorgsdescbasic/update.yaml,
# UPSTREAM.md): our group, the access policy as an ID (accessPolicy, not
# accessPolicyRef), and kindtest's placeholders; the organizations are the
# pull request's made-up ones.
apiVersion: accesscontextmanager.gcp.hfl.dev/v1alpha1
kind: AccessContextManagerAuthorizedOrgsDesc
metadata:
  name: ${NAME}
spec:
  accessPolicy: "100000000001"
  assetType: ASSET_TYPE_CREDENTIAL_STRENGTH
  authorizationDirection: AUTHORIZATION_DIRECTION_TO
  authorizationType: AUTHORIZATION_TYPE_TRUST
  orgs:
  - organizations/12345
  - organizations/98765
  - organizations/54321
  resourceID: ${ID}
