apiVersion: logging.gcp.hfl.dev/v1alpha1
kind: LoggingSavedQuery
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: global
  # Saved query IDs take letters and digits only.
  resourceID: ${ID}
  displayName: Errors (${NAME})
  description: A saved query made by a config-connector-extensions test.
  visibility: SHARED
  loggingQuery:
    filter: severity>=ERROR
