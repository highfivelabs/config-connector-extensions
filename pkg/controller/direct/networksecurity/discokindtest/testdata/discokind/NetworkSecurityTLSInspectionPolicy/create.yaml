apiVersion: networksecurity.gcp.hfl.dev/v1beta1
kind: NetworkSecurityTLSInspectionPolicy
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: us-central1
  # References (kinds.yaml refs); update.yaml sets the strings.
  caPoolRef:
    external: projects/${PROJECT}/locations/us-central1/caPools/${NAME}-pool
  trustConfigRef:
    name: ${KIND_NAME}-trust
  excludePublicCaSet: false
  minTlsVersion: TLS_1_2
  description: made by a config-connector-extensions test
