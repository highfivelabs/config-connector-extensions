apiVersion: networksecurity.gcp.hfl.dev/v1beta1
kind: NetworkSecurityGatewaySecurityPolicyRule
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: us-central1
  # A reference (kinds.yaml refs) to the policy the test makes first;
  # update.yaml sets its ID.
  gatewaySecurityPolicyRef:
    external: projects/${PROJECT}/locations/us-central1/gatewaySecurityPolicies/${KIND_NAME}-gsp
  basicProfile: ALLOW
  enabled: true
  priority: 10
  sessionMatcher: host() == 'example.com'
  description: made by a config-connector-extensions test
