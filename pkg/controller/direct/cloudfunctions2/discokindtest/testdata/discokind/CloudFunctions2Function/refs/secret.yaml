# The Secret Manager secret the function's secretRef names by name
# (kindtest's refs/): ours, made first, for the object and its abandoned one.
apiVersion: secretmanager.gcp.hfl.dev/v1beta1
kind: SecretManagerSecret
metadata:
  name: ${KIND_NAME}-secret
  annotations:
    cnrm.cloud.google.com/project-id: ${PROJECT}
spec:
  replication:
    automatic: true
