apiVersion: cloudfunctions2.gcp.hfl.dev/v1beta1
kind: CloudFunctions2Function
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: us-central1
  buildConfig:
    runtime: python312
    entryPoint: main
    source:
      storageSource:
        # References (kinds.yaml refs) by their IDs; update.yaml sets the
        # strings they resolve to, which changes nothing in the cloud.
        bucketRef:
          external: ${NAME}-source
        objectRef:
          external: function.zip
  serviceConfig:
    availableMemory: 256M
    maxInstanceCount: 1
    secretEnvironmentVariables:
    - key: API_TOKEN
      secretRef:
        name: ${KIND_NAME}-secret
      version: latest
  description: made by a config-connector-extensions test
