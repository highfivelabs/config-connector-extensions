apiVersion: dataplex.gcp.hfl.dev/v1beta1
kind: DataplexZone
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: us-central1
  # A reference (kinds.yaml refs) to the lake the Setup makes;
  # update.yaml sets its ID.
  lakeRef:
    external: projects/${PROJECT}/locations/us-central1/lakes/${NAME}-lake
  type: RAW
  resourceSpec:
    locationType: SINGLE_REGION
  discoverySpec:
    enabled: false
  description: made by a config-connector-extensions test
