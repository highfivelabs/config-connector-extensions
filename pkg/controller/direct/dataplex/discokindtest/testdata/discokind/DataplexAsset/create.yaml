apiVersion: dataplex.gcp.hfl.dev/v1beta1
kind: DataplexAsset
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: us-central1
  # References (kinds.yaml refs) to the lake and zone the Setup makes;
  # update.yaml sets their IDs.
  lakeRef:
    external: projects/${PROJECT}/locations/us-central1/lakes/${NAME}-lake
  zoneRef:
    external: projects/${PROJECT}/locations/us-central1/lakes/${NAME}-lake/zones/${NAME}-zone
  resourceSpec:
    name: projects/${PROJECT}/buckets/${NAME}-bucket
    type: STORAGE_BUCKET
  discoverySpec:
    enabled: false
  description: made by a config-connector-extensions test
