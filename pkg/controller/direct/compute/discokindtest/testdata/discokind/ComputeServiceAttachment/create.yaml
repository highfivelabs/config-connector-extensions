apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeServiceAttachment
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  region: us-central1
  # References (kinds.yaml refs); update.yaml sets the strings.
  targetServiceRef:
    external: projects/${PROJECT}/regions/us-central1/forwardingRules/${NAME}-fr
  natSubnetRefs:
  - external: projects/${PROJECT}/regions/us-central1/subnetworks/${NAME}-nat
  connectionPreference: ACCEPT_MANUAL
  consumerAcceptLists:
  - projectIdOrNum: ${PROJECT}
    connectionLimit: 2
  - networkUrlRef:
      external: projects/${PROJECT}/global/networks/${NAME}-net
    connectionLimit: 1
  domainNames: [${NAME}.example.com.]
  enableProxyProtocol: false
  reconcileConnections: false
  description: made by a config-connector-extensions test
