apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeServiceAttachment
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  region: us-central1
  targetService: projects/${PROJECT}/regions/us-central1/forwardingRules/${NAME}-fr
  natSubnets:
  - projects/${PROJECT}/regions/us-central1/subnetworks/${NAME}-nat
  connectionPreference: ACCEPT_MANUAL
  consumerAcceptLists:
  - projectIdOrNum: ${PROJECT}
    connectionLimit: 2
  - networkUrl: projects/${PROJECT}/global/networks/${NAME}-net
    connectionLimit: 1
  domainNames: [${NAME}.example.com.]
  enableProxyProtocol: false
  reconcileConnections: false
  description: made by a config-connector-extensions test
