# The hand-written example of Crossplane's Upjet provider for Google Cloud,
# v3.1.0 (9fc3f0375399ebd62666438e873b3d331310af5e):
# examples/certificatemanager/cluster/v1beta1/trustconfig.yaml
# (Apache-2.0), with our object's names (docs/coverage/upjet.md).
# hack/upjet keeps no certificate values from it; these are our own.
# The certificates are self-signed test certificates made for this
