apiVersion: networkservices.gcp.hfl.dev/v1beta1
kind: NetworkServicesGateway
metadata:
  name: ${NAME}
spec:
  projectRef:
    external: ${PROJECT}
  location: us-central1
  type: SECURE_WEB_GATEWAY
  ports: [443]
  routingMode: EXPLICIT_ROUTING_MODE
  # References (kinds.yaml refs); update.yaml sets the strings they
  # resolve to, which changes nothing in the cloud.
  networkRef:
    external: projects/${PROJECT}/global/networks/${KIND_NAME}-net
  subnetworkRef:
    external: projects/${PROJECT}/regions/us-central1/subnetworks/${KIND_NAME}-subnet
  gatewaySecurityPolicyRef:
    name: ${KIND_NAME}-gsp
  certificateUrlRefs:
  - external: projects/${PROJECT}/locations/us-central1/certificates/${KIND_NAME}-cert
  labels:
    purpose: swg-test
  description: made by a config-connector-extensions test
